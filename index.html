function subject(sid,e=exam()){return e?.subjects.find(s=>s.id===sid)}

function topicStats(sid,tid,days=null){return stats((days?periodSessions(days):exam().sessions).filter(x=>x.subjectId===sid&&(!tid||x.topicId===tid)))}
function lastStudied(sid,tid){return exam().sessions.filter(x=>x.subjectId===sid&&(!tid||x.topicId===tid)&&x.date<=today()).map(x=>x.date).sort().at(-1)}
function topicPriority(s,t){const st=topicStats(s.id,t.id,30),last=lastStudied(s.id,t.id);const smooth=(st.c+5)/(st.q+10);const days=last?Math.min(30,Math.max(0,diffDays(last,today()))):15;const due=t.nextReview&&t.nextReview<=today();return s.weight*3+t.weight*1.5+(1-smooth)*10+days*.22+(t.stage==='new'?3:0)+(due?6:0)-(t.stage==='mastered'?3:0)}
function recommendations(){return allTopics().filter(x=>!x.s.archived).map(x=>({...x,score:topicPriority(x.s,x.t)})).sort((a,b)=>b.score-a.score)}

function streak(){const dates=new Set(exam().sessions.filter(s=>s.minutes>0||s.qty>0).map(s=>s.date));let day=dates.has(today())?today():addDays(today(),-1),n=0;while(dates.has(day)){n++;day=addDays(day,-1)}return n}
const btn=(label,action,extra='',kind='secondary')=>`<button class="${kind}" data-action="${action}" ${extra}>${label}</button>`;
const tag=(text,kind='')=>`<span class="tag ${kind}">${esc(text)}</span>`;
const progress=(current,total)=>`<div class="progress" role="progressbar" aria-valuenow="${Math.min(100,Math.round(current/(total||1)*100))}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.max(0,Math.min(100,current/(total||1)*100))}%"></span></div>`;
const heading=(title,subtitle,actions='')=>`<div class="page-heading"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="heading-actions">${actions}</div></div>`;
const empty=(title,text,button='')=>`<div class="empty"><div class="empty-mark">+</div><h3>${title}</h3><p>${text}</p>${button}</div>`;

const metric=(label,value,foot='')=>`<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`;
function subjectOptions(sel){return exam().subjects.filter(s=>!s.archived||s.id===sel).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('')}
function topicOptions(sid,sel){return `<option value="">Estudo geral da matéria</option>`+(subject(sid)?.topics||[]).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)}</option>`).join('')}
function selection(sid,tid){return `<label>Matéria<select name="subjectId" id="form-subject" required>${subjectOptions(sid)}</select></label><label>Assunto<select name="topicId" id="form-topic">${topicOptions(sid||exam().subjects.find(s=>!s.archived)?.id,tid)}</select></label>`}

  const due=exam()?dueTopics().length+dueCards().length:0;
  $('#nav').innerHTML=routes.map(([r,label],i)=>`${i===8?'<div class="nav-divider"></div>':''}<a class="nav-item ${route===r?'active':''}" href="#${r}" ${route===r?'aria-current="page"':''}><span class="nav-index">${String(i+1).padStart(2,'0')}</span>${label}${r==='revisoes'&&due?`<span class="count-badge">${due}</span>`:''}</a>`).join('');

  $('#content').innerHTML=(storageProblem?`<div class="note warn" style="margin-bottom:20px">${esc(storageProblem)} ${btn('Exportar backup','export','','secondary small')}${recoveryRaw?btn('Baixar dados para recuperação','recovery-export','','secondary small'):''}</div>`:'')+(exam()&&route==='hoje'?guideInvitation():'')+(!exam()&&!['ajustes','guia','ia'].includes(route)?viewWelcome():views[route]());

 const e=exam(),st=stats(e.sessions.filter(s=>s.date===today())),week=stats(periodSessions(7)),recs=recommendations(),next=e.plans.find(p=>p.date===today()&&p.status==='planned'),rec=next?{s:subject(next.subjectId),t:topic(next.subjectId,next.topicId)}:recs[0],dues=dueTopics(),cards=dueCards();
 const title=rec?.t?rec.t.name:'Seu edital, seu ponto de partida';

 return heading(`Seu estudo de hoje.`,`${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · ${esc(db.name)}${days!==null?` · ${days>=0?days+' dias até a prova':'Data da prova passou'}`:''}`,btn('Planejar semana','navigate','data-route="plano"'))+
 `<div class="metrics">${metric('Tempo de estudo',minutesLabel(st.m),`${Math.round(st.m/(e.dailyMinutes||1)*100)}% da meta de hoje`)}${metric('Questões resolvidas',st.q,`Meta diária: ${e.dailyQuestions}`)}${metric('Acertos de hoje',st.accuracy===null?'Sem dados':st.accuracy+'%',st.q?`${st.c} acertos em ${st.q} questões`:'Registre suas primeiras questões')}${metric('Constância',`${streak()} <span>dias</span>`,'Dias com estudo ou questões')}</div>`+
 `<div class="grid two"><div><section class="hero"><div>${tag(next?'Próximo no seu plano':'Sugestão para começar','blue')}<h2>${esc(title)}</h2><p>${rec?.t?`${esc(rec.s.name)} · ${esc(reason(rec.s,rec.t))}.`:'Adicione os tópicos do seu edital para receber sugestões explicadas.'}</p><div class="actions">${rec?.t?btn('Iniciar sessão de foco','start-focus',`data-sid="${rec.s.id}" data-tid="${rec.t.id}" ${next?`data-pid="${next.id}"`:''}`,'primary'):btn('Organizar meu edital','navigate','data-route="edital"','primary')}${btn('Registrar um estudo','session')}</div></div><div class="hero-monogram" aria-hidden="true">n.</div></section>
 <section class="panel">${panelHead('Seu plano de hoje',`${activity.length} atividades planejadas`,btn('Ver semana','navigate','data-route="plano"','quiet small'))}${activity.length?activity.map(planRow).join(''):empty('Ainda sem plano para hoje','Escolha seus horários e gere uma semana possível de cumprir.',btn('Montar planejamento','navigate','data-route="plano"'))}</section>

function viewSyllabus(){const e=exam(),topics=allTopics(),covered=topics.filter(x=>['covered','mastered'].includes(x.t.stage)).length;return heading('Seu edital, em pequenos passos.','Personalize matérias, pesos e assuntos. A preparação começa pelo que sua prova exige.',btn('Adicionar matéria','subject-new','','primary'))+
 `<div class="metrics">${metric('Matérias ativas',e.subjects.filter(s=>!s.archived).length)}${metric('Assuntos',topics.length)}${metric('Teoria concluída',covered,`${topics.length?Math.round(covered/topics.length*100):0}% do edital`)}${metric('Consolidados',topics.filter(x=>x.t.stage==='mastered').length,'Marcados por você')}</div><div class="filters"><input id="topic-search" placeholder="Buscar matéria ou assunto" value="${esc(topicFilter)}" aria-label="Buscar no edital"><select id="topic-status" aria-label="Filtrar etapa"><option value="all">Todas as etapas</option>${stages.map(([v,l])=>`<option value="${v}" ${topicStatus===v?'selected':''}>${l}</option>`).join('')}</select></div>

function viewFocus(){const e=exam(),timer=db.timer;return heading('Uma coisa de cada vez.','Escolha um assunto. Feche as distrações. Comece um pequeno bloco de estudo.')+`<div class="grid two"><section class="panel timer-panel"><div class="segmented"><button class="${timer?.mode==='free'?'':'active'}" data-action="focus-mode" data-mode="countdown">Bloco de foco</button><button class="${timer?.mode==='free'?'active':''}" data-action="focus-mode" data-mode="free">Cronômetro livre</button></div><div class="timer-select">${timer?`<h2>${esc(topicName(timer.subjectId,timer.topicId,db.exams.find(e=>e.id===timer.examId)))}</h2><p>${esc(db.exams.find(e=>e.id===timer.examId)?.subjects.find(s=>s.id===timer.subjectId)?.name||'Sessão em andamento')}</p>`:`<label>Matéria<select id="focus-subject">${subjectOptions()}</select></label><label>Assunto<select id="focus-topic">${topicOptions(e.subjects.find(s=>!s.archived)?.id)}</select></label><label>Duração do bloco<select id="focus-duration"><option value="25">25 minutos</option><option value="30" selected>30 minutos</option><option value="45">45 minutos</option><option value="50">50 minutos</option></select></label>`}</div><div class="timer-circle"><div><div class="timer-count" id="timer-count">${timer?'00:00':'30:00'}</div><small id="timer-status">Pronto quando você estiver.</small></div></div><div class="actions">${timer?btn(timer.running?'Pausar':'Continuar','timer-toggle','','primary')+btn('Concluir e registrar','timer-finish')+btn('Descartar','timer-discard','','quiet'):btn('Começar a estudar','timer-start','','primary')}</div><p style="margin-top:22px">O tempo real só entra no histórico depois que você registra a sessão.</p></section><aside class="stack"><section class="panel">${panelHead('Faça o tempo valer')}<div class="insight"><h3>Antes de começar</h3><p>Defina uma tarefa concreta: resolver 15 questões, entender um conceito ou revisar seus erros.</p></div><div class="insight"><h3>Durante o bloco</h3><p>Explique com suas pr  `<div class="metrics">${metric('Questões resolvidas',q.q)}${metric('Acerto acumulado',q.accuracy===null?'Sem dados':q.accuracy+'%',`${q.c} acertos`)}${metric('Erros nas questões',q.q-q.c)}${metric('Pendências no caderno',e.mistakes.filter(m=>!m.resolved).length,'Dificuldades registradas por você')}</div><div class="grid two"><section class="panel">${panelHead('Caderno de erros','Registre o motivo e a regra correta',btn('+ Anotar erro','mistake-new','','secondary small'))}<div class="segmented" style="margin-bottom:15px">${[['open','Pendentes'],['resolved','Resolvidos'],['all','Todos']].map(([v,l])=>`<button class="${mistakeFilter===v?'active':''}" data-action="mistake-filter" data-value="${v}">${l}</button>`).join('')}</div>${mistakes.length?mistakes.map(m=>`<div class="insight"><div class="spread"><h3>${esc(m.title)}</h3>${tag(m.resolved?'Resolvido':m.category,m.resolved?'green':'amber')}</div><small>${esc(subjectName(m.subjectId))} · ${esc(topicName(m.subjectId,m.topicId))}</small><p class="detail-text" style="margin-top:10px">${esc(m.explanation)}</p><div class="actions" style="margin-top:13px">${btn('Editar','mistake-edit',`data-id="${m.id}"`,'quiet small')}${btn('Entender com IA','ai-from-mistake',`data-id="${m.id}"`,'quiet small')}${btn('Criar cartão','card-from-mistake',`data-id="${m.id}"`,'secondary small')}${btn(m.resolved?'Reabrir':'Marcar resolvido','mistake-resolve',`data-id="${m.id}"`,'quiet small')}</div></div>`).join(''):empty('O erro pode virar aprendizado','Anote o conceito que confundiu você e como chegar à resposta correta.',btn('Anotar dificuldade','mistake-new'))}</section><aside class="stack"><section class="panel">${panelHead('Desempenho por matéria','Histórico de questões registrado')} ${e.subjects.filter(s=>!s.archived).map(s=>{const st=topicStats(s.id,null);return `<div class="goal-row"><div class="spread"><span>${esc(s.name)}</span><strong>${st.q?st.accuracy+'%':'Sem dados'}</strong></div>${progress(st.c,st.q)}<small>${st.q} questões · ${ function viewAnalytics(){const e=exam(),sessions=periodSessions(analyticsDays),st=stats(sessions),days=new Set(sessions.map(s=>s.date)).size,start=addDays(today(),1-analyticsDays),prev=stats(e.sessions.filter(s=>s.date>=addDays(start,-analyticsDays)&&s.date<start)),recs=recommendations(),buckets=Array.from({length:analyticsDays<=14?analyticsDays:10},(_,i)=>{const span=analyticsDays<=14?1:Math.ceil(analyticsDays/10),a=addDays(start,i*span),b=addDays(start,Math.min(analyticsDays-1,(i+1)*span-1));return {date:a,...stats(sessions.filter(s=>s.date>=a&&s.date<=b))}}).filter(x=>x.date<=today()),max=Math.max(30,...buckets.map(x=>x.m));return heading('Veja o que está mudando.','Compare esforço, cobertura e resultados sem confundir uma medida com a outra.',btn('Exportar registros','csv'))+`<div class="filters"><div class="segmented">${[7,14,30,90].map(n=>`<button class="${analyticsDays===n?'active':''}" data-action="analytics-range" data-days="${n}">${n} dias</button>`).join('')}</div><small>${dateLabel(start)} até ${dateLabel(today())}</small></div><div class="metrics">${metric('Tempo estudado',minutesLabel(st.m),`${st.m>=prev.m?'+':''}${minutesLabel(st.m-prev.m)} vs. período anterior`)}${metric('Questões resolvidas',st.q,`${st.q-prev.q>=0?'+':''}${st.q-prev.q} vs. período anterior`)}${metric('Acerto no período',st.accuracy===null?'Sem dados':st.accuracy+'%',prev.accuracy===null?'Sem referência anterior':`${st.accuracy===null?'Sem dados atuais':(st.accuracy-prev.accuracy>=0?'+':'')+(st.accuracy-prev.accuracy)+' pontos percentuais'}`)}${metric('Dias ativos',`${days} <span>/ ${analyticsDays}</span>`,`${Math.round(days/analyticsDays*100)}% dos dias com estudo`)}</div><div class="grid two"><section class="panel">${panelHead('Tempo de estudo','Minutos por dia ou grupo de dias')}<div class="chart" role="img" aria-label="Gráfico de minutos estudados no período">${buckets.map(x=>`<div class="chart-col" title="${dateLabel(x.date)}: ${minutesLabel(x.m)}"><span class="chart-value">${x.m||''}</span><div class="chart-bar" style="height:${x.m/max*155}px"></div><small>${dateLabel(x.date)}</small></div>`).join('')}</div><div class="screen-reader">${buckets.map(x=>`${dateLabel(x.date)}: ${x.m} minutos`).join('; ')}</div></section><section class="panel">${panelHead('Constância nos últimos 56 dias','Cada quadrado representa um dia de estudo')}<div class="heatmap">${Array.from({length:56},(_,i)=>{const d=addDays(today(),i-55),st=stats(e.sessions.filter(s=>s.date===d)),level=st.m>=90?3:st.m>=30?2:st.m>0||st.q>0?1:0;return `<div class="heat-cell" data-level="${level}" role="img" aria-label="${dateLabel(d)}: ${st.m} minutos e ${st.q} questões" title="${dateLabel(d)}: ${minutesLabel(st.m)}, ${st.q} questões"></div>`}).join('')}</div><small>Mais intensidade indica mais tempo. Questões sem tempo também contam como atividade.</small></section><section class="panel">${panelHead('Resultado por matéria','O tamanho da amostra aparece junto ao percentual')}<div class="table-wrap"><table><thead><tr><th>Matéria</th><th>Tempo</th><th>Questões</th><th>Acerto</th></tr></thead><tbody>${e.subjects.map(s=>{const st=stats(sessions.filter(x=>x.subjectId===s.id));return `<tr><td>${esc(s.name)}</td><td>${minutesLabel(st.m)}</td><td>${st.q}</td><td>${st.accuracy===null?'Sem dados':st.accuracy+'%'}${st.q>0&&st.q<10?'<small>Amostra pequena</small>':''}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel">${panelHead('Leituras para a próxima semana')}<div class="insight"><h3>${st.q<20?'Construa uma base de questões':'Compare assuntos, não apenas horas'}</h3><p>${st.q<20?'Ainda há poucas questões no período. Registre mais resultados antes de concluir que um assunto está dominado.':'Procure assuntos com mais erros e uma quantidade suficiente de questões para escolher seu próximo reforço.'}</p></div>${recs.slice(0,3).map(x=>`<div class="insight"><h3>${esc(x.t.name)}</h3><p>${esc(reason(x.s,x.t))}.</p></div>`).join('')}</section></div>`}
function viewMocks(){const e=exam(),mocks=e.mockExams||[];return heading('Treine o dia da prova.','Registre um simulado por matéria, confira o tempo e escolha seu próximo reforço.',btn('Registrar simulado','mock-new','','primary'))+`<div class="grid two"><section class="stack">${mocks.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>{const records=e.sessions.filter(s=>m.sessionIds.includes(s.id)),st=stats(records),score=st.c-(st.q-st.c)*m.penalty;return `<article class="panel">${panelHead(esc(m.name),`${dateLabel(m.date,true)} · ${minutesLabel(st.m)} usados${m.timeLimit?' de '+minutesLabel(m.timeLimit):''}`,btn('Excluir','mock-delete',`data-id="${m.id}"`,'quiet small'))}<div class="inline-stats"><strong>${st.q} questões</strong><strong>${st.accuracy===null?'Sem dados':st.accuracy+'% de acerto'}</strong><strong>${score.toLocaleString('pt-BR')} pontos líquidos</strong></div><div style="margin:20px 0">${progress(st.c,st.q)}</div>${records.map(s=>`<div class="row"><div class="row-main"><h3>${esc(subjectName(s.subjectId))}</h3><p>${s.correct}/${s.qty} acertos · ${minutesLabel(s.minutes)}${s.notes?' · '+esc(s.notes):''}</p></div>${btn('Corrigir','session-edit',`data-id="${s.id}"`,'quiet small')}</div>`).join('')}<p class="form-help">Pontuação: 1 por acerto${m.penalty?', menos '+m.penalty.toLocaleString('pt-BR')+' por erro':', sem desconto por erro'}. Questões em branco não entram neste cálculo.</p></article>`}).join('')||`<section class="panel">${empty('Pratique sob condições reais','Use um simulado de sua escolha e registre tempo e resultado por matéria.',btn('Registrar primeiro simulado','mock-new'))}</section>`}</section><aside class="stack"><section class="panel">${panelHead('Depois do simulado')}<div class="insight"><h3>Confira o tempo por matéria</h3><p>Uma matéria com bom acerto e muito tempo pode precisar de treino de ritmo.</p></div><div class="insight"><h3>Separe os tipos de erro</h3><p>Registre no caderno o que foi falta de conteúdo, interpretação ou atenção.</p></div><div class="insight"><h3>Replaneje o reforço</h3><p>Os resultados entram no desempenho recente e influenciam as sugestões de estudo.</p></div></section><div class="note">Cada matéria vira um registro no histórico. O simulado reúne esses registros e conta o tempo uma única vez.</div></aside></div>`}

function viewSettings(){const e=exam();return heading('Seu ritmo, suas escolhas.','Ajuste sua preparação e mantenha seus dados com você.',btn('Nova preparação','exam-new','','primary'))+`<div class="grid equal"><section class="panel">${panelHead('Seu perfil')}<form id="profile-form"><label>Como quer ser chamado?<input name="name" value="${esc(db.name)}" maxlength="80" required></label><label style="margin-top:15px">Aparência<select name="theme"><option value="light" ${db.theme==='light'?'selected':''}>Clara</option><option value="dark" ${db.theme==='dark'?'selected':''}>Escura</option></select></label><div class="actions" style="margin-top:20px"><button class="primary small">Salvar perfil</button></div></form></section><section class="panel">${panelHead('Seus dados ficam com você')}<p style="font-size:.84rem;margin-bottom:18px">O Norte funciona offline e salva no navegador deste aparelho. A sincronização entre dispositivos é feita por exportação e importação de backup.</p><div class="actions">${btn('Exportar backup','export','','primary')}${btn('Importar backup','import')}</div><p class="form-help">Aceita o backup do Norte e o JSON exportado pelo seu painel anterior. A importação aparece para revisão antes de ser aplicada.</p>${btn('Conhecer exemplo em outra preparação','demo','','quiet small')}</section>${e?`<section class="panel">${panelHead('Sua preparação')}<form id="exam-settings" class="form-grid"><label class="full">Nome da preparação<input name="name" value="${esc(e.name)}" required maxlength="120"></label><label>Cargo<input name="position" value="${esc(e.position)}" maxlength="150"></label><label>Banca<input name="board" value="${esc(e.board)}" maxlength="120"></label><label class="full">Data da prova<input name="date" type="date" value="${e.date}"></label><label>Meta diária de minutos<input name="dailyMinutes" type="number" min="5" max="1440" value="${e.dailyMinutes}" required></label><label>Meta diária de questões<input name="dailyQuestions" type="number" min="1" max="5000" value="${e.dailyQuestions}" required></label><label>Meta semanal de minutos<input name="weeklyMinutes" type="number" min="5" max="10080" value="${e.weeklyMinutes}" required></label><label>Referência de acerto (%)<input name="targetAccuracy" type="number" min="1" max="100" value="${e.targetAccuracy}" required></label><label>Duração dos blocos<select name="blockMinutes">${[25,30,40,45,50].map(n=>`<option value="${n}" ${e.blockMinutes===n?'selected':''}>${n} minutos</option>`).join('')}</select></label><div class="full"><button class="primary small">Salvar preparação</button></div></form></section><section class="panel">${panelHead('Disponibilidade semanal','Sem sobrecarregar os seus dias')}<form id="availability-form">${availabilityFields(e)}<div class="actions" style="margin-top:18px"><button class="primary small">Salvar horários</button></div><p class="form-help">Os horários devem começar e terminar no mesmo dia. Desative os dias de descanso.</p></form></section>`:''}<section class="panel">${panelHead('Como usar bem o Norte')}<div class="insight"><h3>1. Personalize o edital</h3><p>Cadastre os tópicos e ajuste os pesos à importância deles na sua prova.</p></div><div class="insight"><h3>2. Planeje e execute</h3><p>Gere a semana, escolha uma tarefa e registre o resultado real.</p></div><div class="insight"><h3>3. Revise e ajuste</h3><p>Retome dificuldades, pratique cartões e acompanhe a evolução por assunto.</p></div></section><section class="panel">${panelHead('Portabilidade e recuperação')}<p style="font-size:.84rem;margin-bottom:15px">Baixe um backup regularmente, especialmente antes de limpar os dados do navegador ou trocar de aparelho. Preparações são separadas dentro deste aplicativo.</p>${e?btn('Excluir esta preparação','exam-delete','','danger'):''}<p class="form-help">A exclusão exige confirmação e oferece a opção de desfazer imediatamente.</p></section></div>`}

function modal(title,subtitle,body,submit='Salvar',handler=null,extra=''){

function openExam(){modal('Sua próxima conquista','Comece com seu objetivo. Depois, personalize o edital.',`<div class="form-grid"><label class="full">Nome da preparação<input name="name" required maxlength="120" placeholder="Ex.: Concurso administrativo"></label><label>Cargo<input name="position" maxlength="150" placeholder="Opcional"></label><label>Banca<input name="board" maxlength="120" placeholder="Opcional"></label><label class="full">Data da prova<input type="date" name="date"></label><label class="full">Matérias iniciais<select name="base"><option value="standard">Base geral para personalizar</option><option value="empty">Começar com edital vazio</option></select></label><p class="full form-help">A base é um exemplo organizacional. Confira cada assunto no seu edital.</p></div>`,'Criar preparação',d=>{const e=newExam(d.name.trim());if(!e.name)throw Error('Informe um nome.');Object.assign(e,{position:d.position.trim(),board:d.board.trim(),date:d.date});if(d.base==='standard')e.subjects=baseSubjects();db.exams.push(e);db.activeExam=e.id;closeModal();go('hoje');commit('Preparação criada. Personalize o edital.');})}
function baseSubjects(){return [['Língua Portuguesa',5,['Interpretação de textos','Concordância verbal e nominal','Regência e crase','Pontuação']],['Raciocínio Lógico',4,['Proposições e conectivos','Equivalências e negações','Porcentagem e proporção']],['Direito Constitucional',4,['Princípios fundamentais','Direitos e garantias fundamentais','Organização do Estado']],['Direito Administrativo',4,['Princípios da Administração Pública','Atos administrativos','Licitações e contratos']],['Informática',3,['Sistemas operacionais','Planilhas eletrônicas','Segurança da informação']]].map(([name,weight,topics])=>({id:id(),name,weight,archived:false,topics:topics.map(name=>({id:id(),name,weight:3,stage:'new',notes:'',nextReview:null,reviewCount:0}))}))}

function makeTopics(text){const names=[...new Set(text.split('\n').map(x=>x.trim()).filter(Boolean))];if(names.some(x=>x.length>250))throw Error('Use até 250 caracteres por assunto.');if(names.length>1000)throw Error('Adicione até 1.000 assuntos por vez.');return names.map(name=>({id:id(),name,weight:3,stage:'new',notes:'',nextReview:null,reviewCount:0}))}
function openTopic(sid,tid){const s=subject(sid),t=topic(sid,tid);modal(t?'Detalhes do assunto':'Adicionar assuntos',esc(s.name),t?`<div class="form-grid"><label class="full">Assunto<input name="name" value="${esc(t.name)}" required maxlength="250"></label><label>Peso (1 a 5)<input name="weight" type="number" min="1" max="5" value="${t.weight}" required></label><label>Etapa<select name="stage">${stages.map(([v,l])=>`<option value="${v}" ${v===t.stage?'selected':''}>${l}</option>`).join('')}</select></label><label class="full">Próxima revisão<input type="date" name="nextReview" value="${t.nextReview||''}"></label><label class="full">Notas do assunto<textarea name="notes" rows="5">${esc(t.notes)}</textarea></label></div>`:`<label>Assuntos, um por linha<textarea name="topics" rows="8" required placeholder="Cole os tópicos do seu edital"></textarea></label>`,'Salvar',d=>{if(t){if(!d.name.trim()||!num(d.weight,1,5))throw Error('Confira nome e peso do assunto.');Object.assign(t,{name:d.name.trim(),weight:+d.weight,stage:d.stage,nextReview:d.nextReview||null,notes:d.notes.trim()})}else{const existing=new Set(s.topics.map(t=>t.name.toLowerCase()));const added=makeTopics(d.topics).filter(t=>!existing.has(t.name.toLowerCase()));if(!added.length)throw Error('Inclua pelo menos um assunto novo.');s.topics.push(...added)}closeModal();commit('Edital atualizado.');},t?btn('Excluir assunto','topic-delete',`data-sid="${sid}" data-tid="${tid}"`,'danger small'):'')}

  if(s)Object.assign(s,record);else e.sessions.push(record);

  if(timer)db.timer=null;closeModal();commit('Sessão registrada. Bom trabalho.');

function openMock(){const e=exam(),subjects=e.subjects.filter(s=>!s.archived);if(!subjects.length)return toast('Adicione matérias ao edital primeiro.');modal('Registrar simulado','Informe o resultado por matéria, sem repetir uma sessão já registrada.',`<div class="form-grid"><label class="full">Nome do simulado<input name="name" maxlength="200" placeholder="Ex.: Simulado completo 01" required></label><label>Data<input name="date" type="date" value="${today()}" max="${today()}" required></label><label>Tempo máximo previsto (min)<input name="timeLimit" type="number" value="180" min="1" max="1440" required></label><label class="full">Desconto por erro<select name="penalty"><option value="0">Sem desconto</option><option value="0.5">0,5 ponto</option><option value="1">1 ponto</option></select></label></div><div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>Matéria</th><th>Resolvidas</th><th>Acertos</th><th>Minutos</th></tr></thead><tbody>${subjects.map(s=>`<tr><td>${esc(s.name)}</td><td><input type="number" name="qty-${s.id}" value="0" min="0" max="100000" aria-label="Questões de ${esc(s.name)}" required></td><td><input type="number" name="correct-${s.id}" value="0" min="0" max="100000" aria-label="Acertos de ${esc(s.name)}" required></td><td><input type="number" name="minutes-${s.id}" value="0" min="0" max="1440" aria-label="Minutos de ${esc(s.name)}" required></td></tr>`).join('')}</tbody></table></div><label style="margin-top:18px">O que ajustar no próximo simulado?<textarea name="notes" rows="3"></textarea></label>`,'Salvar simulado',d=>{if(!d.name.trim()||!validDate(d.date)||d.date>today())throw Error('Confira o nome e a data.');const records=[];for(const s of subjects){const qty=+d['qty-'+s.id],correct=+d['correct-'+s.id],minutes=+d['minutes-'+s.id];if(!num(qty,0,100000)||!Number.isInteger(qty)||!num(correct,0,qty)||!Number.isInteger(correct)||!num(minutes,0,1440)||!Number.isInteger(minutes))throw Error('Confira os números de '+s.name+'.');if(qty||minutes)records.push({id:id(),date:d.date,created:new Date().toISOString(),subjectId:s.id,topicId:null,type:'Simulado',minutes,qty,correct,notes:d.notes.trim(),board:e.board,source:'mock',planId:null})}if(!records.length)throw Error('Informe o resultado de pelo menos uma matéria.');if(stats(records).m>1440)throw Error('O tempo total não pode superar 24 horas.');e.sessions.push(...records);e.mockExams??=[];e.mockExams.push({id:id(),name:d.name.trim(),date:d.date,timeLimit:+d.timeLimit,penalty:+d.penalty,sessionIds:records.map(s=>s.id)});closeModal();commit('Simulado registrado sem duplicar o tempo.');})}
function openPlan(pid){const p=exam().plans.find(x=>x.id===pid),sid=p?.subjectId||exam().subjects.find(s=>!s.archived)?.id;if(!sid)return toast('Adicione matérias e assuntos primeiro.');modal(p?'Editar atividade':'Planejar atividade','Escolha um horário e uma tarefa possível.',`<div class="form-grid">${selection(sid,p?.topicId)}<label>Data<input type="date" name="date" value="${p?.date||planDate}" required></label><label>Tipo<select name="type"><option ${p?.type==='Teoria'?'selected':''}>Teoria</option><option ${p?.type==='Revisão'?'selected':''}>Revisão</option><option ${p?.type==='Questões'?'selected':''}>Questões</option></select></label><label>Início<input type="time" name="start" value="${p?.start||'19:00'}" required></label><label>Fim<input type="time" name="end" value="${p?.end||'19:30'}" required></label><label class="full">Tarefa ou objetivo<input name="reason" value="${esc(p?.reason||'')}" maxlength="250" placeholder="Ex.: resolver 15 questões e corrigir os erros"></label>${p?`<label class="full">Estado<select name="status"><option value="planned" ${p.status==='planned'?'selected':''}>Planejada</option><option value="skipped" ${p.status==='skipped'?'selected':''}>Adiada</option></select></label>`:''}</div>`,'Salvar atividade',d=>{if(timeMin(d.end)<=timeMin(d.start))throw Error('O fim precisa ser depois do início no mesmo dia.');if(exam().plans.some(x=>x.id!==pid&&x.date===d.date&&x.status!=='skipped'&&timeMin(x.start)<timeMin(d.end)&&timeMin(x.end)>timeMin(d.start)))throw Error('Este horário se sobrepõe a uma atividade existente.');const data={id:p?.id||id(),date:d.date,start:d.start,end:d.end,subjectId:d.subjectId,topicId:d.topicId||null,type:d.type,reason:d.reason.trim(),status:d.status||'planned',sessionId:p?.sessionId||null};if(p)Object.assign(p,data);else exam().plans.push(data);planDate=d.date;closeModal();commit('Atividade salva.');},p?btn('Excluir atividade','plan-delete',`data-id="${p.id}"`,'danger small'):'')}
function openGenerator(){if(!allTopics().filter(x=>!x.s.archived).length)return toast('Adicione pelo menos um assunto no edital.');const e=exam();modal('Monte seu próximo plano','Você poderá revisar a sugestão antes de aplicá-la.',`<div class="form-grid"><label>Data inicial<input name="start" type="date" value="${planDate<today()?today():planDate}" min="${today()}" required></label><label>Período<select name="days"><option value="7">7 dias</option><option value="14">14 dias</option><option value="30">30 dias</option></select></label><label>Duração dos blocos<select name="block">${[25,30,40,45,50].map(n=>`<option value="${n}" ${e.blockMinutes===n?'selected':''}>${n} minutos</option>`).join('')}</select></label><label>Atividades existentes<select name="replace"><option value="keep">Preservar e usar horários livres</option><option value="replace">Substituir apenas as não concluídas</option></select></label><div class="full"><h3 style="margin:12px 0">Seus horários nesta geração</h3>${availabilityFields(e)}</div><p class="form-help full">Uma pausa de 5 minutos separa os novos blocos. Dias sem disponibilidade ficam livres. Registros concluídos são preservados.</p></div>`,'Ver sugestão', (d,form)=>{const availability=readAvailability(d);previewPlan=generatePlan(e,d.start,+d.days,+d.block,availability,d.replace==='replace');if(!previewPlan.length)throw Error('Não há horários livres de pelo menos 10 minutos no período.');const removed=d.replace==='replace'?e.plans.filter(p=>p.date>=d.start&&p.date<addDays(d.start,+d.days)&&p.status!=='done').length:0;modal('Seu plano está pronto',`${previewPlan.length} atividades · ${minutesLabel(previewPlan.reduce((a,p)=>a+timeMin(p.end)-timeMin(p.start),0))} · ${removed} atividades serão substituídas.`,`<div class="note">A prioridade usa dados atuais. Reavalie a semana conforme você estuda.</div><div class="preview-list">${previewPlan.map(p=>`<div class="row"><div class="row-time">${dateLabel(p.date)}<br>${p.start}</div><div class="row-main"><h3>${esc(topicName(p.subjectId,p.topicId))}</h3><p>${esc(subjectName(p.subjectId))} · ${timeMin(p.end)-timeMin(p.start)}min · ${esc(p.reason)}</p></div></div>`).join('')}</div>`,'Aplicar planejamento',()=>{snapshot();if(d.replace==='replace')e.plans=e.plans.filter(p=>p.date<d.start||p.date>=addDays(d.start,+d.days)||p.status==='done');e.plans.push(...previewPlan);e.availability=availability;e.blockMinutes=+d.block;planDate=d.start;closeModal();commit('Planejamento aplicado.',true)});})}
function readAvailability(d){return Array.from({length:7},(_,day)=>{const enabled=d['enabled-'+day]==='on',start=d['start-'+day],end=d['end-'+day];if(!/^\d\d:\d\d$/.test(start)||!/^\d\d:\d\d$/.test(end)||enabled&&timeMin(end)<=timeMin(start))throw Error('Confira os horários: o fim deve ser depois do início nos dias ativos.');return {day,enabled,start,end}})}
function generatePlan(e,start,days,block,availability,replace){
 if(!validDate(start)||start<today()||!num(days,1,30)||!num(block,10,120))throw Error('Confira a data e a duração do planejamento.');
 const ranked=recommendations(),used={},lastSubject=null;let previousSid=null;const result=[];
 for(let day=0;day<days;day++){const date=addDays(start,day);if(e.date&&date>e.date)break;const a=availability.find(x=>x.day===weekday(date));if(!a?.enabled)continue;
  let cursor=timeMin(a.start),end=timeMin(a.end);const occupied=e.plans.filter(p=>p.date===date&&p.status!=='skipped'&&(!replace||p.status==='done')).map(p=>[timeMin(p.start),timeMin(p.end)]).sort((a,b)=>a[0]-b[0]);
  while(cursor<end){const collision=occupied.find(([s,f])=>cursor>=s&&cursor<f);if(collision){cursor=collision[1];continue}const next=occupied.find(([s])=>s>cursor);const available=Math.min(end,next?.[0]??end)-cursor;if(available<10){cursor=next?next[1]:end;continue}const duration=Math.min(block,available);
   const choice=ranked.map(x=>({...x,adjusted:x.score/(1+(used[x.t.id]||0)*.9)-(x.s.id===previousSid&&ranked.some(y=>y.s.id!==previousSid)?4:0)})).sort((a,b)=>b.adjusted-a.adjusted)[0];
   result.push({id:id(),date,start:hm(cursor),end:hm(cursor+duration),subjectId:choice.s.id,topicId:choice.t.id,status:'planned',sessionId:null,type:choice.t.nextReview&&choice.t.nextReview<=date?'Revisão':'Teoria',reason:reason(choice.s,choice.t),generated:true});used[choice.t.id]=(used[choice.t.id]||0)+duration/block;previousSid=choice.s.id;cursor+=duration+5;
  }
 }
 return result;
}
let focusMode='countdown';
function timerElapsed(t=db.timer){return t?Math.max(0,t.elapsed+(t.running?(Date.now()-t.startedAt)/1000:0)):0}
function startFocus(sid,tid,pid){if(db.timer){go('foco');toast('Você já tem uma sessão aberta.');return}const s=subject(sid);if(!s){go('foco');return}const p=exam().plans.find(p=>p.id===pid);db.timer={examId:exam().id,subjectId:sid,topicId:tid||null,planId:pid||null,date:today(),mode:focusMode,duration:(p?timeMin(p.end)-timeMin(p.start):exam().blockMinutes)*60,elapsed:0,startedAt:Date.now(),running:true,notified:false};persist();go('foco')}
function updateTimer(){const t=db.timer,dock=$('#timer-dock');if(!t){dock.hidden=true;return}let elapsed=timerElapsed(t);if(t.mode==='countdown'&&elapsed>=t.duration&&t.running){t.elapsed=t.duration;t.running=false;t.notified=true;persist();elapsed=t.duration;toast('Bloco concluído. Faça uma pausa e registre seu estudo.');if(route==='foco'){const button=$('[data-action="timer-toggle"]');if(button)button.textContent='Continuar'}}const seconds=t.mode==='free'?elapsed:Math.max(0,t.duration-elapsed);if($('#timer-count'))$('#timer-count').textContent=clockLabel(seconds);if($('#timer-status'))$('#timer-status').textContent=t.running?'Sessão em andamento':t.notified?'Bloco concluído. Hora de uma pausa.':'Sessão pausada';dock.hidden=route==='foco';if(!dock.hidden)dock.innerHTML=`<strong>${clockLabel(seconds)}</strong><span>${t.running?'Estudando':'Pausado'}</span>${btn('Voltar ao foco','navigate','data-route="foco"','quiet small')}`}
function toggleTimer(){const t=db.timer;if(!t)return;if(t.running){t.elapsed=timerElapsed(t);t.running=false}else{if(t.mode==='countdown'&&t.elapsed>=t.duration){toast('Este bloco terminou. Registre para iniciar o próximo.');return}t.startedAt=Date.now();t.running=true}commit()}
function finishTimer(){const t=db.timer;if(!t)return;if(t.running){t.elapsed=timerElapsed(t);t.running=false;persist()}db.activeExam=t.examId;render();sessionForm({sid:t.subjectId,tid:t.topicId,pid:t.planId,minutes:Math.max(1,Math.round(t.elapsed/60)),timer:true})}

function validateBackup(data){

 const weight=v=>num(v,1,5);

 if(!data||data.version!==1||!str(data.name,80)||!['light','dark'].includes(data.theme)||!list(data.exams,100))fail();
 for(const e of data.exams){checkId(e.id);if(!str(e.name,120)||!e.name||!str(e.board,120)||!str(e.position,150)||(e.date&&!validDate(e.date))||!num(e.dailyMinutes,5,1440)||!num(e.dailyQuestions,1,5000)||!num(e.weeklyMinutes,5,10080)||!num(e.targetAccuracy,1,100)||!num(e.blockMinutes,10,120)||!list(e.subjects,1000)||!list(e.sessions)||!list(e.plans)||!list(e.cards)||!list(e.mistakes)||!list(e.resources)||!list(e.availability,7)||e.availability.length!==7)fail();
  const sid=new Set(),tids=new Map();for(const s of e.subjects){checkId(s.id);sid.add(s.id);if(!str(s.name,180)||!s.name||!weight(s.weight)||typeof s.archived!=='boolean'||!list(s.topics,10000))fail();const set=new Set();for(const t of s.topics){checkId(t.id);set.add(t.id);if(!str(t.name,250)||!t.name||!weight(t.weight)||!stages.some(x=>x[0]===t.stage)||!str(t.notes)||t.nextReview&&!validDate(t.nextReview)||!num(t.reviewCount,0,100000))fail()}tids.set(s.id,set)}
  const reference=x=>{if(!sid.has(x.subjectId)||x.topicId&&!tids.get(x.subjectId).has(x.topicId))fail()};
  for(const s of e.sessions){checkId(s.id);reference(s);if(!validDate(s.date)||!str(s.created,50)||!str(s.type,50)||!str(s.notes)||!str(s.board,120)||!num(s.minutes,0,1440)||!Number.isInteger(s.minutes)||!num(s.qty,0,100000)||!Number.isInteger(s.qty)||!num(s.correct,0,s.qty)||!Number.isInteger(s.correct)||!str(s.source,50))fail()}
  for(const p of e.plans){checkId(p.id);reference(p);if(!validDate(p.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(p.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(p.end)||timeMin(p.end)<=timeMin(p.start)||!['planned','done','skipped'].includes(p.status)||!str(p.reason,500)||!str(p.type,50))fail()}
  for(const c of e.cards){checkId(c.id);reference(c);if(!str(c.front)||!c.front||!str(c.back)||!c.back||!validDate(c.due)||!num(c.interval,0,1000)||!num(c.reps,0,100000)||typeof c.suspended!=='boolean')fail()}
  for(const m of e.mistakes){checkId(m.id);reference(m);if(!str(m.title,400)||!str(m.explanation)||!str(m.category,50)||!validDate(m.date)||typeof m.resolved!=='boolean')fail()}
  for(const r of e.resources){checkId(r.id);reference(r);if(!str(r.title,250)||!str(r.kind,50)||!str(r.url,10000)||r.url&&!safeURL(r.url)||!str(r.notes))fail()}
  for(let i=0;i<7;i++){const a=e.availability[i];if(a.day!==i||typeof a.enabled!=='boolean'||!/^([01]\d|2[0-3]):[0-5]\d$/.test(a.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(a.end)||a.enabled&&timeMin(a.end)<=timeMin(a.start))fail()}
  const plans=new Set(e.plans.map(p=>p.id)),sessions=new Set(e.sessions.map(s=>s.id));for(const p of e.plans)if(p.sessionId&&!sessions.has(p.sessionId))fail();for(const s of e.sessions)if(s.planId&&!plans.has(s.planId))fail();
  if(e.mockExams!==undefined&&!list(e.mockExams))fail();for(const m of e.mockExams||[]){checkId(m.id);if(!str(m.name,200)||!validDate(m.date)||!num(m.timeLimit,1,1440)||!num(m.penalty,0,1)||!list(m.sessionIds,1000)||m.sessionIds.some(x=>!sessions.has(x)))fail()}
 }
 if(data.exams.length&&!data.exams.some(e=>e.id===data.activeExam)||!data.exams.length&&data.activeExam!==null)fail();
 if(data.timer){const t=data.timer,e=data.exams.find(e=>e.id===t.examId);if(!e||!e.subjects.some(s=>s.id===t.subjectId&&(!t.topicId||s.topics.some(x=>x.id===t.topicId)))||!num(t.duration,1,86400)||!num(t.elapsed,0,31536000)||!num(t.startedAt,0,Date.now()+86400000)||typeof t.running!=='boolean'||typeof t.notified!=='boolean'||!['countdown','free'].includes(t.mode)||!validDate(t.date))fail()}

}
function migrateLegacy(data){
 if(!Array.isArray(data.subjects)||!Array.isArray(data.sessions)||!Array.isArray(data.questions)||!data.goals)throw Error('Arquivo não reconhecido.');
 const e=newExam('Importado do painel anterior'),subjectMap=new Map(),topicMap=new Map();
 e.subjects=data.subjects.map(s=>{const sid=id();subjectMap.set(s.id,sid);const topics=(s.topics||[]).map(t=>{const tid=id();topicMap.set(t.id,tid);return {id:tid,name:String(t.name||'Assunto'),weight:num(t.weight,1,5)?+t.weight:3,stage:'new',notes:'',nextReview:null,reviewCount:0}});return {id:sid,name:String(s.name||'Matéria'),weight:num(s.weight,1,5)?+s.weight:3,archived:false,topics}});
 const mapRef=x=>({subjectId:subjectMap.get(x.subjectId),topicId:topicMap.get(x.topicId)||null});
 e.sessions=data.sessions.map(s=>({id:id(),created:new Date().toISOString(),date:s.date,...mapRef(s),minutes:+s.minutes,qty:0,correct:0,type:String(s.type||'Teoria'),notes:String(s.notes||''),board:'',planId:null,source:'legacy'}));
 e.sessions.push(...data.questions.map(q=>({id:id(),created:new Date().toISOString(),date:q.date,...mapRef(q),minutes:q.startTime&&q.endTime?(timeMin(q.endTime)-timeMin(q.startTime)+1440)%1440:0,qty:+q.qty,correct:+q.correct,type:'Questões',notes:'Importado do painel anterior',board:String(q.banca||''),planId:null,source:'legacy'})));
 e.plans=(data.schedule||[]).filter(p=>p.status!=='Concluída').map(p=>({id:id(),date:p.date,start:p.start,end:p.end,...mapRef(p),status:p.status==='Não realizada'?'skipped':'planned',sessionId:null,type:'Teoria',reason:String(p.reason||'Importado')}));
 e.dailyMinutes=num(+data.goals.dailyHours*60,5,1440)?Math.round(+data.goals.dailyHours*60):90;e.dailyQuestions=num(data.goals.dailyQuestions,1,5000)?+data.goals.dailyQuestions:20;e.weeklyMinutes=num(+data.goals.weeklyHours*60,5,10080)?Math.round(+data.goals.weeklyHours*60):600;
 const backup=defaults();backup.exams=[e];backup.activeExam=e.id;validateBackup(backup);return e;
}

 const upcoming=e.plans.filter(p=>p.status==='planned'&&p.date>=today()&&p.date<=addDays(today(),7)).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)).slice(0,12);
 const lines=['Preparação ativa: '+short(e.name),'Cargo: '+(short(e.position)||'Não informado'),'Banca: '+(short(e.board)||'Não informada'),'Data da prova: '+(e.date||'Não informada'),'Metas: '+e.dailyMinutes+' minutos e '+e.dailyQuestions+' questões por dia; '+e.weeklyMinutes+' minutos por semana; '+e.targetAccuracy+'% de acerto.','Últimos 7 dias: '+recent.m+' minutos estudados; '+recent.q+' questões; '+(recent.accuracy===null?'sem taxa de acerto registrada':recent.accuracy+'% de acerto')+'.','Matérias (até 15):'];

async function aiSubmit(form){

function aiValidResult(mode,data,questionCount=3){const text=x=>typeof x==='string'&&x.trim().length>0&&x.length<=12000;if(!data||typeof data!=='object')return false;if(mode==='explain')return text(data.explanation);if(mode==='cards')return Array.isArray(data.cards)&&data.cards.length===4&&data.cards.every(c=>c&&text(c.front)&&text(c.back));return Array.isArray(data.questions)&&data.questions.length===questionCount&&data.questions.every(q=>q&&text(q.prompt)&&text(q.explanation)&&Array.isArray(q.options)&&q.options.length===4&&q.options.every(text)&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4)}

 'ai-question-go':b=>{const index=+b.dataset.index;if(!aiResult?.questions||index<0||index>=aiResult.questions.length)return;aiQuizIndex=index;aiRefreshQuiz()},
 'ai-quiz-restart':()=>{if(!aiResult?.questions)return;aiResult.questions.forEach(q=>{delete q.choice;delete q.revealed});aiQuizIndex=0;aiRefreshQuiz();toast('Treino reiniciado. Nenhum novo pedido à IA foi feito.')},
 'ai-from-mistake':b=>{if(tour)return toast('A IA fica desativada durante a prática.');const m=exam()?.mistakes.find(x=>x.id===b.dataset.id);if(!m)return;aiMode='explain';aiResult=null;aiError='';aiContent=`Minha dificuldade: ${m.title}\nMinha explicação atual: ${m.explanation||''}`;go('ia')}
});
document.addEventListener('input',event=>{if(event.target.id==='ai-content'){aiContent=event.target.value;if($('#ai-length'))$('#ai-length').textContent=aiContent.length+'/8.000'}});
document.addEventListener('change',event=>{if(event.target.name==='consent'&&event.target.closest('#ai-form')){if(event.target.checked)aiVerify();else{aiCleanupWidget();if($('#ai-security-status'))$('#ai-security-status').textContent=''}}});
document.addEventListener('submit',event=>{
 if(event.target.id==='ai-form'){event.preventDefault();aiSubmit(event.target)}
 if(event.target.id==='ai-save-form'){
  event.preventDefault();if(tour)return toast('Saia do tutorial para salvar cartões.');const e=exam();if(!e||(aiExamId!==null&&aiExamId!==e.id))return toast('Volte à preparação em que os cartões foram gerados.');
  try{const d=new FormData(event.target),sid=d.get('subjectId');if(!e.subjects.some(s=>s.id===sid&&!s.archived))throw Error('Selecione uma matéria válida.');const selected=aiResult.cards.map((c,i)=>({c,i})).filter(({c,i})=>!c.saved&&d.has(`select-${i}`));if(!selected.length)throw Error('Selecione pelo menos um cartão.');const cards=selected.map(({c,i})=>{const front=String(d.get(`front-${i}`)||'').trim(),back=String(d.get(`back-${i}`)||'').trim();if(!front||!back||front.length>12000||back.length>12000)throw Error('Confira a pergunta e a resposta de cada cartão selecionado.');return {id:id(),subjectId:sid,topicId:null,front,back,due:today(),interval:0,reps:0,suspended:false}});snapshot();aiExamId=e.id;e.cards.push(...cards);selected.forEach(({c},i)=>{Object.assign(c,{front:cards[i].front,back:cards[i].back,saved:true,savedId:cards[i].id})});commit(`${cards.length} cartões adicionados à revisão.`,true)}catch(e){toast(e.message)}
 }
});
window.addEventListener('hashchange',()=>{if(route!=='ia')aiCleanupWidget()});

document.addEventListener('keydown',event=>{if(event.target.id==='ai-content'&&(event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();$('#ai-form')?.requestSubmit()}});

document.addEventListener('change',event=>{const input=event.target;if(input.type!=='radio'||!input.name.startsWith('ai-q-'))return;const index=Number(input.name.slice(5)),q=aiResult?.questions?.[index],choice=Number(input.value);if(!q||q.revealed||!Number.isInteger(choice)||choice<0||choice>3)return;q.choice=choice;const card=input.closest('.ai-question'),button=$('[data-action="ai-answer"]',card);if(button)button.disabled=false;const hint=$('#ai-choice-hint',card);if(hint)hint.textContent='Tudo pronto. Confira sua resposta.'});

document.addEventListener('change',event=>{if(event.target.name!=='studyContext')return;aiContent=$('#ai-content')?.value||aiContent;aiUseContext=event.target.checked;aiCleanupWidget();render();requestAnimationFrame(()=>$('[name="studyContext"]')?.focus({preventScroll:true}))});


document.addEventListener('change',event=>{if(!event.target.closest('#ai-form'))return;if(event.target.name==='questionCount'){const count=Number(event.target.value);if(Number.isInteger(count)&&count>=1&&count<=10)aiQuestionCount=count}if(event.target.name==='difficulty'&&['easy','medium','hard'].includes(event.target.value))aiDifficulty=event.target.value});

go(location.hash.slice(1)||'hoje');
</script>
</body>
</html>
