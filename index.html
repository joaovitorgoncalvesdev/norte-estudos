<script>'use strict';
const STORE='norte.study.v1';

const addDays=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const diffDays=(a,b)=>Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000);
const weekday=d=>new Date(d+'T12:00:00').getDay();
const dateLabel=(d,full=false)=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',full?{day:'2-digit',month:'short',year:'numeric'}:{day:'2-digit',month:'short'});
const minutesLabel=n=>{n=Math.round(n);return n>=60?`${Math.floor(n/60)}h${n%60?' '+n%60+'min':''}`:`${n}min`};
const hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const timeMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const clockLabel=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
const safeURL=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const num=(v,min,max)=>Number.isFinite(+v)&&+v>=min&&+v<=max;
const clone=v=>JSON.parse(JSON.stringify(v));
const defaults=()=>({version:1,name:'Estudante',theme:'light',activeExam:null,exams:[],timer:null});
let db=defaults(),storageProblem='',recoveryRaw=null,recoveryProtected=false;
let route='hoje',planDate=today(),analyticsDays=14,sessionFilter='',topicFilter='',topicStatus='all',mistakeFilter='open',historyFilter='all',reviewCardId=null,cardAnswer=false,cardMode='review',undoState=null,toastTimeout,previewPlan=[],searchText='';
const routes=[['hoje','Hoje'],['plano','Planejamento'],['edital','Meu edital'],['foco','Sessão de foco'],['questoes','Questões e erros'],['simulados','Simulados'],['revisoes','Revisões'],['cartoes','Cartões de memória'],['evolucao','Evolução'],['biblioteca','Biblioteca'],['historico','Histórico'],['ajustes','Ajustes'],['guia','Tutorial'],['ia','NORBIT AI'],['perfil','Meu perfil'],['prazos','Prazos']];
const stages=[['new','Não iniciado'],['learning','Em estudo'],['covered','Teoria concluída'],['mastered','Consolidado']];
// Live product tours use a temporary preparation. Study data never leaves localStorage.
const TOUR_STORE='norte.tour.v2';
let tour=null,tourLayer=null,tourTarget=null,tourFrame=0,tourObserved=null;
let tourProgress={area:'all',index:0,completed:[]};
try{const p=JSON.parse(localStorage.getItem(TOUR_STORE));if(p&&typeof p.area==='string'&&Number.isInteger(p.index)&&p.index>=0)tourProgress={area:p.area,index:p.index,completed:Array.isArray(p.completed)?p.completed.filter(x=>typeof x==='string'):[]}}catch{}
const tStep=(selector,title,body,options={})=>({selector,title,body,...options});
const tourAreas={
 hoje:{label:'Hoje',caption:'Escolha seu próximo estudo',steps:[
  tStep('.metrics .metric','Sua rotina começa aqui.','Estes números mostram o tempo, as questões e os acertos de hoje. Estamos usando dados de prática temporários.'),
  tStep('#content .hero','Uma sugestão com um motivo.','O próximo assunto considera seu edital, suas revisões e seus resultados. Leia o motivo antes de decidir.'),
  tStep('.toolbar [data-action="session"]','Experimente registrar um estudo.','Clique em + Registrar. Vou acompanhar você dentro do formulário.',{click:'open'}),
  tStep('#modal [name="minutes"]','Registre o tempo real.','Experimente mudar os minutos. O tempo planejado e o tempo estudado podem ser diferentes.',{prepare:()=>sessionForm(),modal:true}),
  tStep('#modal [name="qty"]','Questões e tempo no mesmo registro.','Informe quantas questões resolveu. O campo Acertos deve ser igual ou menor. Você não precisa registrar o mesmo estudo duas vezes.',{prepare:()=>sessionForm(),modal:true})]},
 edital:{label:'Meu edital',caption:'Organize matérias e assuntos',steps:[
  tStep('[data-action="subject-new"]','Cada matéria ganha seu espaço.','Clique em Adicionar matéria para conhecer o cadastro.',{click:'open'}),
  tStep('#modal [name="name"]','Dê um nome à matéria.','Digite, por exemplo, Direito Penal. Este cadastro é apenas uma prática e não vai para sua preparação real.',{prepare:()=>openSubject(),modal:true}),
  tStep('#modal [name="topics"]','Transforme o edital em tópicos.','Digite um assunto por linha. O Norte cria os tópicos separados para planejar e acompanhar cada um.',{prepare:()=>openSubject(),modal:true}),
  tStep('#modal [name="weight"]','Escolha o peso na prova.','Um peso de 1 a 5 indica a importância. Assuntos mais relevantes recebem mais atenção no planejamento.',{prepare:()=>openSubject(),modal:true}),
  tStep('#content [data-stage]','Acompanhe seu avanço.','Experimente mudar a etapa deste assunto. Teoria concluída e Consolidado representam momentos diferentes do aprendizado.')]},
 plano:{label:'Planejamento',caption:'Monte uma semana possível',steps:[
  tStep('.week-strip','Navegue pelos dias.','Clique em um dia para ver suas atividades. A seleção muda o dia exibido, sem registrar tempo de estudo.'),
  tStep('[data-action="plan-generate"]','Vamos criar uma sugestão.','Clique em Gerar plano adaptativo. Você sempre pode revisar antes de aplicar.',{click:'open'}),
  tStep('#modal [name="block"]','Ajuste o tamanho do bloco.','Escolha um intervalo que caiba na sua rotina. Os novos blocos têm uma pausa de 5 minutos entre eles.',{prepare:()=>openGenerator(),modal:true}),
  tStep('#modal .availability','Defina quando você pode estudar.','Experimente os horários e os dias disponíveis. Dias de descanso podem ficar desativados.',{prepare:()=>openGenerator(),modal:true}),
  tStep('#modal button[type="submit"]','Confira antes de aplicar.','Clique em Ver sugestão para visualizar as atividades geradas. Nenhum dado real será alterado.',{prepare:()=>openGenerator(),modal:true,click:'preview'}),
  tStep('#modal .preview-list','Seu plano está na tela.','Confira os dias, os horários e os motivos. Fora do tour, Aplicar planejamento adiciona estas atividades à sua preparação.',{prepare:()=>tourPreview(),modal:true})]},
 foco:{label:'Sessão de foco',caption:'Experimente o cronômetro',steps:[
  tStep('#focus-subject','Escolha uma matéria.','Use este seletor para escolher o conteúdo do bloco. O seletor seguinte escolhe o assunto.'),
  tStep('[data-action="timer-start"]','Comece um bloco de prática.','Clique em Começar a estudar. Este cronômetro é de demonstração.',{click:'timer'}),
  tStep('[data-action="timer-toggle"]','Você pode pausar.','Clique para pausar ou continuar. O tempo real só entra no histórico quando a sessão é registrada.',{prepare:()=>tourEnsureTimer()}),
  tStep('[data-action="timer-finish"]','Transforme o foco em um registro.','Clique em Concluir e registrar para conferir os minutos e os resultados.',{prepare:()=>tourEnsureTimer(),click:'open'}),
  tStep('#modal [name="notes"]','Anote o próximo reforço.','Escreva o que foi difícil e o que você quer retomar. Depois de conferir os campos, Salvar registro conclui a sessão.',{prepare:()=>{tourEnsureTimer();finishTimer()},modal:true})]},
 questoes:{label:'Questões e erros',caption:'Aprenda com as dificuldades',steps:[
  tStep('.metrics .metric','Observe a quantidade de questões.','Uma taxa de acerto com poucas questões ainda é uma referência fraca. Compare resultados junto com o tamanho da amostra.'),
  tStep('[data-action="mistake-new"]','O erro pode virar um próximo passo.','Clique em Anotar erro para experimentar o caderno de dificuldades.',{click:'open'}),
  tStep('#modal [name="title"]','Identifique a dificuldade.','Escreva o conceito ou a confusão que causou o erro. Uma descrição específica ajuda na revisão.',{prepare:()=>openMistake(),modal:true}),
  tStep('#modal [name="explanation"]','Explique a regra correta.','Escreva com suas próprias palavras como chegar à resposta. Você também pode escolher o tipo de erro.',{prepare:()=>openMistake(),modal:true}),
  tStep('[data-action="card-from-mistake"]','Transforme a dificuldade em prática.','Clique em Criar cartão. O Norte leva a dificuldade e a explicação para o formulário do cartão.',{click:'open'})]},
 simulados:{label:'Simulados',caption:'Registre uma prova de treino',steps:[
  tStep('[data-action="mock-new"]','Treine o dia da prova.','Clique em Registrar simulado para conhecer o formulário.',{click:'open'}),
  tStep('#modal [name="name"]','Identifique seu simulado.','Dê um nome e confira a data. Assim você consegue comparar os treinos depois.',{prepare:()=>openMock(),modal:true}),
  tStep('#modal [name="penalty"]','Confira a regra de pontuação.','Escolha se existe desconto por erro. Isso muda o cálculo da pontuação líquida.',{prepare:()=>openMock(),modal:true}),
  tStep('#modal tbody tr','Registre o resultado por matéria.','Experimente preencher questões, acertos e minutos. O simulado gera registros no histórico; não lance esses resultados de novo.',{prepare:()=>openMock(),modal:true})]},
 revisoes:{label:'Revisões',caption:'Retome o que está pendente',steps:[
  tStep('#content .panel .row','Encontre o assunto para retomar.','Aqui aparecem as revisões vencidas. A data é definida ao agendar ou registrar uma revisão do assunto.'),
  tStep('[data-action="review-topic"]','Pratique uma revisão.','Clique em Revisar. Tente recuperar o conteúdo antes de consultar seu material.',{click:'open'}),
  tStep('#modal [name="reviewRating"]','Avalie o que conseguiu lembrar.','Escolha sua lembrança. A avaliação ajusta quando o assunto voltará. Selecione uma opção para experimentar.',{prepare:()=>tourReviewForm(),modal:true}),
  tStep('#modal [name="notes"]','Registre o que ainda falta.','Anote uma dúvida concreta. Quando salvar uma revisão real, o tempo e os resultados entram no histórico.',{prepare:()=>tourReviewForm(),modal:true})]},
 cartoes:{label:'Cartões de memória',caption:'Teste a lembrança na prática',steps:[
  tStep('[data-action="card-flip"]','Responda antes de revelar.','Pense na resposta e clique no cartão para virar. Também é possível usar a tecla Espaço.',{click:'flip'}),
  tStep('.ratings','Como foi lembrar?','Clique em uma avaliação. Sua escolha ajusta a próxima data deste cartão.',{prepare:()=>{cardAnswer=true;render()},click:'rated'}),
  tStep('[data-action="card-new"]','Crie sua própria pergunta.','Clique em Novo cartão. Uma ideia por cartão costuma ser mais fácil de revisar.',{click:'open'}),
  tStep('#modal [name="front"]','Uma pergunta específica.','Digite uma pergunta curta na frente. Coloque a explicação no campo Resposta.',{prepare:()=>openCard(),modal:true})]},
 evolucao:{label:'Evolução',caption:'Leia seus resultados',steps:[
  tStep('#content .segmented','Escolha um período.','Clique em 7, 14, 30 ou 90 dias para comparar sua rotina. As medidas mudam com o período escolhido.'),
  tStep('.metrics .metric','Tempo é uma parte da história.','Os minutos mostram seu esforço. Compare também os acertos e a cobertura do edital.'),
  tStep('#content .chart','Veja o ritmo ao longo dos dias.','Cada coluna representa o tempo estudado. Um dia sem atividade não apaga o que você já aprendeu.'),
  tStep('#content table','Compare matérias com contexto.','Leia o acerto junto com o número de questões. Amostras pequenas precisam de mais prática antes de uma conclusão.')]},
 biblioteca:{label:'Biblioteca',caption:'Guarde materiais e notas',steps:[
  tStep('[data-action="resource-new"]','Guarde uma referência útil.','Clique em Adicionar material para conhecer o cadastro.',{click:'open'}),
  tStep('#modal [name="title"]','Dê contexto ao material.','Informe o título e escolha matéria e assunto. Isso ajuda a encontrar a referência depois.',{prepare:()=>openResource(),modal:true}),
  tStep('#modal [name="url"]','Um link é opcional.','Você pode guardar um endereço https:// ou apenas uma nota. O Norte não copia o conteúdo de um PDF ou vídeo.',{prepare:()=>openResource(),modal:true}),
  tStep('#modal [name="notes"]','Use suas próprias palavras.','Escreva um resumo, uma dúvida ou um roteiro de revisão. Uma nota também pode virar um cartão.',{prepare:()=>openResource(),modal:true})]},
 historico:{label:'Histórico',caption:'Confira e corrija registros',steps:[
  tStep('#history-search','Encontre um registro.','Digite um assunto ou trecho das suas notas para filtrar as sessões.'),
  tStep('[data-action="session-edit"]','Corrija o registro existente.','Clique em Editar. Você não precisa criar uma segunda sessão para corrigir minutos ou acertos.',{click:'open'}),
  tStep('#modal [name="minutes"]','Ajuste o que aconteceu.','Experimente alterar os minutos. Quando salvar uma sessão real, as estatísticas passam a usar os novos valores.',{prepare:()=>sessionForm({existing:exam().sessions[0]}),modal:true}),
  tStep('#modal [name="correct"]','Confira os acertos.','O número de acertos deve ser igual ou menor que a quantidade de questões. Tudo aqui continua sendo prática temporária.',{prepare:()=>sessionForm({existing:exam().sessions[0]}),modal:true})]},
 ajustes:{label:'Ajustes',caption:'Personalize e proteja seus dados',steps:[
  tStep('#profile-form [name="name"]','Seu espaço, seu nome.','Experimente o nome e a aparência. As mudanças deste tour não alteram seu perfil real.'),
  tStep('#exam-settings [name="dailyMinutes"]','Escolha uma meta possível.','Ajuste minutos e questões à sua disponibilidade. Uma rotina pequena e sustentável é um bom começo.'),
  tStep('#availability-form .availability','Defina dias e horários.','Ative os dias de estudo e deixe espaço para descanso. O planejador usa esta disponibilidade.'),
  tStep('[data-action="export"]','Guarde uma cópia da preparação.','Fora do tour, Exportar backup baixa o JSON completo. Faça isso antes de limpar o navegador ou trocar de aparelho.',{observeOnly:true}),
  tStep('[data-action="import"]','Leve os registros para outro lugar.','Importar backup mostra uma prévia antes de substituir os dados atuais. O Norte não sincroniza aparelhos automaticamente.',{observeOnly:true})]}

function tourFillFields(values){for(const [name,value] of Object.entries(values)){const field=$(`#modal [name="${name}"]`);if(field&&(!field.value.trim()||field.value==='0'))field.value=value}}
const tourSaveStep=(title,body,prepare,onEnter)=>tStep('#modal button[type="submit"]',title,body,{modal:true,click:'saved',prepare,onEnter});
tourAreas.hoje.steps.push(tourSaveStep('Salve seu primeiro registro de prática.','Preparamos um resultado de exemplo. Clique em Salvar registro e veja os números de Hoje serem atualizados.',()=>sessionForm(),()=>tourFillFields({qty:'15',correct:'11'})),tStep('.metrics .metric','Seu registro já aparece aqui.','Os números respondem ao que você registrou. Na sua preparação real, estes dados ficam salvos; os desta prática serão descartados ao sair.'));
tourAreas.edital.steps.splice(4,0,tourSaveStep('Veja a matéria entrar no edital.','Os campos vazios receberam um exemplo. Clique em Salvar matéria. Você verá o cadastro na tela real do edital.',()=>openSubject(),()=>tourFillFields({name:'Matéria de prática',topics:'Conceitos fundamentais\nAplicações em questões'})));
tourAreas.questoes.steps.splice(4,0,tourSaveStep('Guarde a explicação de prática.','Clique em Salvar dificuldade. A anotação aparecerá no caderno, pronta para virar uma revisão.',()=>openMistake(),()=>tourFillFields({title:'Dificuldade de prática',explanation:'Retomar o conceito e explicar a resposta com minhas palavras.'})));
tourAreas.simulados.steps.push(tourSaveStep('Confira como o simulado é registrado.','Preparamos números de exemplo na primeira matéria. Clique em Salvar simulado para ver o resultado na tela.',()=>openMock(),()=>{tourFillFields({name:'Simulado de prática'});const sid=exam().subjects[0].id;tourFillFields({['qty-'+sid]:'20',['correct-'+sid]:'14',['minutes-'+sid]:'30'})}),tStep('#content .inline-stats','O resultado está reunido aqui.','O simulado mostra questões, acertos e pontos. Seus registros por matéria entram no histórico sem duplicar o tempo.'));
tourAreas.revisoes.steps.push(tourSaveStep('Conclua a revisão de prática.','Clique em Salvar registro. O assunto sai das revisões vencidas e recebe uma próxima data conforme sua avaliação.',tourReviewForm,()=>{}));
tourAreas.cartoes.steps.push(tStep('#modal [name="back"]','Explique a resposta.','Escreva uma resposta que você consiga entender depois, sem depender de um texto longo.',{prepare:()=>openCard(),modal:true}),tourSaveStep('Crie o cartão de prática.','Os campos vazios receberam um exemplo. Clique em Salvar cartão para adicioná-lo à fila temporária.',()=>openCard(),()=>tourFillFields({front:'Qual conceito quero retomar?',back:'Uma explicação curta, com minhas próprias palavras.'})));
tourAreas.biblioteca.steps.push(tourSaveStep('Veja o material na Biblioteca.','Clique em Salvar material. O exemplo ficará organizado por matéria nesta preparação temporária.',()=>openResource(),()=>tourFillFields({title:'Nota de prática',notes:'Retomar este conceito na próxima revisão.'})));
tourAreas.historico.steps.push(tourSaveStep('Corrija sem duplicar.','Clique em Salvar registro. Você está editando a sessão existente, por isso o histórico não ganha uma segunda cópia.',()=>sessionForm({existing:exam().sessions[0]}),()=>{}));

function tourSave(){try{localStorage.setItem(TOUR_STORE,JSON.stringify(tourProgress))}catch{}}
function tourEnsureTimer(){if(!db.timer){const s=exam().subjects[0];startFocus(s.id,s.topics[0].id);db.timer.running=false;db.timer.elapsed=60;updateTimer()}}

function viewAnalytics(){const e=exam(),sessions=periodSessions(analyticsDays),st=stats(sessions),days=new Set(sessions.map(s=>s.date)).size,start=addDays(today(),1-analyticsDays),prev=stats(e.sessions.filter(s=>s.date>=addDays(start,-analyticsDays)&&s.date<start)),recs=recommendations(),buckets=Array.from({length:analyticsDays<=14?analyticsDays:10},(_,i)=>{const span=analyticsDays<=14?1:Math.ceil(analyticsDays/10),a=addDays(start,i*span),b=addDays(start,Math.min(analyticsDays-1,(i+1)*span-1));return {date:a,...stats(sessions.filter(s=>s.date>=a&&s.date<=b))}}).filter(x=>x.date<=today()),max=Math.max(30,...buckets.map(x=>x.m));return heading('Veja o que está mudando.','Compare esforço, cobertura e resultados sem confundir uma medida com a outra.',btn('Exportar registros','csv'))+`<div class="filters"><div class="segmented">${[7,14,30,90].map(n=>`<button class="${analyticsDays===n?'active':''}" data-action="analytics-range" data-days="${n}">${n} dias</button>`).join('')}</div><small>${dateLabel(start)} até ${dateLabel(today())}</small></div><div class="metrics">${metric('Tempo estudado',minutesLabel(st.m),`${st.m>=prev.m?'+':''}${minutesLabel(st.m-prev.m)} vs. período anterior`)}${metric('Questões resolvidas',st.q,`${st.q-prev.q>=0?'+':''}${st.q-prev.q} vs. período anterior`)}${metric('Acerto no período',st.accuracy===null?'Sem dados':st.accuracy+'%',prev.accuracy===null?'Sem referência anterior':`${st.accuracy===null?'Sem dados atuais':(st.accuracy-prev.accuracy>=0?'+':'')+(st.accuracy-prev.accuracy)+' pontos percentuais'}`)}${metric('Dias ativos',`${days} <span>/ ${analyticsDays}</span>`,`${Math.round(days/analyticsDays*100)}% dos dias com estudo`)}</div><div class="grid two"><section class="panel">${panelHead('Tempo de estudo','Minutos por dia ou grupo de dias')}<div class="chart" role="img" aria-label="Gráfico de minutos estudados no período">${buckets.map(x=>`<div class="chart-col" title="${dateLabel(x.date)}: ${minutesLabel(x.m)}"><span class="chart-value">${x. function viewMocks(){const e=exam(),mocks=e.mockExams||[];return heading('Treine o dia da prova.','Registre um simulado por matéria, confira o tempo e escolha seu próximo reforço.',btn('Registrar simulado','mock-new','','primary'))+`<div class="grid two"><section class="stack">${mocks.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>{const records=e.sessions.filter(s=>m.sessionIds.includes(s.id)),st=stats(records),score=st.c-(st.q-st.c)*m.penalty;return `<article class="panel">${panelHead(esc(m.name),`${dateLabel(m.date,true)} · ${minutesLabel(st.m)} usados${m.timeLimit?' de '+minutesLabel(m.timeLimit):''}`,btn('Excluir','mock-delete',`data-id="${m.id}"`,'quiet small'))}<div class="inline-stats"><strong>${st.q} questões</strong><strong>${st.accuracy===null?'Sem dados':st.accuracy+'% de acerto'}</strong><strong>${score.toLocaleString('pt-BR')} pontos líquidos</strong></div><div style="margin:20px 0">${progress(st.c,st.q)}</div>${records.map(s=>`<div class="row"><div class="row-main"><h3>${esc(subjectName(s.subjectId))}</h3><p>${s.correct}/${s.qty} acertos · ${minutesLabel(s.minutes)}${s.notes?' · '+esc(s.notes):''}</p></div>${btn('Corrigir','session-edit',`data-id="${s.id}"`,'quiet small')}</div>`).join('')}<p class="form-help">Pontuação: 1 por acerto${m.penalty?', menos '+m.penalty.toLocaleString('pt-BR')+' por erro':', sem desconto por erro'}. Questões em branco não entram neste cálculo.</p></article>`}).join('')||`<section class="panel">${empty('Pratique sob condições reais','Use um simulado de sua escolha e registre tempo e resultado por matéria.',btn('Registrar primeiro simulado','mock-new'))}</section>`}</section><aside class="stack"><section class="panel">${panelHead('Depois do simulado')}<div class="insight"><h3>Confira o tempo por matéria</h3><p>Uma matéria com bom acerto e muito tempo pode precisar de treino de ritmo.</p></div><div class="insight"><h3>Separe os tipos de erro</h3><p>Registre no caderno o que foi falta de conteúdo, interpretação ou atenção.</p></div><div class="insight"><h3>Replaneje o reforço</h3><p>Os resultados entram no desempenho recente e influenciam as sugestões de estudo.</p></div></section><div class="note">Cada matéria vira um registro no histórico. O simulado reúne esses registros e conta o tempo uma única vez.</div></aside></div>`}

function sessionForm({existing=null,sid=null,tid=null,pid=null,type='Teoria',minutes=null,timer=false,review=false}={}){
 const e=exam(),p=e.plans.find(p=>p.id===pid),s=existing;sid=s?.subjectId||sid||p?.subjectId||e.subjects.find(s=>!s.archived)?.id;tid=s?.topicId||tid||p?.topicId||'';

  if(!validDate(d.date)||d.date>today())throw Error('Use uma data válida, hoje ou anterior.');

function readAvailability(d){return Array.from({length:7},(_,day)=>{const enabled=d['enabled-'+day]==='on',start=d['start-'+day],end=d['end-'+day];if(!/^\d\d:\d\d$/.test(start)||!/^\d\d:\d\d$/.test(end)||enabled&&timeMin(end)<=timeMin(start))throw Error('Confira os horários: o fim deve ser depois do início nos dias ativos.');return {day,enabled,start,end}})}

  let cursor=timeMin(a.start),end=timeMin(a.end);const occupied=e.plans.filter(p=>p.date===date&&p.status!=='skipped'&&(!replace||p.status==='done')).map(p=>[timeMin(p.start),timeMin(p.end)]).sort((a,b)=>a[0]-b[0]);

   result.push({id:id(),date,start:hm(cursor),end:hm(cursor+duration),subjectId:choice.s.id,topicId:choice.t.id,status:'planned',sessionId:null,type:choice.t.nextReview&&choice.t.nextReview<=date?'Revisão':'Teoria',reason:reason(choice.s,choice.t),generated:true});used[choice.t.id]=(used[choice.t.id]||0)+duration/block;previousSid=choice.s.id;cursor+=duration+5;
  }

}

y)+'</p></div>':'')+'</div>':'<div class="ai-question-confirm"><p id="ai-choice-hint">'+(Number.isInteger(q.choice)?'Tudo pronto. Confira sua resposta.':'Selecione uma alternativa para responder.')+'</p><button type="button" class="primary" data-action="ai-answer" data-index="'+i+'" '+(Number.isInteger(q.choice)?'':'disabled')+'>Responder questão</button></div>')+'<div class="ai-question-navigation">'+btn('Anterior','ai-question-go','data-index="'+(i-1)+'" '+(i===0?'disabled':''),'quiet small')+'<span>'+(i+1)+' / '+total+'</span>'+btn('Próxima','ai-question-go','data-index="'+(i+1)+'" '+(i===total-1?'disabled':''),'secondary small')+'</div></fieldset>';

async function aiSubmit(form){

function aiValidResult(mode,data,questionCount=3){const text=x=>typeof x==='string'&&x.trim().length>0&&x.length<=12000;if(!data||typeof data!=='object')return false;if(mode==='explain')return text(data.explanation);if(mode==='cards')return Array.isArray(data.cards)&&data.cards.length===4&&data.cards.every(c=>c&&text(c.front)&&text(c.back));return Array.isArray(data.questions)&&data.questions.length===questionCount&&data.questions.every(q=>q&&text(q.prompt)&&text(q.explanation)&&Array.isArray(q.options)&&q.options.length===4&&q.options.every(text)&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4)}

function timerOptions(t){const alarm=t?.alarm||focusAlarmSettings;return `<div class="timer-options"><div class="timer-option-title"><h3>Um lembrete no momento certo.</h3><button type="button" class="quiet small" data-action="timer-sound-test">Testar som</button></div><label class="checkbox-label"><input id="timer-sound" type="checkbox" ${alarm.sound?'checked':''}>Som ao concluir e no lembrete</label><label>Lembrete após quantos minutos de estudo?<input id="timer-reminder" type="number" min="0" max="1440" step="1" value="${t?Math.round((alarm.atSeconds||0)/60):alarm.atMinutes||0}" inputmode="numeric"></label><p class="form-help">Use 0 para desativar. No bloco de foco, escolha um tempo menor que a duração total.</p><div class="timer-floating-actions">${t?btn('Abrir minipainel','timer-dock-open','','secondary small')+btn('Flutuar sobre outras janelas','timer-pip','','secondary small'):''}</div><p class="form-help">A janela sobre outros sites depende do suporte do navegador. Mantenha o Norte aberto. Aparelhos em suspensão podem atrasar os avisos.</p><p id="timer-audio-status" class="form-help" role="status"></p></div>`}
function timerUnlockAudio(){try{if(!timerAudio){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return Promise.resolve(false);timerAudio=new Audio()}return timerAudio.resume().then(()=>timerAudio.state==='running').catch(()=>false)}catch{return Promise.resolve(false)}}
function timerPlaySound(finish=false){if(tour||!timerAudio||timerAudio.state!=='running')return false;try{const now=timerAudio.currentTime;[finish?523:659,finish?659:784,finish?784:659].forEach((hz,i)=>{const oscillator=timerAudio.createOscillator(),gain=timerAudio.createGain(),start=now+i*.22;oscillator.type='sine';oscillator.frequency.value=hz;gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.14,start+.025);gain.gain.exponentialRampToValueAtTime(.001,start+.18);oscillator.connect(gain);gain.connect(timerAudio.destination);oscillator.start(start);oscillator.stop(start+.2)});return true}catch{return false}}
function timerFireAlert(message,finish=false){if(tour)return;timerAlert=message;const sounded=db.timer?.alarm?.sound&&timerPlaySound(finish);toast(message+(db.timer?.alarm?.sound&&!sounded?' Ative o som com “Testar som”.':''));if($('#timer-audio-status'))$('#timer-audio-status').textContent=sounded?'Alarme reproduzido.':message;}
function startFocus(sid,tid,pid){if(db.timer){go('foco');toast('Você já tem uma sessão aberta.');return}const s=subject(sid);if(!s){go('foco');return}const p=exam().plans.find(p=>p.id===pid),duration=(p?timeMin(p.end)-timeMin(p.start):exam().blockMinutes)*60;timerAlert='';db.timer={examId:exam().id,subjectId:sid,topicId:tid||null,planId:pid||null,date:today(),mode:focusMode,duration,elapsed:0,startedAt:Date.now(),running:true,notified:false,alarm:{sound:focusAlarmSettings.sound,atSeconds:focusMode==='countdown'&&focusAlarmSettings.atMinutes*60>=duration?0:focusAlarmSettings.atMinutes*60,fired:false},dockVisible:true,dockOnFocus:false};timerUnlockAudio();persist();go('foco')}
function timerSurface(t,pip=false){const e=db.exams.find(e=>e.id===t.examId),s=e?.subjects.find(s=>s.id===t.subjectId),topic=s?.topics.find(x=>x.id===t.topicId),finished=t.mode==='countdown'&&t.notified;return `<section class="focus-mini ${finished?'is-finished':''}" aria-label="Cronômetro flutuante"><header class="focus-mini-header">${norbitMascot(finished?'success':t.running?'focus':'pause','tiny')}<span ${pip?'':'data-timer-drag'} class="focus-mini-grip">NORTE · FOCO</span><button class="quiet small" data-action="${pip?'timer-pip-close':'timer-dock-close'}" aria-label="Fechar ${pip?'janela':'minipainel'}">×</button></header><h2>${esc(topic?.name||s?.name||'Sessão de estudo')}</h2><p>${esc(s?.name||'Seu tempo de foco')}</p><strong class="focus-mini-count" data-timer-count>00:00</strong><span class="focus-mini-status" data-timer-status></span><div class="focus-mini-track"><span data-timer-progress></span></div>${timerAlert?`<div class="focus-mini-alert" role="status">${esc(timerAlert)}${btn('Entendi','timer-alert-dismiss','','quiet small')}</div>`:''}<div class="focus-mini-controls">${btn(finished?'Concluído':t.running?'Pausar':'Continuar','timer-toggle',finished?'disabled':'','primary small')}${btn('Registrar','timer-finish','','secondary small')}</div><div class="focus-mini-footer">${pip?'':btn('Voltar ao foco','navigate','data-route="foco"','quiet small')+btn('Janela flutuante','timer-pip','','quiet small')}</div></section>`}
function updateTimer(){const t=db.timer,dock=$('#timer-dock');if(!dock)return;if(!t){dock.hidden=true;timerDockKey='';timerAlert='';if(timerPip&&!timerPip.closed)timerPip.close();timerPip=null;return}let elapsed=timerElapsed(t);const alarm=t.alarm;
 if(t.mode==='countdown'&&elapsed>=t.duration&&t.running){t.elapsed=t.duration;t.running=false;elapsed=t.duration;const first=!t.notified;t.notified=true;if(alarm&&alarm.atSeconds>0&&elapsed>=alarm.atSeconds)alarm.fired=true;persist();if(first)timerFireAlert('Bloco concluído. Hora de uma pausa.',true);if(route==='foco'){const button=$('[data-action="timer-toggle"]');if(button){button.textContent='Concluído';button.disabled=true}}}
 else if(t.running&&alarm&&alarm.atSeconds>0&&!alarm.fired&&elapsed>=alarm.atSeconds){alarm.fired=true;persist();timerFireAlert('Lembrete: '+Math.round(alarm.atSeconds/60)+' minutos de estudo concluídos.')}
 const seconds=t.mode==='free'?elapsed:Math.max(0,t.duration-elapsed),status=t.running?'Sessão em andamento':t.notified?'Bloco concluído. Hora de uma pausa.':'Sessão pausada';if($('#timer-count'))$('#timer-count').textContent=clockLabel(seconds);if($('#timer-status'))$('#timer-status').textContent=status;if(route==='foco'&&t.notified&&t.mode==='countdown'){const b=$('[data-action="timer-toggle"]');if(b){b.textContent='Concluído';b.disabled=true}}
 if(timerPip?.closed)timerPip=null;dock.hidden=t.dockVisible===false||(route==='foco'&&!t.dockOnFocus)||!!timerPip;const key=[t.examId,t.startedAt,t.running,t.notified,t.mode,db.theme,timerAlert].join('|');
 if(dock.hidden){dock.innerHTML='';timerDockKey=''}
 if(!dock.hidden&&key!==timerDockKey){dock.innerHTML=timerSurface(t);timerDockKey=key}
 if(timerPip&&key!==timerPipKey){timerPip.document.documentElement.dataset.theme=db.theme;timerPip.document.body.innerHTML=timerSurface(t,true);timerPipKey=key}
 for(const doc of [document,...(timerPip?[timerPip.document]:[])]){doc.querySelectorAll('[data-timer-count]').forEach(el=>el.textContent=clockLabel(seconds));doc.querySelectorAll('[data-timer-status]').forEach(el=>el.textContent=status);doc.querySelectorAll('[data-timer-progress]').forEach(el=>el.style.width=(t.mode==='free'?0:Math.min(100,elapsed/t.duration*100))+'%')}
}
async function openTimerPip(){if(tour)return toast('A janela externa fica desativada durante o tutorial.');if(!db.timer)return toast('Comece uma sessão primeiro.');timerUnlockAudio();if(timerPip&&!timerPip.closed){timerPip.focus();return}if(!window.documentPictureInPicture?.requestWindow){db.timer.dockVisible=true;db.timer.dockOnFocus=true;commit();return toast('Este navegador não oferece uma janela sempre visível. Use o minipainel no Norte.')}
 try{const popup=await window.documentPictureInPicture.requestWindow({width:360,height:390});if(!db.timer){popup.close();return}timerPip=popup;timerPipKey='';popup.document.title='Norte · Cronômetro';const style=popup.document.createElement('style');style.textContent=$('style').textContent+'\nbody{margin:0;padding:16px;background:var(--bg)}.focus-mini{width:100%;box-shadow:none}.focus-mini-header .focus-mini-grip{cursor:default}';popup.document.head.append(style);popup.document.body.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;event.preventDefault();if(b.dataset.action==='timer-finish'){popup.close();go('foco');window.focus()}actions[b.dataset.action]?.(b);updateTimer()});popup.addEventListener('pagehide',()=>{if(timerPip===popup){timerPip=null;timerPipKey='';timerDockKey='';updateTimer()}});updateTimer()}catch{toast('A janela não foi aberta. Tente pelo botão novamente ou use o minipainel.')}}
Object.assign(actions,{
 'timer-start':()=>{const sid=$('#focus-subject')?.value,tid=$('#focus-topic')?.value,duration=Number($('#focus-duration')?.value||30)*60;if(!sid)return toast('Adicione uma matéria primeiro.');if(focusMode==='countdown'&&focusAlarmSettings.atMinutes*60>=duration)return toast('Escolha um lembrete menor que a duração do bloco, ou use 0.');startFocus(sid,tid);db.timer.duration=duration;db.timer.alarm.atSeconds=focusAlarmSettings.atMinutes*60;persist();updateTimer()},

document.addEventListener('pointerdown',event=>{const handle=event.target.closest('[data-timer-drag]');if(!handle||event.button!==0)return;const dock=$('#timer-dock'),rect=dock.getBoundingClientRect();cancelAnimationFrame(timerDragFrame);handle.setPointerCapture(event.pointerId);event.preventDefault();let x=rect.left,y=rect.top,vx=0,vy=0,last=performance.now(),px=event.clientX,py=event.clientY;Object.assign(dock.style,{left:x+'px',top:y+'px',right:'auto',bottom:'auto'});const move=e=>{const now=performance.now(),dt=Math.max(1,now-last);vx=(e.clientX-px)/dt*1000;vy=(e.clientY-py)/dt*1000;x+=e.clientX-px;y+=e.clientY-py;px=e.clientX;py=e.clientY;last=now;dock.style.left=x+'px';dock.style.top=y+'px'};const release=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',release);handle.removeEventListener('pointercancel',release);const tx=Math.max(8,Math.min(innerWidth-dock.offsetWidth-8,x+vx*.12)),ty=Math.max(8,Math.min(innerHeight-dock.offsetHeight-8,y+vy*.12));if(matchMedia('(prefers-reduced-motion: reduce)').matches){dock.style.left=tx+'px';dock.style.top=ty+'px';return}let time=performance.now();const step=now=>{const dt=Math.min(.032,(now-time)/1000);time=now;vx+=(260*(tx-x)-32*vx)*dt;vy+=(260*(ty-y)-32*vy)*dt;x+=vx*dt;y+=vy*dt;dock.style.left=x+'px';dock.style.top=y+'px';if(Math.abs(tx-x)+Math.abs(ty-y)+Math.abs(vx)+Math.abs(vy)>.5)timerDragFrame=requestAnimationFrame(step);else{dock.style.left=tx+'px';dock.style.top=ty+'px'}};timerDragFrame=requestAnimationFrame(step)};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',release);handle.addEventListener('pointercancel',release)});
window.addEventListener('resize',()=>{const dock=$('#timer-dock');if(!dock||dock.hidden||!dock.style.left)return;cancelAnimationFrame(timerDragFrame);const rect=dock.getBoundingClientRect();dock.style.left=Math.max(8,Math.min(innerWidth-dock.offsetWidth-8,rect.left))+'px';dock.style.top=Math.max(8,Math.min(innerHeight-dock.offsetHeight-8,rect.top))+'px'});

function profileRead(form){const values=new FormData(form),d=profileDraft;for(const key of ['name','role','goal','course','term','date','position','board','subjects','level','challenge','method','start'])if(values.has(key))d[key]=String(values.get(key)).trim();for(const key of ['minutes','questions','block'])if(values.has(key))d[key]=Number(values.get(key));if(profileStep===3){d.days=values.getAll('day').map(Number);d.applyRoutine=profileEditingId?values.get('applyRoutine')==='on':true}if(profileStep===4&&!profileEditingId)d.createPlan=values.get('createPlan')==='on'}
function profileValidateStep(){const d=profileDraft;if(profileStep===1){if(!studyRoles[d.role])throw Error('Escolha o seu momento.');if(!d.goal||d.goal.length>120)throw Error('Informe um objetivo de até 120 caracteres.');if(d.kind==='faculdade'&&!d.course)throw Error('Conte qual curso você faz.');if(d.date&&!validDate(d.date))throw Error('Confira a data informada.')}if(profileStep===2){const names=d.subjects.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(names.length>30||names.some(s=>s.length>180))throw Error('Use até 30 disciplinas ou temas, com até 180 caracteres cada.')}if(profileStep===3&&d.applyRoutine){if(!d.days.length)throw Error('Escolha ao menos um dia de estudo.');if(!Number.isInteger(d.questions)||!num(d.questions,1,5000))throw Error('Escolha uma meta de questões entre 1 e 5000.');if(!num(d.minutes,30,180)||!num(d.block,25,50)||d.block>d.minutes)throw Error('O bloco precisa caber no tempo disponível.');if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(d.start)||timeMin(d.start)+d.minutes>1439)throw Error('Escolha um horário que termine antes da meia-noite.')}}
function profileFinish(){const d=profileDraft;const current=db.exams.find(e=>e.id===profileEditingId);if(profileEditingId&&!current)throw Error('Este espaço foi removido. Cancele e comece novamente.');const next=clone(db),e=current?next.exams.find(e=>e.id===current.id):newExam(d.goal);Object.assign(e,{name:d.goal,date:d.date,position:d.kind==='concurso'?d.position:'',board:d.kind==='concurso'?d.board:'',learningProfile:{kind:d.kind,role:d.role,course:d.course,term:d.term,level:d.level,challenge:d.challenge,method:d.method}});if(!current||d.applyRoutine){e.dailyMinutes=+d.minutes;e.dailyQuestions=+d.questions;e.weeklyMinutes=d.minutes*d.days.length;e.blockMinutes=+d.block;e.availability=Array.from({length:7},(_,day)=>({day,enabled:d.days.includes(day),start:d.start,end:hm(timeMin(d.start)+d.minutes)}))}const existing=new Set(e.subjects.map(s=>s.name.toLocaleLowerCase('pt-BR')));for(const name of d.subjects.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)){const key=name.toLocaleLowerCase('pt-BR');if(existing.has(key))continue;e.subjects.push({id:id(),name,weight:3,archived:false,topics:makeTopics('Fundamentos e prática')});existing.add(key)}if(!current)next.exams.push(e);next.activeExam=e.id;if(d.name)next.name=d.name;validateBackup(next);snapshot();const previous=db;db=next;try{if(!current&&d.createPlan&&e.subjects.length)e.plans=generatePlan(e,today(),7,e.blockMinutes,e.availability,false);validateBackup(db)}catch(error){db=previous;throw error}if(!aiResult&&!aiBusy)aiMode=({explicacao:'explain',cartoes:'cards',questoes:'quiz'})[d.method];profileDraft=null;profileEditingId=null;profileStep=0;persist();go('hoje');toast(current?'Seu espaço foi adaptado. Os registros foram preservados.':'Seu espaço está pronto. Confira sua primeira semana.',true)}
function profileSummary(){const p=exam()?.learningProfile;if(tour)return '';if(!p)return `<section class="profile-banner"><div>${norbitMascot('welcome','small')}</div><div><h2>Qual é o seu próximo objetivo?</h2><p>A NORBIT pode adaptar este espaço à faculdade, a um concurso ou a uma nova habilidade.</p></div>${btn('Adaptar meu espaço','profile-edit','','secondary small')}</section>`;return `<section class="profile-banner"><div>${norbitMascot('welcome','small')}</div><div><span class="profile-kicker">${esc(studyKinds[p.kind].label)}</span><h2>${esc(p.course||exam().name)}${p.term?` · ${esc(p.term)}`:''}</h2><p>${esc(studyAdvice(p))}</p></div>${btn('Ajustar meu perfil','profile-edit','','quiet small')}</section>`}
function studyTasks(e=exam()){return (e?.studyTasks||[]).filter(t=>t.status==='open').sort((a,b)=>a.date.localeCompare(b.date))}
function deadlinePanel(){if(!exam())return '';const pending=studyTasks(),completed=(exam().studyTasks||[]).filter(t=>t.status==='done').slice(-5).reverse();return `<section class="panel study-deadlines">${panelHead(studyKind()==='faculdade'?'Provas e entregas':'Seus próximos prazos','Prazos ajudam a orientar as prioridades de estudo.',btn('Adicionar prazo','deadline-new','','secondary small'))}${pending.slice(0,8).map(t=>`<div class="row"><div class="row-time">${dateLabel(t.date)}<small>${diffDays(today(),t.date)<0?'Atrasado':diffDays(today(),t.date)===0?'Hoje':diffDays(today(),t.date)+' dias'}</small></div><div class="row-main"><h3>${esc(t.title)}</h3><p>${esc(t.kind)}${t.subjectId?' · '+esc(subjectName(t.subjectId)):''}</p></div><div class="actions">${btn('Concluir','deadline-done',`data-id="${esc(t.id)}"`,'quiet small')}${btn('Editar','deadline-edit',`data-id="${esc(t.id)}"`,'quiet small')}</div></div>`).join('')||empty('Dê lugar aos seus prazos','Cadastre provas, trabalhos ou projetos. Concluir um prazo não registra tempo de estudo.')}${pending.length>8?`<details><summary>Mais ${pending.length-8} prazos</summary>${pending.slice(8).map(t=>`<div class="row"><div class="row-main"><h3>${esc(t.title)}</h3><p>${dateLabel(t.date)} · ${esc(t.kind)}</p></div>${btn('Editar','deadline-edit',`data-id="${esc(t.id)}"`,'quiet small')}</div>`).join('')}</details>`:''}${completed.length?`<details><summary>Concluídos recentemente</summary>${completed.map(t=>`<div class="row"><div class="row-main"><h3>${esc(t.title)}</h3><p>${dateLabel(t.date)}</p></div>${btn('Reabrir','deadline-reopen',`data-id="${esc(t.id)}"`,'quiet small')}</div>`).join('')}</details>`:''}</section>`}
function openDeadline(taskId){const e=exam();if(!e)return;const task=e.studyTasks?.find(t=>t.id===taskId);modal(task?'Editar prazo':'Um próximo passo com data','Associe uma matéria para ela receber atenção perto do prazo.',`<div class="form-grid"><label class="full">Título<input name="title" required maxlength="200" value="${esc(task?.title||'')}" placeholder="Ex.: Prova de Cálculo I"></label><label>Tipo<select name="kind">${['Prova','Trabalho','Projeto','Revisão','Outro'].map(k=>`<option ${task?.kind===k?'selected':''}>${k}</option>`).join('')}</select></label><label>Data<input type="date" name="date" required value="${task?.date||today()}"></label><label class="full">Matéria ou disciplina<select name="subjectId"><option value="">Sem matéria associada</option>${subjectOptions(task?.subjectId)}</select></label><p class="form-help full">O prazo não cria uma sessão nem muda seus horários sozinho. Gere o plano para obter uma nova sugestão e confira antes de aplicar.</p></div>`,'Salvar prazo',d=>{if(!d.title.trim()||!validDate(d.date))throw Error('Confira o título e a data.');if(d.subjectId&&!subject(d.subjectId))throw Error('Escolha uma matéria disponível.');if((e.studyTasks?.length||0)>=2000&&!task)throw Error('Você já tem 2.000 prazos neste espaço.');snapshot();e.studyTasks??=[];const values={title:d.title.trim(),kind:d.kind,date:d.date,subjectId:d.subjectId||null};if(task)Object.assign(task,values);else e.studyTasks.push({id:id(),status:'open',...values});closeModal();commit('Prazo salvo. Revise seu planejamento.',true)})}
function profileAIContext(e){const p=e.learningProfile,lines=[];if(p)lines.push('Objetivo: '+studyKinds[p.kind].label,'Momento: '+studyRoles[p.role],'Curso/área: '+(p.course||'Não informado'),'Etapa: '+(p.term||'Não informada'),'Base declarada: '+studyLevels[p.level],'Ajuda desejada: '+studyChallenges[p.challenge],'Preferência de prática: '+studyMethods[p.method],'Orientação: '+studyAdvice(p));if(studyTasks(e).length)lines.push('Prazos em aberto (até 8):',...studyTasks(e).slice(0,8).map(t=>'- '+t.date+' | '+t.kind+' | '+t.title+' | '+(e.subjects.find(s=>s.id===t.subjectId)?.name||'Sem disciplina associada')));return lines.join('\n')}
Object.assign(actions,{'exam-new':()=>profileBegin(false),'profile-new':()=>profileBegin(false),'profile-edit':()=>profileBegin(true),'profile-cancel':()=>{profileDraft=null;profileEditingId=null;profileStep=0;go('hoje')},'profile-kind':b=>{profileDraft.kind=b.dataset.profileKind;profileStep=1;render();$('#profile-heading')?.focus({preventScroll:true})},'profile-back':()=>{if($('#profile-wizard'))profileRead($('#profile-wizard'));profileStep=Math.max(0,profileStep-1);render();$('#profile-heading')?.focus({preventScroll:true})},'profile-tour':()=>startTour('perfil'),'deadline-new':()=>openDeadline(),'deadline-edit':b=>openDeadline(b.dataset.id),'deadline-done':b=>{const t=exam()?.studyTasks?.find(t=>t.id===b.dataset.id);if(t){snapshot();t.status='done';commit('Prazo concluído. O histórico de estudos permanece separado.',true)}},'deadline-reopen':b=>{const t=exam()?.studyTasks?.find(t=>t.id===b.dataset.id);if(t){snapshot();t.status='open';commit('Prazo reaberto.',true)}}});
document.addEventListener('submit',event=>{if(event.target.id!=='profile-wizard')return;event.preventDefault();try{profileRead(event.target);profileValidateStep();if(profileStep===4)profileFinish();else{profileStep++;render();$('#profile-heading')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}catch(error){$('#profile-error').textContent=error.message}});
function viewDeadlines(){return heading('Cada prazo, um próximo passo.','Organize provas, trabalhos e projetos. Associe disciplinas para orientar suas prioridades.')+deadlinePanel()}
function viewPersonalToday(){return viewToday()+deadlinePanel()}
function viewPersonalPlan(){return viewPlan()+deadlinePanel()}
function studyDeadlinePriority(subjectId){const pending=studyTasks().filter(t=>t.subjectId===subjectId);if(!pending.length)return 0;return Math.max(...pending.map(t=>Math.max(0,14-Math.max(0,diffDays(today(),t.date)))*.75))}
function studyTourCapture(){return {draft:profileDraft?clone(profileDraft):null,step:profileStep,editingId:profileEditingId,alarm:clone(focusAlarmSettings),alert:timerAlert,ai:{aiMode,aiContent,aiSubmittedContent,aiResult:aiResult?clone(aiResult):null,aiError,aiExamId,aiQuizIndex,aiUseContext,aiQuestionCount,aiDifficulty,aiGeneratedDifficulty}}}
function studyTourSetup(){if(timerPip&&!timerPip.closed)timerPip.close();aiCleanupWidget();profileDraft=null;profileEditingId=null;profileStep=0;aiMode='explain';aiContent='Na revisão ativa, tento lembrar antes de consultar o material. Depois confiro, explico com minhas palavras e retomo o assunto em outro dia.';aiSubmittedContent='';aiResult=null;aiError='';aiUseContext=false;aiQuestionCount=3;aiDifficulty='medium';timerAlert='';focusAlarmSettings={sound:false,atMinutes:0};exam().studyTasks=[{id:id(),title:'Prova de prática',date:addDays(today(),3),kind:'Prova',subjectId:exam().subjects[0].id,status:'open'}]}
function studyTourRestore(state){if(!state)return;profileDraft=state.draft;profileStep=state.step;profileEditingId=state.editingId;focusAlarmSettings=state.alarm;timerAlert=state.alert;aiCleanupWidget();({aiMode,aiContent,aiSubmittedContent,aiResult,aiError,aiExamId,aiQuizIndex,aiUseContext,aiQuestionCount,aiDifficulty,aiGeneratedDifficulty}=state.ai);timerDockKey='';timerPipKey=''}
function profileTourStep(n){profileBegin(true,false);Object.assign(profileDraft,{kind:'faculdade',role:'estudante',course:'Administração',goal:'Meu semestre de prática',term:'2º semestre',applyRoutine:false});profileStep=n;render()}
function studyAIPractice(mode='quiz',revealed=false){if(!tour)return;aiMode=mode;aiCleanupWidget();aiSubmittedContent=aiContent;aiQuizIndex=0;aiExamId=exam().id;aiGeneratedDifficulty=aiDifficulty;aiError='';aiResult=mode==='explain'?{explanation:'DEMONSTRAÇÃO DO TUTORIAL. Recuperação ativa significa tentar lembrar antes de consultar. Por exemplo, feche o material e explique o conceito em voz alta. Depois confira o que faltou. Distribuir essas revisões ao longo dos dias ajuda a retomar o conteúdo.'}:mode==='cards'?{cards:Array.from({length:4},(_,i)=>({front:['O que é recuperação ativa?','Quando conferir o material?','Como distribuir revisões?','O que fazer ao esquecer?'][i],back:['Tentar lembrar antes de consultar.','Depois de tentar responder com suas palavras.','Retomar o assunto em dias diferentes.','Conferir o raciocínio, identificar o que faltou e praticar novamente.'][i]}))}:{questions:Array.from({length:aiQuestionCount},(_,i)=>({prompt:'Prática '+(i+1)+': Qual estratégia aplica a recuperação ativa?',options:['Reler o texto continuamente sem tentar lembrar.','Tentar explicar sem consultar e depois conferir o material.','Copiar todas as páginas antes de começar.','Evitar conferir as dúvidas para manter o ritmo.'],answer:1,explanation:'Tentar lembrar antes de consultar exige recuperar o conteúdo. Conferir depois ajuda a encontrar lacunas e corrigir o raciocínio. A alternativa B combina essas duas etapas. Este exemplo é uma demonstração local do tutorial.',optionExplanations:['Reler não garante que você consiga recuperar o conteúdo.','Combina recuperação e conferência do raciocínio.','Copiar sozinho não exige recuperar a ideia.','Conferir dúvidas é parte da correção.'],takeaway:'Primeiro tente lembrar. Depois confira e explique o que faltou.',...(revealed&&i===0?{choice:1,revealed:true}:{})}))};render()}
