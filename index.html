}

function startTour(area='all',resume=false){if(tour)return;if(aiBusy)return toast('Cancele o pedido de IA antes de iniciar o tutorial.');const original={studyState:studyTourCapture(),db:clone(db),undo:undoState,route,focusMode,planDate,sessionFilter,cardMode,reviewCardId,cardAnswer};const keys=area==='all'?Object.keys(tourAreas):[area];if(keys.some(k=>!tourAreas[k]))return;const steps=keys.flatMap(key=>tourAreas[key].steps.map(s=>({...s,area:key,route:s.route||key})));const index=resume&&tourProgress.area===area?Math.min(tourProgress.index,steps.length-1):0;tour={active:true,original,steps,index,area};tourPractice();studyTourSetup();closeModal();tourShowStep();}

let tourGeometry=null,tourVelocity=[0,0,0,0],tourGoal=null,tourLast=0;
function tourPosition(){if(!tour||!tourTarget||!tourLayer)return;const rect=tourTarget.getBoundingClientRect(),w=innerWidth,h=innerHeight,p=6;const x=Math.max(8,Math.min(w-16,rect.left-p)),y=Math.max(8,Math.min(h-16,rect.top-p)),right=Math.max(x+1,Math.min(w-8,rect.right+p)),bottom=Math.max(y+1,Math.min(h-8,rect.bottom+p));tourGoal=[x,y,right-x,bottom-y];if(!tourGeometry||matchMedia('(prefers-reduced-motion: reduce)').matches){tourGeometry=[...tourGoal];tourVelocity=[0,0,0,0]}const shades=$$('.tour-shade',tourLayer);const boxes=[[0,0,w,y],[0,y,x,bottom-y],[right,y,w-right,bottom-y],[0,bottom,w,h-bottom]];boxes.forEach(([left,top,width,height],i)=>Object.assign(shades[i].style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'}));const bubble=$('.tour-bubble',tourLayer),bw=Math.min(360,w-24);bubble.style.width=bw+'px';const bh=bubble.offsetHeight;let bx=Math.max(12,Math.min(w-bw-12,right+16)),by=Math.max(12,Math.min(h-bh-12,y));if(w<700){bx=12;by=h-bh-12; if(bottom>by-12&&y<by+bh){const scroller=tourTarget.closest('dialog')||window;scroller.scrollBy({top:rect.top-85,behavior:'instant'});const r=tourTarget.getBoundingClientRect();if(Math.abs(r.top-rect.top)>1){tourSchedule();return}}}else if(right+bw+28>w){bx=Math.max(12,Math.min(w-bw-12,x));by=bottom+16;if(by+bh>h-12)by=Math.max(12,y-bh-16)}Object.assign(bubble.style,{left:bx+'px',top:by+'px'});if(!tourFrame){tourLast=performance.now();tourFrame=requestAnimationFrame(tourSpring)};}
function tourSpring(now){tourFrame=0;if(!tourLayer||!tourGoal)return;const dt=Math.min(.032,(now-tourLast)/1000);tourLast=now;let moving=false;for(let i=0;i<4;i++){const d=tourGoal[i]-tourGeometry[i];tourVelocity[i]+=(d*340-tourVelocity[i]*37)*dt;tourGeometry[i]+=tourVelocity[i]*dt;if(Math.abs(d)>.4||Math.abs(tourVelocity[i])>.4)moving=true}const [x,y,w,h]=tourGeometry;Object.assign($('.tour-ring',tourLayer).style,{transform:`translate3d(${x}px,${y}px,0)`,width:w+'px',height:h+'px'});if(moving)tourFrame=requestAnimationFrame(tourSpring)}

function viewHistory(){const e=exam(),list=e.sessions.filter(s=>(historyFilter==='all'||(historyFilter==='questions'?s.qty>0:s.type===historyFilter))&&(!sessionFilter||`${subjectName(s.subjectId)} ${topicName(s.subjectId,s.topicId)} ${s.notes}`.toLowerCase().includes(sessionFilter.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));return heading('Cada sessão faz parte do caminho.','Edite seus registros, corrija resultados e acompanhe o que foi realizado.',btn('Exportar CSV','csv')+btn('Registrar estudo','session','','primary'))+`<div class="filters"><input id="history-search" value="${esc(sessionFilter)}" placeholder="Buscar matéria, assunto ou anotação" aria-label="Buscar registros"><select id="history-type" aria-label="Tipo de registro"><option value="all">Todos os registros</option>${['questions','Teoria','Revisão','Questões','Simulado','Lei seca','Videoaula','Resumo'].map(x=>`<option value="${x}" ${x===historyFilter?'selected':''}>${x==='questions'?'Com questões':x}</option>`).join('')}</select></div><section class="panel"><div id="history-list">${historyList(list)}</div></section>`}
function historyList(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Data e assunto</th><th>Tipo</th><th>Tempo real</th><th>Questões</th><th>Ações</th></tr></thead><tbody>${list.map(s=>`<tr><td>${dateLabel(s.date,true)}<small>${esc(subjectName(s.subjectId))} · ${esc(topicName(s.subjectId,s.topicId))}</small>${s.notes?`<small class="detail-text">${esc(s.notes)}</small>`:''}</td><td>${esc(s.type)}</td><td>${minutesLabel(s.minutes)}</td><td>${s.qty?`${s.correct}/${s.qty}<small>${Math.round(s.correct/s.qty*100)}% de acerto${s.board?' · '+esc(s.board):''}</small>`:'Sem questões'}</td><td>${btn('Editar','session-edit',`data-id="${s.id}"`,'quiet small')}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum registro encontrado','Suas sessões e questões aparecerão aqui depois de registradas.')}
function viewSettings(){const e=exam();return heading('Seu ritmo, suas escolhas.','Ajuste sua preparação e mantenha seus dados com você.',btn('Nova preparação','exam-new','','primary'))+`<div class="grid equal"><section class="panel">${panelHead('Preferências')}<form id="preferences-form"><label>Como quer ser chamado?<input name="name" value="${esc(db.name)}" maxlength="80" required></label><label style="margin-top:15px">Aparência<select name="theme"><option value="light" ${db.theme==='light'?'selected':''}>Clara</option><option value="dark" ${db.theme==='dark'?'selected':''}>Escura</option></select></label><div class="actions" style="margin-top:20px"><button class="primary small">Salvar preferências</button></div></form></section><section class="panel">${panelHead('Seus dados ficam com você')}<p style="font-size:.84rem;margin-bottom:18px">O Norte funciona offline e salva no navegador deste aparelho. A sincronização entre dispositivos é feita por exportação e importação de backup.</p><div class="actions">${btn('Exportar backup','export','','primary')}${btn('Importar backup','import')}</div><p class="form-help">Aceita o backup do Norte e o JSON exportado pelo seu painel anterior. A importação aparece para revisão antes de ser aplicada.</p>${btn('Conhecer exemplo em outra preparação','demo','','quiet small')}</section>${e?`<section class="panel">${panelHead('Sua preparação')}<form id="exam-settings" class="form-grid"><label class="full">Nome da preparação<input name="name" value="${esc(e.name)}" required maxlength="120"></label><label>${studyKind()==='concurso'?'Cargo':'Referência do objetivo (opcional)'}<input name="position" value="${esc(e.position)}" maxlength="150"></label><label>${studyKind()==='concurso'?'Banca':'Instituição ou referência (opcional)'}<input name="board" value="${esc(e.board)}" maxlength="120"></label><label class="full">${studyKinds[studyKind()].date}<input name="date" type="date" value="${e.date}"></label><label>Meta diária de minutos<input name="dailyMinutes" type="number" min="5" max="1440" value="${e.dailyMinutes}" required></label><label>Meta diária de questões<input name="dailyQuestions" type="number" min="1" max="5000" value="${e.dailyQuestions}" required></label><label>Meta semanal de minutos<input name="weeklyMinutes" type="number" min="5" max="10080" value="${e.weeklyMinutes}" required></label><label>Referência de acerto (%)<input name="targetAccuracy" type="number" min="1" max="100" value="${e.targetAccuracy}" required></label><label>Duração dos blocos<select name="blockMinutes">${[25,30,40,45,50].map(n=>`<option value="${n}" ${e.blockMinutes===n?'selected':''}>${n} minutos</option>`).join('')}</select></label><div class="full"><button class="primary small">Salvar preparação</button></div></form></section><section class="panel">${panelHead('Disponibilidade semanal','Sem sobrecarregar os seus dias')}<form id="availability-form">${availabilityFields(e)}<div class="actions" style="margin-top:18px"><button class="primary small">Salvar horários</button></div><p class="form-help">Os horários devem começar e terminar no mesmo dia. Desative os dias de descanso.</p></form></section>`:''}<section class="panel">${panelHead('Como usar bem o Norte')}<div class="insight"><h3>1. Personalize o edital</h3><p>Cadastre os tópicos e ajuste os pesos à importância deles na sua prova.</p></div><div class="insight"><h3>2. Planeje e execute</h3><p>Gere a semana, escolha uma tarefa e registre o resultado real.</p></div><div class="insight"><h3>3. Revise e ajuste</h3><p>Retome dificuldades, pratique cartões e acompanhe a evolução por assunto.</p></div></section><section class="panel">${panelHead('Portabilidade e recuperação')}<p style="font-size:.84rem;margin-bottom:15px">Baixe um backup regularmente, especialmente antes de limpar os dados do navegador ou trocar de aparelho. Preparações são separadas dentro deste aplicativo.</p>${e?btn('Excluir esta preparação','exam-delete','','danger'):''}<p class="form-help">A exclusão exige confirmação e oferece a opção de desfazer imediatamente.</p></section></div>`}
function availabilityFields(e){return e.availability.map(a=>`<div class="availability"><label><input type="checkbox" name="enabled-${a.day}" ${a.enabled?'checked':''}>${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][a.day]}</label><input type="time" name="start-${a.day}" value="${a.start}" aria-label="Início de ${['domingo','segunda','terça','quarta','quinta','sexta','sábado'][a.day]}" required><input type="time" name="end-${a.day}" value="${a.end}" aria-label="Fim de ${['domingo','segunda','terça','quarta','quinta','sexta','sábado'][a.day]}" required><span class="day-total muted">${minutesLabel(Math.max(0,timeMin(a.end)-timeMin(a.start)))}</span></div>`).join('')}
function modal(title,subtitle,body,submit='Salvar',handler=null,extra=''){
 const dlg=$('#modal');if(dlg.open)dlg.close();
 dlg.innerHTML=`<div class="dialog-header"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div>${btn('Fechar','modal-close','','quiet small')}</div>${handler?'<form id="modal-form">':''}${body}${handler?`<div class="form-error" id="form-error" role="alert"></div><div class="dialog-actions">${extra}${btn('Cancelar','modal-close')}<button class="primary" type="submit">${submit}</button></div></form>`:extra}`;
 dlg.showModal();
 if(handler)$('#modal-form').onsubmit=event=>{event.preventDefault();const form=event.currentTarget;try{handler(Object.fromEntries(new FormData(form)),form)}catch(e){$('#form-error').textContent=e.message}};
 $('#form-subject')?.addEventListener('change',event=>{$('#form-topic').innerHTML=topicOptions(event.target.value)});
}
function closeModal(){$('#modal').close()}
function openExam(){modal('Sua próxima conquista','Comece com seu objetivo. Depois, personalize o edital.',`<div class="form-grid"><label class="full">Nome da preparação<input name="name" required maxlength="120" placeholder="Ex.: Concurso administrativo"></label><label>Cargo<input name="position" maxlength="150" placeholder="Opcional"></label><label>Banca<input name="board" maxlength="120" placeholder="Opcional"></label><label class="full">Data da prova<input type="date" name="date"></label><label class="full">Matérias iniciais<select name="base"><option value="standard">Base geral para personalizar</option><option value="empty">Começar com edital vazio</option></select></label><p class="full form-help">A base é um exemplo organizacional. Confira cada assunto no seu edital.</p></div>`,'Criar preparação',d=>{const e=newExam(d.name.trim());if(!e.name)throw Error('Informe um nome.');Object.assign(e,{position:d.position.trim(),board:d.board.trim(),date:d.date});if(d.base==='standard')e.subjects=baseSubjects();db.exams.push(e);db.activeExam=e.id;closeModal();go('hoje');commit('Preparação criada. Personalize o edital.');})}
function baseSubjects(){return [['Língua Portuguesa',5,['Interpretação de textos','Concordância verbal e nominal','Regência e crase','Pontuação']],['Raciocínio Lógico',4,['Proposições e conectivos','Equivalências e negações','Porcentagem e proporção']],['Direito Constitucional',4,['Princípios fundamentais','Direitos e garantias fundamentais','Organização do Estado']],['Direito Administrativo',4,['Princípios da Administração Pública','Atos administrativos','Licitações e contratos']],['Informática',3,['Sistemas operacionais','Planilhas eletrônicas','Segurança da informação']]].map(([name,weight,topics])=>({id:id(),name,weight,archived:false,topics:topics.map(name=>({id:id(),name,weight:3,stage:'new',notes:'',nextReview:null,reviewCount:0}))}))}
function openSubject(sid){const s=subject(sid);modal(s?'Editar matéria':'Adicionar matéria',studyKind()==='concurso'?'O peso representa a importância da matéria na sua prova.':'O peso representa a importância desta disciplina ou tema no seu objetivo.',`<div class="form-grid"><label class="full">Nome<input name="name" value="${esc(s?.name||'')}" required maxlength="180"></label><label>Importância (1 a 5)<input type="number" name="weight" min="1" max="5" step="1" value="${s?.weight||3}" required></label>${s?`<label class="checkbox-label"><input type="checkbox" name="archived" ${s.archived?'checked':''}>Arquivar matéria</label>`:`<label class="full">Assuntos, um por linha<textarea name="topics" rows="5" placeholder="Interpretação de textos\nConcordância verbal"></textarea></label>`}</div>`,'Salvar matéria',d=>{if(!d.name.trim()||!num(d.weight,1,5))throw Error('Informe nome e peso entre 1 e 5.');if(s)Object.assign(s,{name:d.name.trim(),weight:+d.weight,archived:d.archived==='on'});else exam().subjects.push({id:id(),name:d.name.trim(),weight:+d.weight,archived:false,topics:makeTopics(d.topics)});closeModal();commit('Matéria salva.');});}
function makeTopics(text){const names=[...new Set(text.split('\n').map(x=>x.trim()).filter(Boolean))];if(names.some(x=>x.length>250))throw Error('Use até 250 caracteres por assunto.');if(names.length>1000)throw Error('Adicione até 1.000 assuntos por vez.');return names.map(name=>({id:id(),name,weight:3,stage:'new',notes:'',nextReview:null,reviewCount:0}))}
function openTopic(sid,tid){const s=subject(sid),t=topic(sid,tid);modal(t?'Detalhes do assunto':'Adicionar assuntos',esc(s.name),t?`<div class="form-grid"><label class="full">Assunto<input name="name" value="${esc(t.name)}" required maxlength="250"></label><label>Peso (1 a 5)<input name="weight" type="number" min="1" max="5" value="${t.weight}" required></label><label>Etapa<select name="stage">${stages.map(([v,l])=>`<option value="${v}" ${v===t.stage?'selected':''}>${l}</option>`).join('')}</select></label><label class="full">Próxima revisão<input type="date" name="nextReview" value="${t.nextReview||''}"></label><label class="full">Notas do assunto<textarea name="notes" rows="5">${esc(t.notes)}</textarea></label></div>`:`<label>Assuntos, um por linha<textarea name="topics" rows="8" required placeholder="Cole os tópicos do seu edital"></textarea></label>`,'Salvar',d=>{if(t){if(!d.name.trim()||!num(d.weight,1,5))throw Error('Confira nome e peso do assunto.');Object.assign(t,{name:d.name.trim(),weight:+d.weight,stage:d.stage,nextReview:d.nextReview||null,notes:d.notes.trim()})}else{const existing=new Set(s.topics.map(t=>t.name.toLowerCase()));const added=makeTopics(d.topics).filter(t=>!existing.has(t.name.toLowerCase()));if(!added.length)throw Error('Inclua pelo menos um assunto novo.');s.topics.push(...added)}closeModal();commit('Edital atualizado.');},t?btn('Excluir assunto','topic-delete',`data-sid="${sid}" data-tid="${tid}"`,'danger small'):'')}
function sessionForm({existing=null,sid=null,tid=null,pid=null,type='Teoria',minutes=null,timer=false,review=false}={}){
 const e=exam(),p=e.plans.find(p=>p.id===pid),s=existing;sid=s?.subjectId||sid||p?.subjectId||e.subjects.find(s=>!s.archived)?.id;tid=s?.topicId||tid||p?.topicId||'';
 if(!sid){toast('Adicione uma matéria antes de registrar.');go('edital');return}
 modal(s?'Editar registro':review?'Registrar revisão':'Registrar uma sessão',s?'Corrija o registro sem duplicar seu histórico.':'Tempo e questões entram juntos no histórico.',`<div class="form-grid">${selection(sid,tid)}<label>Data<input type="date" name="date" value="${s?.date||(timer?db.timer?.date:p?.date)||today()}" max="${today()}" required></label><label>Tipo<select name="type">${['Teoria','Revisão','Questões','Simulado','Lei seca','Videoaula','Resumo'].map(v=>`<option ${v===(s?.type||p?.type||type)?'selected':''}>${v}</option>`).join('')}</select></label><label>Tempo real (minutos)<input name="minutes" type="number" min="0" max="1440" step="1" value="${s?.minutes??minutes??(p?timeMin(p.end)-timeMin(p.start):30)}" required></label><label>Banca (opcional)<input name="board" value="${esc(s?.board||e.board)}" maxlength="120"></label><label>Questões resolvidas<input name="qty" type="number" min="0" max="100000" step="1" value="${s?.qty||0}" required></label><label>Acertos<input name="correct" type="number" min="0" max="100000" step="1" value="${s?.correct||0}" required></label><label class="full">O que aprendeu ou precisa retomar?<textarea name="notes" rows="3">${esc(s?.notes||'')}</textarea></label>${review?`<label class="full">Como foi recuperar o conteúdo?<select name="reviewRating"><option value="again">Preciso retomar amanhã</option><option value="hard">Lembro com esforço, voltar em 3 dias</option><option value="good" selected>Lembro bem, ampliar o intervalo</option></select></label>`:s?'':`<label class="full checkbox-label"><input type="checkbox" name="scheduleReview" checked>Agendar revisão do assunto em 1 dia</label>`}<p class="full form-help">Se registrou este bloco em outra tela, edite o registro existente para evitar duplicidade.</p></div>`,'Salvar registro',d=>{
  if(!validDate(d.date)||d.date>today())throw Error('Use uma data válida, hoje ou anterior.');
  if(!subject(d.subjectId)||d.topicId&&!topic(d.subjectId,d.topicId))throw Error('Escolha uma matéria e um assunto válidos.');
  if(!num(d.minutes,0,1440)||!Number.isInteger(+d.minutes)||!num(d.qty,0,100000)||!Number.isInteger(+d.qty)||!num(d.correct,0,+d.qty)||!Number.isInteger(+d.correct))throw Error('Confira os números: acertos não podem superar a quantidade de questões.');
  if(+d.minutes===0&&+d.qty===0)throw Error('Informe tempo de estudo ou questões resolvidas.');
  const record={id:s?.id||id(),created:s?.created||new Date().toISOString(),date:d.date,subjectId:d.subjectId,topicId:d.topicId||null,type:d.type,minutes:+d.minutes,qty:+d.qty,correct:+d.correct,notes:d.notes.trim(),board:d.board.trim(),planId:s?.planId||pid||null,source:s?.source||(timer?'timer':p?'plan':'manual')};
  if(s)Object.assign(s,record);else e.sessions.push(record);
  if(p){p.status='done';p.sessionId=record.id}
  const t=topic(d.subjectId,d.topicId);
  if(t){if(t.stage==='new')t.stage='learning';if(review){t.reviewCount=(t.reviewCount||0)+1;t.nextReview=addDays(d.date,d.reviewRating==='again'?1:d.reviewRating==='hard'?3:[7,14,30,60][Math.min(3,t.reviewCount-1)])}else if(d.scheduleReview)t.nextReview=addDays(d.date,1)}
  if(timer)db.timer=null;closeModal();commit('Sessão registrada. Bom trabalho.');
 },s?btn('Excluir registro','session-delete',`data-id="${s.id}"`,'danger small'):'');
}
function openMistake(mid){const m=exam().mistakes.find(x=>x.id===mid),sid=m?.subjectId||exam().subjects.find(s=>!s.archived)?.id;if(!sid)return toast('Adicione uma matéria primeiro.');modal(m?'Editar dificuldade':'Anotar uma dificuldade','Registre o raciocínio para aprender com o erro.',`<div class="form-grid">${selection(sid,m?.topicId)}<label class="full">Pergunta ou dificuldade<input name="title" required value="${esc(m?.title||'')}" maxlength="400" placeholder="O que você confundiu?"></label><label class="full">Motivo<select name="category">${['Conceito','Interpretação','Memorização','Atenção','Cálculo','Outro'].map(v=>`<option ${m?.category===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="full">Explicação correta e como evitar o erro<textarea name="explanation" required rows="5">${esc(m?.explanation||'')}</textarea></label></div>`,'Salvar dificuldade',d=>{if(!d.title.trim()||!d.explanation.trim())throw Error('Preencha a dificuldade e a explicação.');const data={id:m?.id||id(),subjectId:d.subjectId,topicId:d.topicId||null,title:d.title.trim(),category:d.category,explanation:d.explanation.trim(),resolved:m?.resolved||false,date:m?.date||today()};if(m)Object.assign(m,data);else exam().mistakes.push(data);closeModal();commit('Dificuldade salva.');},m?btn('Excluir','mistake-delete',`data-id="${m.id}"`,'danger small'):'')}
function openCard(cid,prefill={}){const c=exam().cards.find(x=>x.id===cid),sid=c?.subjectId||prefill.subjectId||exam().subjects.find(s=>!s.archived)?.id;if(!sid)return toast('Adicione uma matéria primeiro.');modal(c?'Editar cartão':'Criar cartão de memória','Uma pergunta específica e uma resposta clara.',`<div class="form-grid">${selection(sid,c?.topicId||prefill.topicId)}<label class="full">Pergunta<textarea name="front" required rows="3">${esc(c?.front||prefill.front||'')}</textarea></label><label class="full">Resposta<textarea name="back" required rows="4">${esc(c?.back||prefill.back||'')}</textarea></label>${c?`<label>Próxima revisão<input type="date" name="due" value="${c.due}" required></label><label class="checkbox-label"><input type="checkbox" name="suspended" ${c.suspended?'checked':''}>Suspender cartão</label>`:''}</div>`,'Salvar cartão',d=>{if(!d.front.trim()||!d.back.trim())throw Error('Preencha a pergunta e a resposta.');const data={id:c?.id||id(),subjectId:d.subjectId,topicId:d.topicId||null,front:d.front.trim(),back:d.back.trim(),due:d.due||today(),interval:c?.interval||0,reps:c?.reps||0,suspended:d.suspended==='on'};if(c)Object.assign(c,data);else exam().cards.push(data);cardAnswer=false;closeModal();commit('Cartão salvo.');},c?btn('Excluir','card-delete',`data-id="${c.id}"`,'danger small'):'')}

function openMock(){const e=exam(),subjects=e.subjects.filter(s=>!s.archived);if(!subjects.length)return toast('Adicione matérias ao edital primeiro.');modal('Registrar simulado','Informe o resultado por matéria, sem repetir uma sessão já registrada.',`<div class="form-grid"><label class="full">Nome do simulado<input name="name" maxlength="200" placeholder="Ex.: Simulado completo 01" required></label><label>Data<input name="date" type="date" value="${today()}" max="${today()}" required></label><label>Tempo máximo previsto (min)<input name="timeLimit" type="number" value="180" min="1" max="1440" required></label><label class="full">Desconto por erro<select name="penalty"><option value="0">Sem desconto</option><option value="0.5">0,5 ponto</option><option value="1">1 ponto</option></select></label></div><div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>Matéria</th><th>Resolvidas</th><th>Acertos</th><th>Minutos</th></tr></thead><tbody>${subjects.map(s=>`<tr><td>${esc(s.name)}</td><td><input type="number" name="qty-${s.id}" value="0" min="0" max="100000" aria-label="Questões de ${esc(s.name)}" required></td><td><input type="number" name="correct-${s.id}" value="0" min="0" max="100000" aria-label="Acertos de ${esc(s.name)}" required></td><td><input type="number" name="minutes-${s.id}" value="0" min="0" max="1440" aria-label="Minutos de ${esc(s.name)}" required></td></tr>`).join('')}</tbody></table></div><label style="margin-top:18px">O que ajustar no próximo simulado?<textarea name="notes" rows="3"></textarea></label>`,'Salvar simulado',d=>{if(!d.name.trim()||!validDate(d.date)||d.date>today())throw Error('Confira o nome e a data.');const records=[];for(const s of subjects){const qty=+d['qty-'+s.id],correct=+d['correct-'+s.id],minutes=+d['minutes-'+s.id];if(!num(qty,0,100000)||!Number.isInteger(qty)||!num(correct,0,qty)||!Number.isInteger(correct)||!num(minutes,0,1440)||!Number.isInteger(minutes))throw Error('Confira os números de '+s.name+'.');if(qty function readAvailability(d){return Array.from({length:7},(_,day)=>{const enabled=d['enabled-'+day]==='on',start=d['start-'+day],end=d['end-'+day];if(!/^\d\d:\d\d$/.test(start)||!/^\d\d:\d\d$/.test(end)||enabled&&timeMin(end)<=timeMin(start))throw Error('Confira os horários: o fim deve ser depois do início nos dias ativos.');return {day,enabled,start,end}})}
function generatePlan(e,start,days,block,availability,replace){
 if(!validDate(start)||start<today()||!num(days,1,30)||!num(block,10,120))throw Error('Confira a data e a duração do planejamento.');
 const ranked=recommendations(),used={},lastSubject=null;let previousSid=null;const result=[];
 for(let day=0;day<days;day++){const date=addDays(start,day);if(e.date&&date>e.date)break;const a=availability.find(x=>x.day===weekday(date));if(!a?.enabled)continue;
  let cursor=timeMin(a.start),end=timeMin(a.end);const occupied=e.plans.filter(p=>p.date===date&&p.status!=='skipped'&&(!replace||p.status==='done')).map(p=>[timeMin(p.start),timeMin(p.end)]).sort((a,b)=>a[0]-b[0]);
  while(cursor<end){const collision=occupied.find(([s,f])=>cursor>=s&&cursor<f);if(collision){cursor=collision[1];continue}const next=occupied.find(([s])=>s>cursor);const available=Math.min(end,next?.[0]??end)-cursor;if(available<10){cursor=next?next[1]:end;continue}const duration=Math.min(block,available);
   const choice=ranked.map(x=>({...x,adjusted:x.score/(1+(used[x.t.id]||0)*.9)-(x.s.id===previousSid&&ranked.some(y=>y.s.id!==previousSid)?4:0)})).sort((a,b)=>b.adjusted-a.adjusted)[0];
   result.push({id:id(),date,start:hm(cursor),end:hm(cursor+duration),subjectId:choice.s.id,topicId:choice.t.id,status:'planned',sessionId:null,type:choice.t.nextReview&&choice.t.nextReview<=date?'Revisão':'Teoria',reason:reason(choice.s,choice.t),generated:true});used[choice.t.id]=(used[choice.t.id]||0)+duration/block;previousSid=choice.s.id;cursor+=duration+5;
  }

}

function timerSurface(t,pip=false){const e=db.exams.find(e=>e.id===t.examId),s=e?.subjects.find(s=>s.id===t.subjectId),topic=s?.topics.find(x=>x.id===t.topicId),finished=t.mode==='countdown'&&t.notified;return `<section class="focus-mini ${finished?'is-finished':''}" aria-label="Cronômetro flutuante"><header class="focus-mini-header">${norbitMascot(finished?'success':t.running?'focus':'pause','tiny')}<span ${pip?'':'data-timer-drag'} class="focus-mini-grip">NORTE · FOCO</span><button class="quiet small" data-action="${pip?'timer-pip-close':'timer-dock-close'}" aria-label="Fechar ${pip?'janela':'minipainel'}">×</button></header><h2>${esc(topic?.name||s?.name||'Sessão de estudo')}</h2><p>${esc(s?.name||'Seu tempo de foco')}</p><strong class="focus-mini-count" data-timer-count>00:00</strong><span class="focus-mini-status" data-timer-status></span><div class="focus-mini-track"><span data-timer-progress></span></div>${timerAlert?`<div class="focus-mini-alert" role="status">${esc(timerAlert)}${btn('Entendi','timer-alert-dismiss','','quiet small')}</div>`:''}<div class="focus-mini-controls">${btn(finished?'Concluído':t.running?'Pausar':'Continuar','timer-toggle',finished?'disabled':'','primary small')}${btn('Registrar','timer-finish','','secondary small')}</div><div class="focus-mini-footer">${pip?'':btn('Voltar ao foco','navigate','data-route="foco"','quiet small')+btn('Janela flutuante','timer-pip','','quiet small')}</div></section>`}
function updateTimer(){const t=db.timer,dock=$('#timer-dock');if(!dock)return;if(!t){dock.hidden=true;timerDockKey='';timerAlert='';if(timerPip&&!timerPip.closed)timerPip.close();timerPip=null;return}let elapsed=timerElapsed(t);const alarm=t.alarm;
 if(t.mode==='countdown'&&elapsed>=t.duration&&t.running){t.elapsed=t.duration;t.running=false;elapsed=t.duration;const first=!t.notified;t.notified=true;if(alarm&&alarm.atSeconds>0&&elapsed>=alarm.atSeconds)alarm.fired=true;persist();if(first)timerFireAlert('Bloco concluído. Hora de uma pausa.',true);if(route==='foco'){const button=$('[data-action="timer-toggle"]');if(button){button.textContent='Concluído';button.disabled=true}}}
 else if(t.running&&alarm&&alarm.atSeconds>0&&!alarm.fired&&elapsed>=alarm.atSeconds){alarm.fired=true;persist();timerFireAlert('Lembrete: '+Math.round(alarm.atSeconds/60)+' minutos de estudo concluídos.')}
 const seconds=t.mode==='free'?elapsed:Math.max(0,t.duration-elapsed),status=t.running?'Sessão em andamento':t.notified?'Bloco concluído. Hora de uma pausa.':'Sessão pausada';if($('#timer-count'))$('#timer-count').textContent=clockLabel(seconds);if($('#timer-status'))$('#timer-status').textContent=status;if(route==='foco'&&t.notified&&t.mode==='countdown'){const b=$('[data-action="timer-toggle"]');if(b){b.textContent='Concluído';b.disabled=true}}
 if(timerPip?.closed)timerPip=null;dock.hidden=t.dockVisible===false||(route==='foco'&&!t.dockOnFocus)||!!timerPip;const key=[t.examId,t.startedAt,t.running,t.notified,t.mode,db.theme,timerAlert].join('|');
 if(dock.hidden){dock.innerHTML='';timerDockKey=''}
 if(!dock.hidden&&key!==timerDockKey){dock.innerHTML=timerSurface(t);timerDockKey=key}
 if(timerPip&&key!==timerPipKey){timerPip.document.documentElement.dataset.theme=db.theme;timerPip.document.body.innerHTML=timerSurface(t,true);timerPipKey=key}
 for(const doc of [document,...(timerPip?[timerPip.document]:[])]){doc.querySelectorAll('[data-timer-count]').forEach(el=>el.textContent=clockLabel(seconds));doc.querySelectorAll('[data-timer-status]').forEach(el=>el.textContent=status);doc.querySelectorAll('[data-timer-progress]').forEach(el=>el.style.width=(t.mode==='free'?0:Math.min(100,elapsed/t.duration*100))+'%')}
}
async function openTimerPip(){if(tour)return toast('A janela externa fica desativada durante o tutorial.');if(!db.timer)return toast('Comece uma sessão primeiro.');timerUnlockAudio();if(timerPip&&!timerPip.closed){timerPip.focus();return}if(!window.documentPictureInPicture?.requestWindow){db.timer.dockVisible=true;db.timer.dockOnFocus=true;commit();return toast('Este navegador não oferece uma janela sempre visível. Use o minipainel no Norte.')}
 try{const popup=await window.documentPictureInPicture.requestWindow({width:360,height:390});if(!db.timer){popup.close();return}timerPip=popup;timerPipKey='';popup.document.title='Norte · Cronômetro';const style=popup.document.createElement('style');style.textContent=$('style').textContent+'\nbody{margin:0;padding:16px;background:var(--bg)}.focus-mini{width:100%;box-shadow:none}.focus-mini-header .focus-mini-grip{cursor:default}';popup.document.head.append(style);popup.document.body.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;event.preventDefault();if(b.dataset.action==='timer-finish'){popup.close();go('foco');window.focus()}actions[b.dataset.action]?.(b);updateTimer()});popup.addEventListener('pagehide',()=>{if(timerPip===popup){timerPip=null;timerPipKey='';timerDockKey='';updateTimer()}});updateTimer()}catch{toast('A janela não foi aberta. Tente pelo botão novamente ou use o minipainel.')}}
Object.assign(actions,{
 'timer-start':()=>{const sid=$('#focus-subject')?.value,tid=$('#focus-topic')?.value,duration=Number($('#focus-duration')?.value||30)*60;if(!sid)return toast('Adicione uma matéria primeiro.');if(focusMode==='countdown'&&focusAlarmSettings.atMinutes*60>=duration)return toast('Escolha um lembrete menor que a duração do bloco, ou use 0.');startFocus(sid,tid);db.timer.duration=duration;db.timer.alarm.atSeconds=focusAlarmSettings.atMinutes*60;persist();updateTimer()},
 'timer-toggle':()=>{timerUnlockAudio();updateTimer();toggleTimer()},
 'timer-finish':()=>{updateTimer();finishTimer()},
 'timer-sound-test':async()=>{const enabled=await timerUnlockAudio(),ok=enabled&&timerPlaySound();if($('#timer-audio-status'))$('#timer-audio-status').textContent=ok?'Som ativado. Confira o volume do aparelho.':'O navegador não liberou o som. Tente novamente.';toast(ok?'Som de teste reproduzido.':'Som indisponível neste navegador.')},

 'timer-dock-close':()=>{if(!db.timer)return;db.timer.dockVisible=false;commit()},

});
document.addEventListener('change',event=>{const el=event.target;if(!['timer-sound','timer-reminder'].includes(el.id))return;const t=db.timer;if(el.id==='timer-sound'){focusAlarmSettings.sound=el.checked;if(t){t.alarm??={atSeconds:0,fired:false};t.alarm.sound=el.checked}if(el.checked)timerUnlockAudio()}else{const minutes=Number(el.value);if(!Number.isInteger(minutes)||minutes<0||minutes>1440||t?.mode==='countdown'&&minutes*60>=t.duration){el.value=t?Math.round((t.alarm?.atSeconds||0)/60):focusAlarmSettings.atMinutes;return toast('Use um número inteiro de 0 a 1440, menor que a duração do bloco.')}focusAlarmSettings.atMinutes=minutes;if(t){t.alarm??={sound:focusAlarmSettings.sound};t.alarm.atSeconds=minutes*60;t.alarm.fired=minutes>0&&timerElapsed(t)>=minutes*60;if(t.alarm.fired)toast('Esse tempo já passou. O lembrete valerá para o próximo bloco.')}}if(t)persist();updateTimer()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer()});window.addEventListener('pagehide',()=>{if(timerPip&&!timerPip.closed)timerPip.close()});
// Drag tracks the pointer; release settles inside the viewport with carried velocity.
document.addEventListener('pointerdown',event=>{const handle=event.target.closest('[data-timer-drag]');if(!handle||event.button!==0)return;const dock=$('#timer-dock'),rect=dock.getBoundingClientRect();cancelAnimationFrame(timerDragFrame);handle.setPointerCapture(event.pointerId);event.preventDefault();let x=rect.left,y=rect.top,vx=0,vy=0,last=performance.now(),px=event.clientX,py=event.clientY;Object.assign(dock.style,{left:x+'px',top:y+'px',right:'auto',bottom:'auto'});const move=e=>{const now=performance.now(),dt=Math.max(1,now-last);vx=(e.clientX-px)/dt*1000;vy=(e.clientY-py)/dt*1000;x+=e.clientX-px;y+=e.clientY-py;px=e.clientX;py=e.clientY;last=now;dock.style.left=x+'px';dock.style.top=y+'px'};const release=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',release);handle.removeEventListener('pointercancel',release);const tx=Math.max(8,Math.min(innerWidth-dock.offsetWidth-8,x+vx*.12)),ty=Math.max(8,Math.min(innerHeight-dock.offsetHeight-8,y+vy*.12));if(matchMedia('(prefers-reduced-motion: reduce)').matches){dock.style.left=tx+'px';dock.style.top=ty+'px';return}let time=performance.now();const step=now=>{const dt=Math.min(.032,(now-time)/1000);time=now;vx+=(260*(tx-x)-32*vx)*dt;vy+=(260*(ty-y)-32*vy)*dt;x+=vx*dt;y+=vy*dt;dock.style.left=x+'px';dock.style.top=y+'px';if(Math.abs(tx-x)+Math.abs(ty-y)+Math.abs(vx)+Math.abs(vy)>.5)timerDragFrame=requestAnimationFrame(step);else{dock.style.left=tx+'px';dock.style.top=ty+'px'}};timerDragFrame=requestAnimationFrame(step)};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',release);handle.addEventListener('pointercancel',release)});
window.addEventListener('resize',()=>{const dock=$('#timer-dock');if(!dock||dock.hidden||!dock.style.left)return;cancelAnimationFrame(timerDragFrame);const rect=dock.getBoundingClientRect();dock.style.left=Math.max(8,Math.min(innerWidth-dock.offsetWidth-8,rect.left))+'px';dock.style.top=Math.max(8,Math.min(innerHeight-dock.offsetHeight-8,rect.top))+'px'});

const studyKinds={concurso:{syllabus:"Meu edital",date:"Data da prova"}};
function studyKind(){return "concurso"}
function studyLabel(key){return routes.find(r=>r[0]===key)?.[1]||key}
function norbitMascot(state='welcome',size='small'){const sprite='<img src="'+NORBIT_MASCOT+'" alt="" width="512" height="512" draggable="false">';return '<span class="norbit-mascot mascot-'+size+'" data-state="'+state+'" aria-hidden="true"><span class="mascot-figure"><span class="mascot-body">'+sprite+'</span><span class="mascot-hand mascot-hand-left">'+sprite+'</span><span class="mascot-hand mascot-hand-right">'+sprite+'</span><i class="mascot-lid mascot-lid-left"></i><i class="mascot-lid mascot-lid-right"></i></span><i class="mascot-spark"></i></span>'}

function studyTasks(e=exam()){return (e?.studyTasks||[]).filter(t=>t.status==='open').sort((a,b)=>a.date.localeCompare(b.date))}
function deadlinePanel(){if(!exam())return '';const pending=studyTasks(),completed=(exam().studyTasks||[]).filter(t=>t.status==='done').slice(-5).reverse();return `<section class="panel study-deadlines">${panelHead(studyKind()==='faculdade'?'Provas e entregas':'Seus próximos prazos','Prazos ajudam a orientar as prioridades de estudo.',btn('Adicionar prazo','deadline-new','','secondary small'))}${pending.slice(0,8).map(t=>`<div class="row"><div class="row-time">${dateLabel(t.date)}<small>${diffDays(today(),t.date)<0?'Atrasado':diffDays(today(),t.date)===0?'Hoje':diffDays(today(),t.date)+' dias'}</small></div><div class="row-main"><h3>${esc(t.title)}</h3><p>${esc(t.kind)}${t.subjectId?' · '+esc(subjectName(t.subjectId)):''}</p></div><div class="actions">${btn('Concluir','deadline-done',`data-id="${esc(t.id)}"`,'quiet small')}${btn('Editar','deadline-edit',`data-id="${esc(t.id)}"`,'quiet small')}</div></div>`).join('')||empty('Dê lugar aos seus prazos','Cadastre provas, trabalhos ou projetos. Concluir um prazo não registra tempo de estudo.')}${pending.length>8?`<details><summary>Mais ${pending.length-8} prazos</summary>${pending.slice(8).map(t=>`<div class="row"><div class="row-main"><h3>${esc(t.title)}</h3><p>${dateLabel(t.date)} · ${esc(t.kind)}</p></div>${btn('Editar','deadline-edit',`data-id="${esc(t.id)}"`,'quiet small')}</div>`).join('')}</details>`:''}${completed.length?`<details><summary>Concluídos recentemente</summary>${completed.map(t=>`<div class="row"><div class="row-main"><h3>${esc(t.title)}</h3><p>${dateLabel(t.date)}</p></div>${btn('Reabrir','deadline-reopen',`data-id="${esc(t.id)}"`,'quiet small')}</div>`).join('')}</details>`:''}</section>`}
function openDeadline(taskId){const e=exam();if(!e)return;const task=e.studyTasks?.find(t=>t.id===taskId);modal(task?'Editar prazo':'Um próximo passo com data','Associe uma matéria para ela receber atenção perto do prazo.',`<div class="form-grid"><label class="full">Título<input name="title" required maxlength="200" value="${esc(task?.title||'')}" placeholder="Ex.: Prova de Cálculo I"></label><label>Tipo<select name="kind">${['Prova','Trabalho','Projeto','Revisão','Outro'].map(k=>`<option ${task?.kind===k?'selected':''}>${k}</option>`).join('')}</select></label><label>Data<input type="date" name="date" required value="${task?.date||today()}"></label><label class="full">Matéria ou disciplina<select name="subjectId"><option value="">Sem matéria associada</option>${subjectOptions(task?.subjectId)}</select></label><p class="form-help full">O prazo não cria uma sessão nem muda seus horários sozinho. Gere o plano para obter uma nova sugestão e confira antes de aplicar.</p></div>`,'Salvar prazo',d=>{if(!d.title.trim()||!validDate(d.date))throw Error('Confira o título e a data.');if(d.subjectId&&!subject(d.subjectId))throw Error('Escolha uma matéria disponível.');if((e.studyTasks?.length||0)>=2000&&!task)throw Error('Você já tem 2.000 prazos neste espaço.');snapshot();e.studyTasks??=[];const values={title:d.title.trim(),kind:d.kind,date:d.date,subjectId:d.subjectId||null};if(task)Object.assign(task,values);else e.studyTasks.push({id:id(),status:'open',...values});closeModal();commit('Prazo salvo. Revise seu planejamento.',true)})}
function deadlineAIContext(e){return studyTasks(e).length?['Prazos em aberto (até 8):',...studyTasks(e).slice(0,8).map(t=>'- '+t.date+' | '+t.kind+' | '+t.title+' | '+(e.subjects.find(s=>s.id===t.subjectId)?.name||'Sem disciplina associada'))].join('\n'):''}
Object.assign(actions,{'deadline-new':()=>openDeadline(),'deadline-edit':b=>openDeadline(b.dataset.id),'deadline-done':b=>{const t=exam()?.studyTasks?.find(t=>t.id===b.dataset.id);if(t){snapshot();t.status='done';commit('Prazo concluído. O histórico de estudos permanece separado.',true)}},'deadline-reopen':b=>{const t=exam()?.studyTasks?.find(t=>t.id===b.dataset.id);if(t){snapshot();t.status='open';commit('Prazo reaberto.',true)}}});
function viewDeadlines(){return heading('Cada prazo, um próximo passo.','Organize provas, trabalhos e projetos. Associe disciplinas para orientar suas prioridades.')+deadlinePanel()}
function viewPersonalToday(){return viewToday()+deadlinePanel()}
function viewPersonalPlan(){return viewPlan()+deadlinePanel()}
function studyDeadlinePriority(subjectId){const pending=studyTasks().filter(t=>t.subjectId===subjectId);if(!pending.length)return 0;return Math.max(...pending.map(t=>Math.max(0,14-Math.max(0,diffDays(today(),t.date)))*.75))}
function studyTourCapture(){return {alarm:clone(focusAlarmSettings),alert:timerAlert,ai:{aiMode,aiContent,aiSubmittedContent,aiResult:aiResult?clone(aiResult):null,aiError,aiExamId,aiQuizIndex,aiUseContext,aiQuestionCount,aiDifficulty,aiGeneratedDifficulty,aiChatId,aiActiveResultId,aiChatSearch,aiChatListOpen}}}

function aiChatHistoryPayload(chat){
 const rows=[];let remaining=14000;
 for(const m of [...chat.messages].reverse()){
  if(m.error)continue;let text=m.role==='user'?m.content:m.result?.explanation||JSON.stringify(m.result);
  if(!text||remaining<=0)continue;text=text.slice(0,Math.min(4000,remaining));remaining-=text.length;rows.unshift({role:m.role,content:text});if(rows.length===12)break;
 }
 // A provider conversation must start with a student turn.
 while(rows[0]?.role==='assistant')rows.shift();return rows;
}

 if(!chat){if(db.aiChats.length>=60)throw Error('Você tem 60 conversas salvas. Exporte um backup e exclua uma para abrir espaço.');chat={id:id(),examId:exam()?.id||null,title:content.replace(/\s+/g,' ').slice(0,70),created:new Date().toISOString(),updated:new Date().toISOString(),messages:[]};db.aiChats.push(chat);aiChatId=chat.id}

 const history=aiChatHistoryPayload(chat),last=chat.messages.at(-1);

}

/* Native, finite motion. Study data and input handling remain synchronous. */
const siteMotion = (() => {
 const preference=matchMedia('(prefers-reduced-motion: reduce)');
 const active=new Set(),owners=new WeakMap();
 let observer=null,lastPage='';
 // A critically damped spring sampled once, without an idle animation loop.
 const spring=Array.from({length:25},(_,i)=>{
  const t=i/24,decay=(1+9*t)*Math.exp(-9*t);
  return {offset:t,opacity:1-.22*decay,transform:`translateY(${8*decay}px)`};
 });
 spring[spring.length-1]={offset:1,opacity:1,transform:'translateY(0)'};
 function play(element,frames,options={}){
  if(!element||!element.isConnected||preference.matches||document.hidden||typeof element.animate!=='function')return;
  owners.get(element)?.cancel();
  const animation=element.animate(frames,{duration:340,easing:'linear',fill:'backwards',...options});
  owners.set(element,animation);
  active.add(animation);
  animation.finished.catch(()=>{}).finally(()=>{active.delete(animation);animation.cancel()});
  return animation;
 }
 function clear(){observer?.disconnect();observer=null;for(const animation of active)animation.cancel();active.clear()}
 function chart(element){
  const bars=[...element.querySelectorAll('.chart-bar,.progress>span')].slice(0,40);
  bars.forEach((bar,i)=>play(bar,[{transform:bar.matches('.chart-bar')?'scaleY(.1)':'scaleX(.1)'},{transform:'scale(1)'}],{duration:420,delay:Math.min(i*14,70),easing:'cubic-bezier(.22,.8,.25,1)'}));
 }
 function page(){
  const key=route+':'+(db.activeExam||'');
  const changed=key!==lastPage;lastPage=key;clear();
  if(!changed||preference.matches||document.hidden||tour||route==='ia')return;
  const content=$('#content');
  // Animate containers, never every row, nested panel or editable control.
  const candidates=[...content.querySelectorAll('.heading,.page-heading,.hero,.panel,.onboarding')].filter(el=>!el.parentElement.closest('.panel,.hero,.onboarding')).slice(0,60);
  let visible=0;
  const reveal=element=>{play(element,spring,{delay:Math.min(visible++*24,72)});chart(element)};
  observer=new IntersectionObserver(entries=>{

function practiceSetup(){if(studio().draft){go('banco');return}const questions=bankQuestions();if(!questions.length)return toast('Adicione questões ou ajuste os filtros antes de montar um treino.');modal('Seu próximo treino','Usaremos as questões dos filtros atuais. O gabarito aparece somente no final.',`<label>Nome<input name="title" required maxlength="200" value="Treino de ${dateLabel(today())}"></label><div class="form-grid"><label>Quantidade<input name="count" type="number" min="1" max="${Math.min(50,questions.length)}" value="${Math.min(10,questions.length)}" required></label><label>Tempo (minutos)<input name="minutes" type="number" min="1" max="180" value="30" required></label></div><p class="form-help">O relógio continua ao sair da tela. Seu progresso fica neste navegador. Não existe correção por IA durante o treino.</p>`,'Começar treino',d=>{if(!Number.isInteger(+d.count)||!num(d.count,1,Math.min(50,questions.length))||!Number.isInteger(+d.minutes)||!num(d.minutes,1,180))throw Error('Confira quantidade e tempo.');if(studio().attempts.length>=100)throw Error('Exporte um backup e remova um treino antigo para abrir espaço.');const shuffled=questions.slice();for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}const draftStore=writeStudio();draftStore.draft={id:id(),title:d.title.trim(),date:today(),minutes:0,questions:clone(shuffled.slice(0,+d.count)),choices:Array(+d.count).fill(null),flags:[],startedAt:Date.now(),limitSeconds:+d.minutes*60};try{studioRoom()}catch(error){delete draftStore.draft;throw error}practiceIndex=0;practiceResultId=null;persist();closeModal();go('banco')})}

function registerAttempt(attempt){if(attempt.sessionIds?.length)return toast('Este treino já foi registrado.');const groups=new Map();attempt.questions.forEach((q,i)=>{if(!subject(q.subjectId))return;const key=q.subjectId+':'+(q.topicId||'');if(!groups.has(key))groups.set(key,{sid:q.subjectId,tid:q.topicId,qty:0,correct:0});const g=groups.get(key);g.qty++;g.correct+=attempt.choices[i]===q.answer?1:0});if(!groups.size)return toast('Associe as questões a matérias desta preparação antes de registrar.');modal('Registrar este treino','Confira o tempo total. Cada assunto terá um registro; o tempo será distribuído sem duplicação.',`<p>${attempt.questions.length} questões · ${groups.size} assuntos.</p><label>Minutos reais<input name="minutes" type="number" min="0" max="1440" value="${attempt.minutes}" required></label>`,'Registrar no histórico',d=>{if(!Number.isInteger(+d.minutes)||!num(d.minutes,0,1440))throw Error('Confira os minutos.');if(attempt.sessionIds?.length)throw Error('Este treino já está registrado.');snapshot();let assigned=0;const items=[...groups.values()];attempt.sessionIds=items.map((g,i)=>{const minutes=i===items.length-1?+d.minutes-assigned:Math.floor(+d.minutes*g.qty/attempt.questions.length);assigned+=minutes;const record={id:id(),created:new Date().toISOString(),date:attempt.date,subjectId:g.sid,topicId:g.tid||null,type:'Simulado',minutes,qty:g.qty,correct:g.correct,notes:'Treino: '+attempt.title,board:'',planId:null,source:'practice'};exam().sessions.push(record);return record.id});closeModal();commit('Resultado registrado uma única vez. Você pode desfazer.',true)})}

 if(!form.isConnected||aiBusy)return;

 if(cached){const turn=aiChatBegin(content,aiMode);aiResult=clone(cached.result);aiExamId=exam()?.id||null;aiSubmittedContent=content;aiContent='';aiError='';aiGeneratedDifficulty=aiDifficulty;aiQuizIndex=0;tutorCacheHit=true;tutorHintsShown=0;tutorMissionDone=[];aiChatFinish(turn,aiResult,'');aiCleanupWidget();render();return}
 tutorCacheHit=false;tutorHintsShown=0;tutorMissionDone=[];

function bankPerformance(){const map=new Map();for(const a of studio().attempts)for(let i=0;i<a.questions.length;i++){const key=a.questions[i].id,old=map.get(key)||{total:0,correct:0};map.set(key,{total:old.total+1,correct:old.correct+(a.choices[i]===a.questions[i].answer?1:0),last:a.choices[i]===a.questions[i].answer?'correct':a.choices[i]===null?'blank':'wrong'})}return map}

viewQuestionBank=function(){if(studio().draft)return practicePage();if(practiceResultId)return practiceResults();const e=exam(),results=bankPerformance(),practiced=e.studio?.bank.filter(q=>results.has(q.id)).length||0,total=studio().bank.length,filtered=bankQuestions().length;return heading('Seu repertório cresce aqui.','Encontre uma pergunta, tente responder e entenda o raciocínio.',btn('Nova questão','bank-new','','primary')+btn('Importar questões','bank-import'))+`<div class="bank-overview"><div><strong>${total}</strong><span>na coleção</span></div><div><strong>${practiced}</strong><span>praticadas em treinos</span></div><div><strong>${studio().bank.filter(q=>q.favorite).length}</strong><span>favoritas</span></div><p>Praticar uma pergunta é uma consulta rápida.<br>Monte um treino para salvar o resultado.</p></div><section class="panel bank-controls" aria-label="Encontre suas questões"><div class="bank-search-row"><label class="bank-search-label"><span class="sr-only">Buscar questões</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="bank-search" type="search" placeholder="Busque por enunciado, assunto ou origem" maxlength="250" value="${esc(bankSearch)}"></label>${btn('Limpar filtros','bank-reset','','quiet small')}</div><div class="filters bank-filters"><label>Matéria<select id="bank-subject"><option value="">Todas</option>${subjectOptions(bankSubject)}</select></label><label>Assunto<select id="bank-topic" ${bankSubject?'':'disabled'}><option value="">${bankSubject?'Todos os assuntos':'Escolha uma matéria'}</option>${(subject(bankSubject)?.topics||[]).map(t=>`<option value="${esc(t.id)}" ${bankTopic===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Dificuldade<select id="bank-difficulty">${[['all','Todas'],['easy','Fácil'],['medium','Média'],['hard','Difícil']].map(([v,l])=>`<option value="${v}" ${bankDifficulty===v?'selected':''}>${l}</option>`).join('')}</ validateBackup=function(data){validateBeforeConnected(data);for(const e of data.exams){const d=e.studio?.connected;if(!d)continue;if(!Array.isArray(d.notebooks)||d.notebooks.length>100||d.notebooks.some(n=>!n||typeof n.id!=='string'||n.id.length>150||typeof n.name!=='string'||!n.name.trim()||n.name.length>100)||new Set(d.notebooks.map(n=>n.id)).size!==d.notebooks.length||!d.reviews||typeof d.reviews!=='object'||Array.isArray(d.reviews)||Object.keys(d.reviews).length>500||Object.values(d.reviews).some(r=>!validDate(r.due)||!Number.isInteger(r.interval)||!num(r.interval,1,180))||!Array.isArray(d.reports)||d.reports.length>100||d.reports.some(r=>!r||typeof r.id!=='string'||typeof r.reason!=='string'||r.reason.length>2000||!validDate(r.date)))throw Error('Os dados conectados do backup estão inválidos.');const g=d.guided;if(g&&(!subjectIn(e,g.sid,g.tid)||!Number.isInteger(g.step)||!num(g.step,0,4)||typeof g.recall!=='string'||g.recall.length>12000||typeof g.reflection!=='string'||g.reflection.length>12000||!Array.isArray(g.questions)||g.questions.length>5||g.questions.some(q=>!validBankQuestion(q))||!Array.isArray(g.choices)||g.choices.length!==g.questions.length||!Number.isFinite(g.startedAt)||!Array.isArray(g.grades)||g.grades.some(v=>v!==null&&v!==0&&v!==1)))throw Error('A sessão guiada está inválida.')}return true};

const outputBeforeNorbit=aiOutput;aiOutput=function(){const html=outputBeforeNorbit();if(!aiResult||aiBusy||aiError)return html;return (aiResult.needsReview?'<p class="note warn">Você sinalizou esta resposta. Confira o material antes de usá-la.</p>':'')+html+`<div class="norbit-response-actions">${aiResult.explanation?btn('Mais simples','norbit-reexplain','data-depth="simple"','quiet small')+btn('Outro exemplo','norbit-reexplain','data-depth="example"','quiet small')+btn('Transformar em próximo passo','norbit-apply','','secondary small'):''}${btn('Sinalizar um problema','norbit-report','','quiet small')}</div>`};
const questionCardBeforeNorbit=aiQuestionCard;aiQuestionCard=function(q,i,total){return questionCardBeforeNorbit(q,i,total)+(q.revealed&&q.quote?`<details class="tutor-evidence"><summary>Trecho de apoio desta questão</summary><blockquote>${esc(q.quote)}</blockquote><p class="form-help">A presença do trecho foi conferida. Confira também a interpretação e o gabarito.</p></details>`:'')};
function norbitApply(){if(!aiResult?.explanation)return;modal('Escolha o que guardar','Revise a sugestão antes de aplicar. Nenhuma atividade foi criada ainda.',`<div class="form-grid">${selection(norbitSubject,norbitTopic)}<label class="full">Título ou pergunta<input name="title" maxlength="250" required value="${esc((aiResult.steps?.[0]||aiSubmittedContent||'Retomar esta ideia').slice(0,250))}"></label><label class="full">Explicação ou tarefa<textarea name="text" rows="5" maxlength="12000" required>${esc(aiResult.explanation)}</textarea></label><label class="checkbox-label"><input name="card" type="checkbox">Criar cartão editável</label><label class="checkbox-label"><input name="review" type="checkbox">Agendar revisão do assunto</label><label class="checkbox-label full"><input name="plan" type="checkbox">Criar atividade no planejamento</label><label>Data<input name="date" type="date" min="${today()}" value="${addDays(today(),1)}" required></label><label>Início<input name="start" type="time" value="19:00" required></label><label>Duração (minutos)<input name="minutes" type="number" min="5" max="180" value="25" required></label></div>`,'Aplicar escolhas',d=>{if(!subject(d.subjectId)||!topic(d.subjectId,d.topicId)||!d.title.trim()||!d.text.trim())throw Error('Escolha matéria, assunto e confira os textos.');if(!['card','review','plan'].some(k=>d[k]==='on'))throw Error('Escolha pelo menos uma ação.');if(!validDate(d.date)||d.date<today())throw Error('Confira a data.');const start=timeMin(d.start),end=start+(+d.minutes);if(d.plan==='on'&&(!Number.isInteger(+d.minutes)||!num(d.minutes,5,180)||end>=1440||exam().plans.some(p=>p.date===d.date&&p.status!=='skipped'&&timeMin(p.start)<end&&timeMin(p.end)>start)))throw Error('Escolha uma duração válida e um horário livre no mesmo dia.');snapshot();if(d.card==='on')exam().cards.push({id:id(),subjectId:d.subjectId,topicId:d.topicId,front:d.title.trim(),back:d.text.trim(),due:today(),interval:0,reps:0,suspended:false});if(d.review==='on')topic(d.subjectId,d.topicId).nextReview=d.date;if(d.plan==='on')exam().plans.push({id:id(),subjectId:d.subjectId,topicId:d.topicId,date:d.date,start:d.start,end:String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0'),type:'Revisão',reason:d.title.trim(),status:'planned',sessionId:null});closeModal();commit('Suas escolhas foram aplicadas. Você pode desfazer.',true)})}
Object.assign(actions,{
 'norbit-reexplain':b=>{if(aiBusy)return;norbitDepth=b.dataset.depth;aiContent=(norbitDepth==='simple'?'Explique a última resposta em palavras mais simples, mantendo as ressalvas.':'Dê outro exemplo da última explicação e identifique o que é exemplo.');aiMode='explain';tutorTool='explain';render();aiFocusComposer()},
 'norbit-apply':norbitApply,'norbit-report':()=>{if(!aiResult)return;modal('O que precisa ser conferido?','A sinalização fica neste aparelho e impede a reutilização automática desta resposta.',`<label>Problema encontrado<textarea name="reason" maxlength="2000" required rows="4" placeholder="Ex.: o gabarito parece contradizer o trecho…"></textarea></label>`,'Guardar para conferir',d=>{if(!d.reason.trim())throw Error('Descreva a dúvida.');if(connected().reports.length>=100)throw Error('Confira uma sinalização antiga para abrir espaço.');snapshot();aiResult.needsReview=true;studio().cache.forEach(row=>{if(row.key===aiResult.cacheKey)row.result.needsReview=true});writeConnected().reports.push({id:id(),date:today(),reason:d.reason.trim(),label:(aiSubmittedContent||'Resposta da NORBIT').slice(0,120),chatId:aiChatId||null});closeModal();commit('Resposta marcada para conferir.',true)})},
 'norbit-report-done':b=>{snapshot();writeConnected().reports=connected().reports.filter(r=>r.id!==b.dataset.id);commit('Sinalização concluída. A resposta permanece marcada até você conferir sua fonte.',true)}
});
