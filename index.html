<script>'use strict';
const STORE='norte.study.v1';
const $=(q,root=document)=>root.querySelector(q);
const $$=(q,root=document)=>[...root.querySelectorAll(q)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);

const addDays=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

const dateLabel=(d,full=false)=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',full?{day:'2-digit',month:'short',year:'numeric'}:{day:'2-digit',month:'short'});
const minutesLabel=n=>{n=Math.round(n);return n>=60?`${Math.floor(n/60)}h${n%60?' '+n%60+'min':''}`:`${n}min`};
const hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const timeMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const clockLabel=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
const safeURL=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const num=(v,min,max)=>Number.isFinite(+v)&&+v>=min&&+v<=max;
const clone=v=>JSON.parse(JSON.stringify(v));
const defaults=()=>({version:1,name:'Estudante',theme:'light',activeExam:null,exams:[],timer:null});
let db=defaults(),storageProblem='',recoveryRaw=null,recoveryProtected=false;
let route='hoje',planDate=today(),analyticsDays=14,sessionFilter='',topicFilter='',topicStatus='all',mistakeFilter='open',historyFilter='all',reviewCardId=null,cardAnswer=false,cardMode='review',undoState=null,toastTimeout,previewPlan=[],searchText='';
const routes=[['hoje','Hoje'],['plano','Planejamento'],['edital','Meu edital'],['foco','Sessão de foco'],['questoes','Questões e erros'],['simulados','Simulados'],['revisoes','Revisões'],['cartoes','Cartões de memória'],['evolucao','Evolução'],['biblioteca','Biblioteca'],['historico','Histórico'],['ajustes','Ajustes']];
const stages=[['new','Não iniciado'],['learning','Em estudo'],['covered','Teoria concluída'],['mastered','Consolidado']];
try{recoveryRaw=localStorage.getItem(STORE+'.recovery');recoveryProtected=!!recoveryRaw;const raw=localStorage.getItem(STORE);if(raw){db=JSON.parse(raw);validateBackup(db)}}catch(e){try{recoveryRaw=localStorage.getItem(STORE)}catch{}recoveryProtected=false;storageProblem='Não foi possível carregar os dados salvos. Baixe os dados originais para recuperação antes de continuar.';db=defaults()}
function exam(){return db.exams.find(e=>e.id===db.activeExam)||null}
function newExam(name='Minha preparação'){return {id:id(),name,date:'',board:'',position:'',dailyMinutes:90,dailyQuestions:20,weeklyMinutes:600,targetAccuracy:80,blockMinutes:30,availability:Array.from({length:7},(_,day)=>({day,enabled:day!==0,start:'19:00',end:'20:30'})),subjects:[],sessions:[],plans:[],cards:[],mistakes:[],resources:[],mockExams:[]}}
function persist(){try{if(recoveryRaw&&!recoveryProtected){localStorage.setItem(STORE+'.recovery',recoveryRaw);recoveryProtected=true}localStorage.setItem(STORE,JSON.stringify(db));storageProblem='';return true}catch{storageProblem='O navegador não conseguiu salvar. Exporte um backup agora para preservar seus registros.';return false}}
function commit(message,undo=false){persist();render();if(message)toast(message,undo)}
function toast(message,undo=false){clearTimeout(toastTimeout);const el=$('#toast');el.innerHTML=`<span>${esc(message)}</span>${undo?'<button data-action="undo">Desfazer</button>':''}`;el.classList.add('show');toastTimeout=setTimeout(()=>el.classList.remove('show'),undo?12000:5000)}
function snapshot(){undoState=clone(db)}
function subject(sid,e=exam()){return e?.subjects.find(s=>s.id===sid)}
function topic(sid,tid,e=exam()){return subject(sid,e)?.topics.find(t=>t.id===tid)}
function subjectName(sid){return subject(sid)?.name||'Matéria arquivada'}
function topicName(sid,tid){return topic(sid,tid)?.name||'Estudo geral'}
function allTopics(e=exam()){return e?e.subjects.flatMap(s=>s.topics.map(t=>({s,t}))):[]}
function stats(sessions){const m=sessions.reduce((a,s)=>a+s.minutes,0),q=sessions.reduce((a,s)=>a+s.qty,0),c=sessions.reduce((a,s)=>a+s.correct,0);return {m,q,c,accuracy:q?Math.round(c/q*100):null}}
function periodSessions(days,e=exam()){const start=addDays(today(),1-days);return e?e.sessions.filter(s=>s.date>=start&&s.date<=today()):[]}
function topicStats(sid,tid,days=null){return stats((days?periodSessions(days):exam().sessions).filter(x=>x.subjectId===sid&&(!tid||x.topicId===tid)))}
function lastStudied(sid,tid){return exam().sessions.filter(x=>x.subjectId===sid&&(!tid||x.topicId===tid)&&x.date<=today()).map(x=>x.date).sort().at(-1)}
function topicPriority(s,t){const st=topicStats(s.id,t.id,30),last=lastStudied(s.id,t.id);const smooth=(st.c+5)/(st.q+10);const days=last?Math.min(30,Math.max(0,diffDays(last,today()))):15;const due=t.nextReview&&t.nextReview<=today();return s.weight*3+t.weight*1.5+(1-smooth)*10+days*.22+(t.stage==='new'?3:0)+(due?6:0)-(t.stage==='mastered'?3:0)}
function recommendations(){return allTopics().filter(x=>!x.s.archived).map(x=>({...x,score:topicPriority(x.s,x.t)})).sort((a,b)=>b.score-a.score)}
function reason(s,t){const st=topicStats(s.id,t.id,30);if(t.nextReview&&t.nextReview<=today())return 'Revisão pendente';if(st.q>=10&&st.accuracy<exam().targetAccuracy)return `${st.accuracy}% de acerto em ${st.q} questões recentes`;if(t.stage==='new')return 'Tópico ainda não iniciado';const last=lastStudied(s.id,t.id);return last?`${diffDays(last,today())} dias desde o último estudo`:'Construa uma primeira referência de desempenho'}
function dueTopics(){return allTopics().filter(x=>!x.s.archived&&x.t.nextReview&&x.t.nextReview<=today()).sort((a,b)=>a.t.nextReview.localeCompare(b.t.nextReview))}
function dueCards(){return exam().cards.filter(c=>c.due<=today()&&!c.suspended)}
function streak(){const dates=new Set(exam().sessions.filter(s=>s.minutes>0||s.qty>0).map(s=>s.date));let day=dates.has(today())?today():addDays(today(),-1),n=0;while(dates.has(day)){n++;day=addDays(day,-1)}return n}
const btn=(label,action,extra='',kind='secondary')=>`<button class="${kind}" data-action="${action}" ${extra}>${label}</button>`;
const tag=(text,kind='')=>`<span class="tag ${kind}">${esc(text)}</span>`;

const heading=(title,subtitle,actions='')=>`<div class="page-heading"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="heading-actions">${actions}</div></div>`;
const empty=(title,text,button='')=>`<div class="empty"><div class="empty-mark">+</div><h3>${title}</h3><p>${text}</p>${button}</div>`;
const panelHead=(title,sub='',action='')=>`<div class="panel-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`;
const metric=(label,value,foot='')=>`<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`;
function subjectOptions(sel){return exam().subjects.filter(s=>!s.archived||s.id===sel).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('')}
function topicOptions(sid,sel){return `<option value="">Estudo geral da matéria</option>`+(subject(sid)?.topics||[]).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)}</option>`).join('')}
function selection(sid,tid){return `<label>Matéria<select name="subjectId" id="form-subject" required>${subjectOptions(sid)}</select></label><label>Assunto<select name="topicId" id="form-topic">${topicOptions(sid||exam().subjects.find(s=>!s.archived)?.id,tid)}</select></label>`}
function render(){
  document.documentElement.dataset.theme=db.theme;
  $('#avatar').textContent=db.name.trim().charAt(0).toUpperCase()||'E';
  $('#exam-select').innerHTML=db.exams.map(e=>`<option value="${e.id}" ${e.id===db.activeExam?'selected':''}>${esc(e.name)}</option>`).join('')||'<option>Comece sua preparação</option>';
  const due=exam()?dueTopics().length+dueCards().length:0;
  $('#nav').innerHTML=routes.map(([r,label],i)=>`${i===8?'<div class="nav-divider"></div>':''}<a class="nav-item ${route===r?'active':''}" href="#${r}" ${route===r?'aria-current="page"':''}><span class="nav-index">${String(i+1).padStart(2,'0')}</span>${label}${r==='revisoes'&&due?`<span class="count-badge">${due}</span>`:''}</a>`).join('');

  $('#content').innerHTML=(storageProblem?`<div class="note warn" style="margin-bottom:20px">${esc(storageProblem)} ${btn('Exportar backup','export','','secondary small')}${recoveryRaw?btn('Baixar dados para recuperação','recovery-export','','secondary small'):''}</div>`:'')+(!exam()&&route!=='ajustes'?viewWelcome():views[route]());
  syncFocusUI();updateTimer();
}
function syncFocusUI(){if(route!=='foco'||db.timer||!exam())return;$$('[data-action="focus-mode"]').forEach(b=>b.classList.toggle('active',b.dataset.mode===focusMode));if($('#focus-duration')){$('#focus-duration').closest('label').hidden=focusMode==='free';$('#timer-count').textContent=focusMode==='free'?'00:00':$('#focus-duration').value+':00'}}
function viewWelcome(){return heading('Um caminho mais claro.','Organize sua preparação, estude com intenção e acompanhe o que está aprendendo.')+`<section class="panel onboarding"><div class="tag blue">Bem-vindo ao Norte</div><h2>Seu próximo passo começa aqui.</h2><p>Defina seu concurso e transforme o edital em pequenos passos. Você pode começar com uma base de matérias e adaptar tudo depois.</p><div class="actions">${btn('Criar minha preparação','exam-new','','primary')}${btn('Conhecer com dados de exemplo','demo')}</div><div class="separation"></div><p style="font-size:.8rem;margin:0">Seus registros ficam neste navegador. Exporte backups para levar os dados a outro aparelho.</p></section>`}
function viewToday(){
 const e=exam(),st=stats(e.sessions.filter(s=>s.date===today())),week=stats(periodSessions(7)),recs=recommendations(),next=e.plans.find(p=>p.date===today()&&p.status==='planned'),rec=next?{s:subject(next.subjectId),t:topic(next.subjectId,next.topicId)}:recs[0],dues=dueTopics(),cards=dueCards();
 const title=rec?.t?rec.t.name:'Seu edital, seu ponto de partida';
 const topics=allTopics(),covered=topics.filter(x=>['covered','mastered'].includes(x.t.stage)).length,coverage=topics.length?Math.round(covered/topics.length*100):0;
 const days=e.date?diffDays(today(),e.date):null;
 const activity=e.plans.filter(p=>p.date===today()).sort((a,b)=>a.start.localeCompare(b.start));
 return heading(`Seu estudo de hoje.`,`${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · ${esc(db.name)}${days!==null?` · ${days>=0?days+' dias até a prova':'Data da prova passou'}`:''}`,btn('Planejar semana','navigate','data-route="plano"'))+
 `<div class="metrics">${metric('Tempo de estudo',minutesLabel(st.m),`${Math.round(st.m/(e.dailyMinutes||1)*100)}% da meta de hoje`)}${metric('Questões resolvidas',st.q,`Meta diária: ${e.dailyQuestions}`)}${metric('Acertos de hoje',st.accuracy===null?'Sem dados':st.accuracy+'%',st.q?`${st.c} acertos em ${st.q} questões`:'Registre suas primeiras questões')}${metric('Constância',`${streak()} <span>dias</span>`,'Dias com estudo ou questões')}</div>`+
 `<div class="grid two"><div><section class="hero"><div>${tag(next?'Próximo no seu plano':'Sugestão para começar','blue')}<h2>${esc(title)}</h2><p>${rec?.t?`${esc(rec.s.name)} · ${esc(reason(rec.s,rec.t))}.`:'Adicione os tópicos do seu edital para receber sugestões explicadas.'}</p><div class="actions">${rec?.t?btn('Iniciar sessão de foco','start-focus',`data-sid="${rec.s.id}" data-tid="${rec.t.id}" ${next?`data-pid="${next.id}"`:''}`,'primary'):btn('Organizar meu edital','navigate','data-route="edital"','primary')}${btn('Registrar um estudo','session')}</div></div><div class="hero-monogram" aria-hidden="true">n.</div></section>
 <section class="panel">${panelHead('Seu plano de hoje',`${activity.length} atividades planejadas`,btn('Ver semana','navigate','data-route="plano"','quiet small'))}${activity.length?activity.map(planRow).join(''):empty('Ainda sem plano para hoje','Escolha seus horários e gere uma semana possível de cumprir.',btn('Montar planejamento','navigate','data-route="plano"'))}</section>
 <section class="panel subsection">${panelHead('Onde colocar sua atenção','Sugestões baseadas em peso, revisões e desempenho recente')}${recs.slice(0,3).map((x,i)=>`<div class="row"><span class="row-time">0${i+1}</span><div class="row-main"><h3>${esc(x.t.name)}</h3><p>${esc(x.s.name)} · ${esc(reason(x.s,x.t))}</p></div>${btn('Estudar','start-focus',`data-sid="${x.s.id}" data-tid="${x.t.id}"`,'quiet small')}</div>`).join('')||empty('Seu edital dá direção','Adicione assuntos para construir uma rotina personalizada.')}</section></div>
 <div class="stack"><section class="panel">${panelHead('Um pouco, todos os dias','Metas que respeitam seu ritmo',btn('Editar','navigate','data-route="ajustes"','quiet small'))}<div class="goal-row"><div class="spread"><span>Estudo hoje</span><strong>${minutesLabel(st.m)} / ${minutesLabel(e.dailyMinutes)}</strong></div>${progress(st.m,e.dailyMinutes)}</div><div class="goal-row"><div class="spread"><span>Questões hoje</span><strong>${st.q} / ${e.dailyQuestions}</strong></div>${progress(st.q,e.dailyQuestions)}</div><div class="goal-row"><div class="spread"><span>Últimos 7 dias</span><strong>${minutesLabel(week.m)} / ${minutesLabel(e.weeklyMinutes)}</strong></div>${progress(week.m,e.weeklyMinutes)}</div></section>
 <section class="panel">${panelHead('Recuperar para lembrar','Revisões e prática de memória')}<div class="row"><div class="row-main"><h3>${dues.length} assuntos para revisar</h3><p>${dues.length?'Retome os assuntos antes de avançar.':'Nenhuma revisão vencida.'}</p></div>${btn('Abrir','navigate','data-route="revisoes"','quiet small')}</div><div class="row"><div class="row-main"><h3>${cards.length} cartões disponíveis</h3><p>Responda antes de revelar a resposta.</p></div>${btn('Praticar','navigate','data-route="cartoes"','quiet small')}</div></section>
 <section class="panel">${panelHead('Seu edital em movimento')}<div class="ring" style="--angle:${coverage*3.6}deg"><div><strong>${coverage}%</strong><small>teoria coberta</small></div></div><p style="text-align:center;font-size:.79rem;margin-top:18px">${covered} de ${topics.length} assuntos com teoria concluída. Cobertura e desempenho são medidas diferentes.</p></section></div></div>`;
}
function planRow(p){return `<div class="row"><button class="check ${p.status==='done'?'done':''}" data-action="plan-complete" data-id="${p.id}" aria-label="${p.status==='done'?'Ver registro concluído':'Registrar conclusão da atividade'}">${p.status==='done'?'✓':''}</button><div class="row-time">${esc(p.start)}<br><small>${esc(p.end)}</small></div><div class="row-main"><h3>${esc(topicName(p.subjectId,p.topicId))}</h3><p>${esc(subjectName(p.subjectId))} · ${p.type==='Revisão'?'Revisão':esc(p.reason||'Estudo planejado')}</p></div><div class="row-right">${p.status==='done'?tag('Concluída','green'):p.status==='skipped'?tag('Adiada','amber'):`<div class="actions">${btn('Foco','start-focus',`data-sid="${p.subjectId}" data-tid="${p.topicId||''}" data-pid="${p.id}"`,'quiet small')}${btn('Editar','plan-edit',`data-id="${p.id}"`,'quiet small')}</div>`}</div></div>`}
function viewPlan(){const e=exam(),start=addDays(planDate,-((weekday(planDate)+6)%7)),week=Array.from({length:7},(_,i)=>addDays(start,i)),items=e.plans.filter(p=>p.date===planDate).sort((a,b)=>a.start.localeCompare(b.start));return heading('Uma semana possível.','Distribua seus estudos nos horários que você realmente tem.',btn('Nova atividade','plan-new')+btn('Gerar plano adaptativo','plan-generate','','primary'))+
 `<div class="filters">${btn('Semana anterior','week-prev','','quiet')}${btn('Hoje','plan-today','','secondary small')}${btn('Próxima semana','week-next','','quiet')}<label style="margin-left:auto">Ir para data<input type="date" id="plan-date" value="${planDate}"></label></div><div class="week-strip">${week.map(d=>{const list=e.plans.filter(p=>p.date===d);return `<button class="day-pill ${d===planDate?'active':''}" data-action="plan-day" data-date="${d}"><span>${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'})}</span><strong>${d.slice(-2)}</strong><small>${list.length?list.filter(p=>p.status==='done').length+'/'+list.length:'Livre'}</small></button>`}).join('')}</div>
 <div class="grid two"><section class="panel">${panelHead(dateLabel(planDate,true),`${items.length} atividades · ${minutesLabel(items.reduce((a,p)=>a+Math.max(0,timeMin(p.end)-timeMin(p.start)),0))} planejados`)}${items.length?items.map(planRow).join(''):empty('Espaço para o que importa','Adicione uma atividade ou gere um plano com a sua disponibilidade.',btn('Gerar plano','plan-generate'))}</section><aside class="stack"><section class="panel">${panelHead('Como seu plano é construído')}<div class="insight"><h3>Importância no edital</h3><p>O peso de cada matéria e assunto influencia a distribuição.</p></div><div class="insight"><h3>Aprendizagem recente</h3><p>Acertos dos últimos 30 dias são suavizados para evitar conclusões com poucas questões.</p></div><div class="insight"><h3>Revisões e tempo sem estudar</h3><p>Assuntos com revisão pendente e pouco contato voltam para o plano.</p></div><div class="insight"><h3>Disponibilidade real</h3><p>Os blocos cabem nos seus horários. Atividades já existentes são respeitadas.</p></div></section><div class="note">O plano é uma sugestão ajustável. Ao concluir, registre o tempo real e o resultado do estudo.</div></aside></div>`}
function viewSyllabus(){const e=exam(),topics=allTopics(),covered=topics.filter(x=>['covered','mastered'].includes(x.t.stage)).length;return heading('Seu edital, em pequenos passos.','Personalize matérias, pesos e assuntos. A preparação começa pelo que sua prova exige.',btn('Adicionar matéria','subject-new','','primary'))+
 `<div class="metrics">${metric('Matérias ativas',e.subjects.filter(s=>!s.archived).length)}${metric('Assuntos',topics.length)}${metric('Teoria concluída',covered,`${topics.length?Math.round(covered/topics.length*100):0}% do edital`)}${metric('Consolidados',topics.filter(x=>x.t.stage==='mastered').length,'Marcados por você')}</div><div class="filters"><input id="topic-search" placeholder="Buscar matéria ou assunto" value="${esc(topicFilter)}" aria-label="Buscar no edital"><select id="topic-status" aria-label="Filtrar etapa"><option value="all">Todas as etapas</option>${stages.map(([v,l])=>`<option value="${v}" ${topicStatus===v?'selected':''}>${l}</option>`).join('')}</select></div>

function viewFocus(){const e=exam(),timer=db.timer;return heading('Uma coisa de cada vez.','Escolha um assunto. Feche as distrações. Comece um pequeno bloco de estudo.')+`<div class="grid two"><section class="panel timer-panel"><div class="segmented"><button class="${timer?.mode==='free'?'':'active'}" data-action="focus-mode" data-mode="countdown">Bloco de foco</button><button class="${timer?.mode==='free'?'active':''}" data-action="focus-mode" data-mode="free">Cronômetro livre</button></div><div class="timer-select">${timer?`<h2>${esc(topicName(timer.subjectId,timer.topicId,db.exams.find(e=>e.id===timer.examId)))}</h2><p>${esc(db.exams.find(e=>e.id===timer.examId)?.subjects.find(s=>s.id===timer.subjectId)?.name||'Sessão em andamento')}</p>`:`<label>Matéria<select id="focus-subject">${subjectOptions()}</select></label><label>Assunto<select id="focus-topic">${topicOptions(e.subjects.find(s=>!s.archived)?.id)}</select></label><label>Duração do bloco<select id="focus-duration"><option value="25">25 minutos</option><option value="30" selected>30 minutos</option><option value="45">45 minutos</option><option value="50">50 minutos</option></select></label>`}</div><div class="timer-circle"><div><div class="timer-count" id="timer-count">${timer?'00:00':'30:00'}</div><small id="timer-status">Pronto quando você estiver.</small></div></div><div class="actions">${timer?btn(timer.running?'Pausar':'Continuar','timer-toggle','','primary')+btn('Concluir e registrar','timer-finish')+btn('Descartar','timer-discard','','quiet'):btn('Começar a estudar','timer-start','','primary')}</div><p style="margin-top:22px">O tempo real só entra no histórico depois que você registra a sessão.</p></section><aside class="stack"><section class="panel">${panelHead('Faça o tempo valer')}<div class="insight"><h3>Antes de começar</h3><p>Defina uma tarefa concreta: resolver 15 questões, entender um conceito ou revisar seus erros.</p></div><div class="insight"><h3>Durante o bloco</h3><p>Explique com suas pr function viewQuestions(){const e=exam(),q=stats(e.sessions.filter(s=>s.qty>0)),mistakes=e.mistakes.filter(m=>mistakeFilter==='all'||(mistakeFilter==='open'?!m.resolved:m.resolved));return heading('Aprenda com cada erro.','Registre questões em uma única sessão e transforme dificuldades em prática.',btn('Registrar questões','questions-new','','primary'))+

function viewAnalytics(){const e=exam(),sessions=periodSessions(analyticsDays),st=stats(sessions),days=new Set(sessions.map(s=>s.date)).size,start=addDays(today(),1-analyticsDays),prev=stats(e.sessions.filter(s=>s.date>=addDays(start,-analyticsDays)&&s.date<start)),recs=recommendations(),buckets=Array.from({length:analyticsDays<=14?analyticsDays:10},(_,i)=>{const span=analyticsDays<=14?1:Math.ceil(analyticsDays/10),a=addDays(start,i*span),b=addDays(start,Math.min(analyticsDays-1,(i+1)*span-1));return {date:a,...stats(sessions.filter(s=>s.date>=a&&s.date<=b))}}).filter(x=>x.date<=today()),max=Math.max(30,...buckets.map(x=>x.m));return heading('Veja o que está mudando.','Compare esforço, cobertura e resultados sem confundir uma medida com a outra.',btn('Exportar registros','csv'))+`<div class="filters"><div class="segmented">${[7,14,30,90].map(n=>`<button class="${analyticsDays===n?'active':''}" data-action="analytics-range" data-days="${n}">${n} dias</button>`).join('')}</div><small>${dateLabel(start)} até ${dateLabel(today())}</small></div><div class="metrics">${metric('Tempo estudado',minutesLabel(st.m),`${st.m>=prev.m?'+':''}${minutesLabel(st.m-prev.m)} vs. período anterior`)}${metric('Questões resolvidas',st.q,`${st.q-prev.q>=0?'+':''}${st.q-prev.q} vs. período anterior`)}${metric('Acerto no período',st.accuracy===null?'Sem dados':st.accuracy+'%',prev.accuracy===null?'Sem referência anterior':`${st.accuracy===null?'Sem dados atuais':(st.accuracy-prev.accuracy>=0?'+':'')+(st.accuracy-prev.accuracy)+' pontos percentuais'}`)}${metric('Dias ativos',`${days} <span>/ ${analyticsDays}</span>`,`${Math.round(days/analyticsDays*100)}% dos dias com estudo`)}</div><div class="grid two"><section class="panel">${panelHead('Tempo de estudo','Minutos por dia ou grupo de dias')}<div class="chart" role="img" aria-label="Gráfico de minutos estudados no período">${buckets.map(x=>`<div class="chart-col" title="${dateLabel(x.date)}: ${minutesLabel(x.m)}"><span class="chart-value">${x.m||''}</span><div class="chart-bar" style="height:${x.m/max*155}px"></div><small>${dateLabel(x.date)}</small></div>`).join('')}</div><div class="screen-reader">${buckets.map(x=>`${dateLabel(x.date)}: ${x.m} minutos`).join('; ')}</div></section><section class="panel">${panelHead('Constância nos últimos 56 dias','Cada quadrado representa um dia de estudo')}<div class="heatmap">${Array.from({length:56},(_,i)=>{const d=addDays(today(),i-55),st=stats(e.sessions.filter(s=>s.date===d)),level=st.m>=90?3:st.m>=30?2:st.m>0||st.q>0?1:0;return `<div class="heat-cell" data-level="${level}" role="img" aria-label="${dateLabel(d)}: ${st.m} minutos e ${st.q} questões" title="${dateLabel(d)}: ${minutesLabel(st.m)}, ${st.q} questões"></div>`}).join('')}</div><small>Mais intensidade indica mais tempo. Questões sem tempo também contam como atividade.</small></section><section class="panel">${panelHead('Resultado por matéria','O tamanho da amostra aparece junto ao percentual')}<div class="table-wrap"><table><thead><tr><th>Matéria</th><th>Tempo</th><th>Questões</th><th>Acerto</th></tr></thead><tbody>${e.subjects.map(s=>{const st=stats(sessions.filter(x=>x.subjectId===s.id));return `<tr><td>${esc(s.name)}</td><td>${minutesLabel(st.m)}</td><td>${st.q}</td><td>${st.accuracy===null?'Sem dados':st.accuracy+'%'}${st.q>0&&st.q<10?'<small>Amostra pequena</small>':''}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel">${panelHead('Leituras para a próxima semana')}<div class="insight"><h3>${st.q<20?'Construa uma base de questões':'Compare assuntos, não apenas horas'}</h3><p>${st.q<20?'Ainda há poucas questões no período. Registre mais resultados antes de concluir que um assunto está dominado.':'Procure assuntos com mais erros e uma quantidade suficiente de questões para escolher seu próximo reforço.'}</p></div>${recs.slice(0,3).map(x=>`<div class="insight"><h3>${esc(x.t.name)}</h3><p>${esc(reason(x.s,x.t))}.</p></div>`).join('')}</section></div>`}

enção.</p></div><div class="insight"><h3>Replaneje o reforço</h3><p>Os resultados entram no desempenho recente e influenciam as sugestões de estudo.</p></div></section><div class="note">Cada matéria vira um registro no histórico. O simulado reúne esses registros e conta o tempo uma única vez.</div></aside></div>`}

function historyList(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Data e assunto</th><th>Tipo</th><th>Tempo real</th><th>Questões</th><th>Ações</th></tr></thead><tbody>${list.map(s=>`<tr><td>${dateLabel(s.date,true)}<small>${esc(subjectName(s.subjectId))} · ${esc(topicName(s.subjectId,s.topicId))}</small>${s.notes?`<small class="detail-text">${esc(s.notes)}</small>`:''}</td><td>${esc(s.type)}</td><td>${minutesLabel(s.minutes)}</td><td>${s.qty?`${s.correct}/${s.qty}<small>${Math.round(s.correct/s.qty*100)}% de acerto${s.board?' · '+esc(s.board):''}</small>`:'Sem questões'}</td><td>${btn('Editar','session-edit',`data-id="${s.id}"`,'quiet small')}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum registro encontrado','Suas sessões e questões aparecerão aqui depois de registradas.')}
function viewSettings(){const e=exam();return heading('Seu ritmo, suas escolhas.','Ajuste sua preparação e mantenha seus dados com você.',btn('Nova preparação','exam-new','','primary'))+`<div class="grid equal"><section class="panel">${panelHead('Seu perfil')}<form id="profile-form"><label>Como quer ser chamado?<input name="name" value="${esc(db.name)}" maxlength="80" required></label><label style="margin-top:15px">Aparência<select name="theme"><option value="light" ${db.theme==='light'?'selected':''}>Clara</option><option value="dark" ${db.theme==='dark'?'selected':''}>Escura</option></select></label><div class="actions" style="margin-top:20px"><button class="primary small">Salvar perfil</button></div></form></section><section class="panel">${panelHead('Seus dados ficam com você')}<p style="font-size:.84rem;margin-bottom:18px">O Norte funciona offline e salva no navegador deste aparelho. A sincronização entre dispositivos é feita por exportação e importação de backup.</p><div class="actions">${btn('Exportar backup','export','','primary')}${btn('Importar backup','import')}</div><p class="form-help">Aceita o backup do Norte e o JSON exportado pelo seu painel anterior. A importação aparece para revisão antes de ser aplicada.</p>${btn('Conhecer exemplo em outra preparação','demo','','quiet small')}</section>${e?`<section class="panel">${panelHead('Sua preparação')}<form id="exam-settings" class="form-grid"><label class="full">Nome da preparação<input name="name" value="${esc(e.name)}" required maxlength="120"></label><label>Cargo<input name="position" value="${esc(e.position)}" maxlength="150"></label><label>Banca<input name="board" value="${esc(e.board)}" maxlength="120"></label><label class="full">Data da prova<input name="date" type="date" value="${e.date}"></label><label>Meta diária de minutos<input name="dailyMinutes" type="number" min="5" max="1440" value="${e.dailyMinutes}" required></label><label>Meta diária de questões<input name="dailyQuestions" type="number" min="1" max="5000" value="${e.dailyQuestions}" required></label><label>Meta semanal de minutos<input name="weeklyMinutes" type="number" min="5" max="10080" value="${e.weeklyMinutes}" required></label><label>Referência de acerto (%)<input name="targetAccuracy" type="number" min="1" max="100" value="${e.targetAccuracy}" required></label><label>Duração dos blocos<select name="blockMinutes">${[25,30,40,45,50].map(n=>`<option value="${n}" ${e.blockMinutes===n?'selected':''}>${n} minutos</option>`).join('')}</select></label><div class="full"><button class="primary small">Salvar preparação</button></div></form></section><section class="panel">${panelHead('Disponibilidade semanal','Sem sobrecarregar os seus dias')}<form id="availability-form">${availabilityFields(e)}<div class="actions" style="margin-top:18px"><button class="primary small">Salvar horários</button></div><p class="form-help">Os horários devem começar e terminar no mesmo dia. Desative os dias de descanso.</p></form></section>`:''}<section class="panel">${panelHead('Como usar bem o Norte')}<div class="insight"><h3>1. Personalize o edital</h3><p>Cadastre os tópicos e ajuste os pesos à importância deles na sua prova.</p></div><div class="insight"><h3>2. Planeje e execute</h3><p>Gere a semana, escolha uma tarefa e registre o resultado real.</p></div><div class="insight"><h3>3. Revise e ajuste</h3><p>Retome dificuldades, pratique cartões e acompanhe a evolução por assunto.</p></div></section><section class="panel">${panelHead('Portabilidade e recuperação')}<p style="font-size:.84rem;margin-bottom:15px">Baixe um backup regularmente, especialmente antes de limpar os dados do navegador ou trocar de aparelho. Preparações são separadas dentro deste aplicativo.</p>${e?btn('Excluir esta preparação','exam-delete','','danger'):''}<p class="form-help">A exclusão exige confirmação e oferece a opção de desfazer imediatamente.</p></section></div>`}
function availabilityFields(e){return e.availability.map(a=>`<div class="availability"><label><input type="checkbox" name="enabled-${a.day}" ${a.enabled?'checked':''}>${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][a.day]}</label><input type="time" name="start-${a.day}" value="${a.start}" aria-label="Início de ${['domingo','segunda','terça','quarta','quinta','sexta','sábado'][a.day]}" required><input type="time" name="end-${a.day}" value="${a.end}" aria-label="Fim de ${['domingo','segunda','terça','quarta','quinta','sexta','sábado'][a.day]}" required><span class="day-total muted">${minutesLabel(Math.max(0,timeMin(a.end)-timeMin(a.start)))}</span></div>`).join('')}
function modal(title,subtitle,body,submit='Salvar',handler=null,extra=''){
 const dlg=$('#modal');if(dlg.open)dlg.close();
 dlg.innerHTML=`<div class="dialog-header"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div>${btn('Fechar','modal-close','','quiet small')}</div>${handler?'<form id="modal-form">':''}${body}${handler?`<div class="form-error" id="form-error" role="alert"></div><div class="dialog-actions">${extra}${btn('Cancelar','modal-close')}<button class="primary" type="submit">${submit}</button></div></form>`:extra}`;
 dlg.showModal();
 if(handler)$('#modal-form').onsubmit=event=>{event.preventDefault();const form=event.currentTarget;try{handler(Object.fromEntries(new FormData(form)),form)}catch(e){$('#form-error').textContent=e.message}};
 $('#form-subject')?.addEventListener('change',event=>{$('#form-topic').innerHTML=topicOptions(event.target.value)});
}
function closeModal(){$('#modal').close()}
function openExam(){modal('Sua próxima conquista','Comece com seu objetivo. Depois, personalize o edital.',`<div class="form-grid"><label class="full">Nome da preparação<input name="name" required maxlength="120" placeholder="Ex.: Concurso administrativo"></label><label>Cargo<input name="position" maxlength="150" placeholder="Opcional"></label><label>Banca<input name="board" maxlength="120" placeholder="Opcional"></label><label class="full">Data da prova<input type="date" name="date"></label><label class="full">Matérias iniciais<select name="base"><option value="standard">Base geral para personalizar</option><option value="empty">Começar com edital vazio</option></select></label><p class="full form-help">A base é um exemplo organizacional. Confira cada assunto no seu edital.</p></div>`,'Criar preparação',d=>{const e=newExam(d.name.trim());if(!e.name)throw Error('Informe um nome.');Object.assign(e,{position:d.position.trim(),board:d.board.trim(),date:d.date});if(d.base==='standard')e.subjects=baseSubjects();db.exams.push(e);db.activeExam=e.id;closeModal();go('hoje');commit('Preparação criada. Personalize o edital.');})}
function baseSubjects(){return [['Língua Portuguesa',5,['Interpretação de textos','Concordância verbal e nominal','Regência e crase','Pontuação']],['Raciocínio Lógico',4,['Proposições e conectivos','Equivalências e negações','Porcentagem e proporção']],['Direito Constitucional',4,['Princípios fundamentais','Direitos e garantias fundamentais','Organização do Estado']],['Direito Administrativo',4,['Princípios da Administração Pública','Atos administrativos','Licitações e contratos']],['Informática',3,['Sistemas operacionais','Planilhas eletrônicas','Segurança da informação']]].map(([name,weight,topics])=>({id:id(),name,weight,archived:false,topics:topics.map(name=>({id:id(),name,weight:3,stage:'new',notes:'',nextReview:null,reviewCount:0}))}))}
function openSubject(sid){const s=subject(sid);modal(s?'Editar matéria':'Adicionar matéria','O peso representa a importância da matéria na sua prova.',`<div class="form-grid"><label class="full">Nome<input name="name" value="${esc(s?.name||'')}" required maxlength="180"></label><label>Peso no edital (1 a 5)<input type="number" name="weight" min="1" max="5" step="1" value="${s?.weight||3}" required></label>${s?`<label class="checkbox-label"><input type="checkbox" name="archived" ${s.archived?'checked':''}>Arquivar matéria</label>`:`<label class="full">Assuntos, um por linha<textarea name="topics" rows="5" placeholder="Interpretação de textos\nConcordância verbal"></textarea></label>`}</div>`,'Salvar matéria',d=>{if(!d.name.trim()||!num(d.weight,1,5))throw Error('Informe nome e peso entre 1 e 5.');if(s)Object.assign(s,{name:d.name.trim(),weight:+d.weight,archived:d.archived==='on'});else exam().subjects.push({id:id(),name:d.name.trim(),weight:+d.weight,archived:false,topics:makeTopics(d.topics)});closeModal();commit('Matéria salva.');});}
function makeTopics(text){const names=[...new Set(text.split('\n').map(x=>x.trim()).filter(Boolean))];if(names.some(x=>x.length>250))throw Error('Use até 250 caracteres por assunto.');if(names.length>1000)throw Error('Adicione até 1.000 assuntos por vez.');return names.map(name=>({id:id(),name,weight:3,stage:'new',notes:'',nextReview:null,reviewCount:0}))}
function openTopic(sid,tid){const s=subject(sid),t=topic(sid,tid);modal(t?'Detalhes do assunto':'Adicionar assuntos',esc(s.name),t?`<div class="form-grid"><label class="full">Assunto<input name="name" value="${esc(t.name)}" required maxlength="250"></label><label>Peso (1 a 5)<input name="weight" type="number" min="1" max="5" value="${t.weight}" required></label><label>Etapa<select name="stage">${stages.map(([v,l])=>`<option value="${v}" ${v===t.stage?'selected':''}>${l}</option>`).join('')}</select></label><label class="full">Próxima revisão<input type="date" name="nextReview" value="${t.nextReview||''}"></label><label class="full">Notas do assunto<textarea name="notes" rows="5">${esc(t.notes)}</textarea></label></div>`:`<label>Assuntos, um por linha<textarea name="topics" rows="8" required placeholder="Cole os tópicos do seu edital"></textarea></label>`,'Salvar',d=>{if(t){if(!d.name.trim()||!num(d.weight,1,5))throw Error('Confira nome e peso do assunto.');Object.assign(t,{name:d.name.trim(),weight:+d.weight,stage:d.stage,nextReview:d.nextReview||null,notes:d.notes.trim()})}else{const existing=new Set(s.topics.map(t=>t.name.toLowerCase()));const added=makeTopics(d.topics).filter(t=>!existing.has(t.name.toLowerCase()));if(!added.length)throw Error('Inclua pelo menos um assunto novo.');s.topics.push(...added)}closeModal();commit('Edital atualizado.');},t?btn('Excluir assunto','topic-delete',`data-sid="${sid}" data-tid="${tid}"`,'danger small'):'')}
function sessionForm({existing=null,sid=null,tid=null,pid=null,type='Teoria',minutes=null,timer=false,review=false}={}){
 const e=exam(),p=e.plans.find(p=>p.id===pid),s=existing;sid=s?.subjectId||sid||p?.subjectId||e.subjects.find(s=>!s.archived)?.id;tid=s?.topicId||tid||p?.topicId||'';
 if(!sid){toast('Adicione uma matéria antes de registrar.');go('edital');return}
 modal(s?'Editar registro':review?'Registrar revisão':'Registrar uma sessão',s?'Corrija o registro sem duplicar seu histórico.':'Tempo e questões entram juntos no histórico.',`<div class="form-grid">${selection(sid,tid)}<label>Data<input type="date" name="date" value="${s?.date||(timer?db.timer?.date:p?.date)||today()}" max="${today()}" required></label><label>Tipo<select name="type">${['Teoria','Revisão','Questões','Simulado','Lei seca','Videoaula','Resumo'].map(v=>`<option ${v===(s?.type||p?.type||type)?'selected':''}>${v}</option>`).join('')}</select></label><label>Tempo real (minutos)<input name="minutes" type="number" min="0" max="1440" step="1" value="${s?.minutes??minutes??(p?timeMin(p.end)-timeMin(p.start):30)}" required></label><label>Banca (opcional)<input name="board" value="${esc(s?.board||e.board)}" maxlength="120"></label><label>Questões resolvidas<input name="qty" type="number" min="0" max="100000" step="1" value="${s?.qty||0}" required></label><label>Acertos<input name="correct" type="number" min="0" max="100000" step="1" value="${s?.correct||0}" required></label><label class="full">O que aprendeu ou precisa retomar?<textarea name="notes" rows="3">${esc(s?.notes||'')}</textarea></label>${review?`<label class="full">Como foi recuperar o conteúdo?<select name="reviewRating"><option value="again">Preciso retomar amanhã</option><option value="hard">Lembro com esforço, voltar em 3 dias</option><option value="good" selected>Lembro bem, ampliar o intervalo</option></select></label>`:s?'':`<label class="full checkbox-label"><input type="checkbox" name="scheduleReview" checked>Agendar revisão do assunto em 1 dia</label>`}<p class="full form-help">Se registrou este bloco em outra tela, edite o registro existente para evitar duplicidade.</p></div>`,'Salvar registro',d=>{
  if(!validDate(d.date)||d.date>today())throw Error('Use uma data válida, hoje ou anterior.');
  if(!subject(d.subjectId)||d.topicId&&!topic(d.subjectId,d.topicId))throw Error('Escolha uma matéria e um assunto válidos.');
  if(!num(d.minutes,0,1440)||!Number.isInteger(+d.minutes)||!num(d.qty,0,100000)||!Number.isInteger(+d.qty)||!num(d.correct,0,+d.qty)||!Number.isInteger(+d.correct))throw Error('Confira os números: acertos não podem superar a quantidade de questões.');
  if(+d.minutes===0&&+d.qty===0)throw Error('Informe tempo de estudo ou questões resolvidas.');
  const record={id:s?.id||id(),created:s?.created||new Date().toISOString(),date:d.date,subjectId:d.subjectId,topicId:d.topicId||null,type:d.type,minutes:+d.minutes,qty:+d.qty,correct:+d.correct,notes:d.notes.trim(),board:d.board.trim(),planId:s?.planId||pid||null,source:s?.source||(timer?'timer':p?'plan':'manual')};
  if(s)Object.assign(s,record);else e.sessions.push(record);
  if(p){p.status='done';p.sessionId=record.id}
  const t=topic(d.subjectId,d.topicId);
  if(t){if(t.stage==='new')t.stage='learning';if(review){t.reviewCount=(t.reviewCount||0)+1;t.nextReview=addDays(d.date,d.reviewRating==='again'?1:d.reviewRating==='hard'?3:[7,14,30,60][Math.min(3,t.reviewCount-1)])}else if(d.scheduleReview)t.nextReview=addDays(d.date,1)}
  if(timer)db.timer=null;closeModal();commit('Sessão registrada. Bom trabalho.');
 },s?btn('Excluir registro','session-delete',`data-id="${s.id}"`,'danger small'):'');
}
function openMistake(mid){const m=exam().mistakes.find(x=>x.id===mid),sid=m?.subjectId||exam().subjects.find(s=>!s.archived)?.id;if(!sid)return toast('Adicione uma matéria primeiro.');modal(m?'Editar dificuldade':'Anotar uma dificuldade','Registre o raciocínio para aprender com o erro.',`<div class="form-grid">${selection(sid,m?.topicId)}<label class="full">Pergunta ou dificuldade<input name="title" required value="${esc(m?.title||'')}" maxlength="400" placeholder="O que você confundiu?"></label><label class="full">Motivo<select name="category">${['Conceito','Interpretação','Memorização','Atenção','Cálculo','Outro'].map(v=>`<option ${m?.category===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="full">Explicação correta e como evitar o erro<textarea name="explanation" required rows="5">${esc(m?.explanation||'')}</textarea></label></div>`,'Salvar dificuldade',d=>{if(!d.title.trim()||!d.explanation.trim())throw Error('Preencha a dificuldade e a explicação.');const data={id:m?.id||id(),subjectId:d.subjectId,topicId:d.topicId||null,title:d.title.trim(),category:d.category,explanation:d.explanation.trim(),resolved:m?.resolved||false,date:m?.date||today()};if(m)Object.assign(m,data);else exam().mistakes.push(data);closeModal();commit('Dificuldade salva.');},m?btn('Excluir','mistake-delete',`data-id="${m.id}"`,'danger small'):'')}
function openCard(cid,prefill={}){const c=exam().cards.find(x=>x.id===cid),sid=c?.subjectId||prefill.subjectId||exam().subjects.find(s=>!s.archived)?.id;if(!sid)return toast('Adicione uma matéria primeiro.');modal(c?'Editar cartão':'Criar cartão de memória','Uma pergunta específica e uma resposta clara.',`<div class="form-grid">${selection(sid,c?.topicId||prefill.topicId)}<label class="full">Pergunta<textarea name="front" required rows="3">${esc(c?.front||prefill.front||'')}</textarea></label><label class="full">Resposta<textarea name="back" required rows="4">${esc(c?.back||prefill.back||'')}</textarea></label>${c?`<label>Próxima revisão<input type="date" name="due" value="${c.due}" required></label><label class="checkbox-label"><input type="checkbox" name="suspended" ${c.suspended?'checked':''}>Suspender cartão</label>`:''}</div>`,'Salvar cartão',d=>{if(!d.front.trim()||!d.back.trim())throw Error('Preencha a pergunta e a resposta.');const data={id:c?.id||id(),subjectId:d.subjectId,topicId:d.topicId||null,front:d.front.trim(),back:d.back.trim(),due:d.due||today(),interval:c?.interval||0,reps:c?.reps||0,suspended:d.suspended==='on'};if(c)Object.assign(c,data);else exam().cards.push(data);cardAnswer=false;closeModal();commit('Cartão salvo.');},c?btn('Excluir','card-delete',`data-id="${c.id}"`,'danger small'):'')}
function openResource(rid){const r=exam().resources.find(x=>x.id===rid),sid=r?.subjectId||exam().subjects.find(s=>!s.archived)?.id;if(!sid)return toast('Adicione uma matéria primeiro.');modal(r?'Editar material':'Adicionar material','Reúna referências e notas para seus estudos.',`<div class="form-grid">${selection(sid,r?.topicId)}<label class="full">Título<input name="title" value="${esc(r?.title||'')}" required maxlength="250"></label><label class="full">Tipo<select name="kind">${['Nota','Aula','PDF online','Legislação','Questões','Outro'].map(v=>`<option ${r?.kind===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="full">Link (opcional)<input name="url" type="url" value="${esc(r?.url||'')}" placeholder="https://"></label><label class="full">Notas e resumo<textarea name="notes" rows="6">${esc(r?.notes||'')}</textarea></label></div>`,'Salvar material',d=>{if(d.url&&!safeURL(d.url))throw Error('Use um link que comece com https:// ou http://.');if(!d.title.trim())throw Error('Informe um título.');const data={id:r?.id||id(),subjectId:d.subjectId,topicId:d.topicId||null,title:d.title.trim(),kind:d.kind,url:d.url,notes:d.notes.trim()};if(r)Object.assign(r,data);else exam().resources.push(data);closeModal();commit('Material salvo.');},r?btn('Excluir','resource-delete',`data-id="${r.id}"`,'danger small'):'')}
function openMock(){const e=exam(),subjects=e.subjects.filter(s=>!s.archived);if(!subjects.length)return toast('Adicione matérias ao edital primeiro.');modal('Registrar simulado','Informe o resultado por matéria, sem repetir uma sessão já registrada.',`<div class="form-grid"><label class="full">Nome do simulado<input name="name" maxlength="200" placeholder="Ex.: Simulado completo 01" required></label><label>Data<input name="date" type="date" value="${today()}" max="${today()}" required></label><label>Tempo máximo previsto (min)<input name="timeLimit" type="number" value="180" min="1" max="1440" required></label><label class="full">Desconto por erro<select name="penalty"><option value="0">Sem desconto</option><option value="0.5">0,5 ponto</option><option value="1">1 ponto</option></select></label></div><div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>Matéria</th><th>Resolvidas</th><th>Acertos</th><th>Minutos</th></tr></thead><tbody>${subjects.map(s=>`<tr><td>${esc(s.name)}</td><td><input type="number" name="qty-${s.id}" value="0" min="0" max="100000" aria-label="Questões de ${esc(s.name)}" required></td><td><input type="number" name="correct-${s.id}" value="0" min="0" max="100000" aria-label="Acertos de ${esc(s.name)}" required></td><td><input type="number" name="minutes-${s.id}" value="0" min="0" max="1440" aria-label="Minutos de ${esc(s.name)}" required></td></tr>`).join('')}</tbody></table></div><label style="margin-top:18px">O que ajustar no próximo simulado?<textarea name="notes" rows="3"></textarea></label>`,'Salvar simulado',d=>{if(!d.name.trim()||!validDate(d.date)||d.date>today())throw Error('Confira o nome e a data.');const records=[];for(const s of subjects){const qty=+d['qty-'+s.id],correct=+d['correct-'+s.id],minutes=+d['minutes-'+s.id];if(!num(qty,0,100000)||!Number.isInteger(qty)||!num(correct,0,qty)||!Number.isInteger(correct)||!num(minutes,0,1440)||!Number.isInteger(minutes))throw Error('Confira os números de '+s.name+'.');if(qty function openPlan(pid){const p=exam().plans.find(x=>x.id===pid),sid=p?.subjectId||exam().subjects.find(s=>!s.archived)?.id;if(!sid)return toast('Adicione matérias e assuntos primeiro.');modal(p?'Editar atividade':'Planejar atividade','Escolha um horário e uma tarefa possível.',`<div class="form-grid">${selection(sid,p?.topicId)}<label>Data<input type="date" name="date" value="${p?.date||planDate}" required></label><label>Tipo<select name="type"><option ${p?.type==='Teoria'?'selected':''}>Teoria</option><option ${p?.type==='Revisão'?'selected':''}>Revisão</option><option ${p?.type==='Questões'?'selected':''}>Questões</option></select></label><label>Início<input type="time" name="start" value="${p?.start||'19:00'}" required></label><label>Fim<input type="time" name="end" value="${p?.end||'19:30'}" required></label><label class="full">Tarefa ou objetivo<input name="reason" value="${esc(p?.reason||'')}" maxlength="250" placeholder="Ex.: resolver 15 questões e corrigir os erros"></label>${p?`<label class="full">Estado<select name="status"><option value="planned" ${p.status==='planned'?'selected':''}>Planejada</option><option value="skipped" ${p.status==='skipped'?'selected':''}>Adiada</option></select></label>`:''}</div>`,'Salvar atividade',d=>{if(timeMin(d.end)<=timeMin(d.start))throw Error('O fim precisa ser depois do início no mesmo dia.');if(exam().plans.some(x=>x.id!==pid&&x.date===d.date&&x.status!=='skipped'&&timeMin(x.start)<timeMin(d.end)&&timeMin(x.end)>timeMin(d.start)))throw Error('Este horário se sobrepõe a uma atividade existente.');const data={id:p?.id||id(),date:d.date,start:d.start,end:d.end,subjectId:d.subjectId,topicId:d.topicId||null,type:d.type,reason:d.reason.trim(),status:d.status||'planned',sessionId:p?.sessionId||null};if(p)Object.assign(p,data);else exam().plans.push(data);planDate=d.date;closeModal();commit('Atividade salva.');},p?btn('Excluir atividade','plan-delete',`data-id="${p.id}"`,'danger small'):'')}

async function readImport(file){if(!file)return;if(file.size>20*1024*1024)return toast('O limite de importação é 20 MB.');try{const parsed=JSON.parse(await file.text());const legacy=parsed.version!==1;let imported;if(legacy)imported=migrateLegacy(parsed);else{validateBackup(parsed);imported=parsed}const text=legacy?`${imported.sessions.length} registros serão adicionados em uma nova preparação. Os dados atuais serão preservados. Confira possíveis tempos duplicados no histórico antigo.`:`${imported.exams.length} preparações serão importadas. O conteúdo atual deste aplicativo será substituído. Exporte um backup antes de continuar.`;modal('Confira a importação',text,`<div class="note">${legacy?'Importação do painel anterior.':'Backup Norte validado.'} Nenhuma mudança foi aplicada ainda.</div>`,'Importar dados',()=>{if(db.timer)throw Error('Conclua ou descarte a sessão de foco antes de importar.');snapshot();if(legacy){db.exams.push(imported);db.activeExam=imported.id}else{db=clone(imported);if(db.timer){db.timer.running=false;db.timer.startedAt=Date.now()}}closeModal();go('hoje');commit('Backup importado.',true)})}catch(e){toast(e.message.includes('JSON')?'Arquivo JSON inválido.':e.message)}finally{$('#import-file').value=''}}
function loadDemo(){const e=newExam('Preparação de exemplo');e.date=addDays(today(),84);e.board='Banca de exemplo';e.position='Área administrativa';e.subjects=baseSubjects();e.subjects.forEach((s,si)=>s.topics.forEach((t,ti)=>{if(ti<2)t.stage='covered';else if(ti===2)t.stage='learning';if(ti===0)t.nextReview=addDays(today(),si-2)}));for(let day=0;day<14;day++){if(day===4||day===9)continue;const s=e.subjects[day%e.subjects.length],t=s.topics[day%s.topics.length];e.sessions.push({id:id(),created:new Date().toISOString(),date:addDays(today(),-day),subjectId:s.id,topicId:t.id,type:day%3?'Questões':'Teoria',minutes:30+(day%3)*15,qty:day%3?20:0,correct:day%3?12+day%7:0,notes:day===0?'Retomar a justificativa das questões incorretas.':'',board:'Banca de exemplo',planId:null,source:'demo'})}const s=e.subjects[0],t=s.topics[1];e.cards.push({id:id(),subjectId:s.id,topicId:t.id,front:'Qual é a diferença entre concordância verbal e nominal?',back:'A verbal relaciona o verbo ao sujeito. A nominal relaciona adjetivos, artigos e outros termos aos substantivos.',due:today(),interval:0,reps:0,suspended:false});e.mistakes.push({id:id(),subjectId:s.id,topicId:t.id,title:'Confundir sujeito com o termo mais próximo do verbo',explanation:'Identifique o núcleo do sujeito antes de verificar a flexão verbal. Refaça as questões em que um termo intermediário causou confusão.',category:'Conceito',resolved:false,date:today()});e.resources.push({id:id(),subjectId:s.id,topicId:t.id,title:'Minha rotina de correção',kind:'Nota',url:'',notes:'1. Tentar responder sem consultar.\n2. Conferir a justificativa.\n3. Explicar a regra com minhas palavras.\n4. Criar um cartão se continuar difícil.'});snapshot();db.exams.push(e);db.activeExam=e.id;e.plans=generatePlan(e,today(),7,30,e.availability,false);closeModal();go('hoje');commit('Exemplo criado em uma preparação separada.',true)}
const actions={
 'navigate':b=>{closeModal();go(b.dataset.route)},'modal-close':closeModal,'theme':()=>{db.theme=db.theme==='dark'?'light':'dark';commit()},'search':openSearch,'exam-new':openExam,'demo':()=>{if(db.timer)return toast('Finalize sua sessão antes de abrir o exemplo.');loadDemo()},'export':exportBackup,'csv':exportCSV,'import':()=>$('#import-file').click(),'recovery-export':()=>{if(recoveryRaw)download('norte-dados-para-recuperacao.json',recoveryRaw,'application/json')},
 'undo':()=>{if(!undoState)return;db=undoState;undoState=null;persist();render();toast('Alteração desfeita.')},
 'subject-new':()=>openSubject(),'subject-edit':b=>openSubject(b.dataset.id),'topic-new':b=>openTopic(b.dataset.sid),'topic-edit':b=>openTopic(b.dataset.sid,b.dataset.tid),
 'topic-delete':b=>confirmDialog('Excluir assunto?','Os registros existentes serão mantidos como estudo geral da matéria.',()=>{snapshot();const e=exam(),s=subject(b.dataset.sid);s.topics=s.topics.filter(t=>t.id!==b.dataset.tid);for(const col of ['sessions','plans','cards','mistakes','resources'])e[col].forEach(x=>{if(x.topicId===b.dataset.tid)x.topicId=null});closeModal();commit('Assunto excluído.',true)},'Excluir assunto'),
 'session':()=>exam()?sessionForm():openExam(),'questions-new':()=>sessionForm({type:'Questões',minutes:0}),'session-edit':b=>sessionForm({existing:exam().sessions.find(s=>s.id===b.dataset.id)}),'session-delete':b=>removeItem('sessions',b.dataset.id,'registro'),
 'plan-new':()=>openPlan(),'plan-edit':b=>openPlan(b.dataset.id),'plan-delete':b=>removeItem('plans',b.dataset.id,'atividade'),'plan-generate':openGenerator,'plan-day':b=>{planDate=b.dataset.date;render()},'plan-today':()=>{planDate=today();render()},'week-prev':()=>{planDate=addDays(planDate,-7);render()},'week-next':()=>{planDate=addDays(planDate,7);render()},
 'plan-complete':b=>{const p=exam().plans.find(p=>p.id===b.dataset.id);if(p.status==='done'){const s=exam().sessions.find(s=>s.id===p.sessionId);if(s)sessionForm({existing:s});return}sessionForm({pid:p.id})},
 'start-focus':b=>startFocus(b.dataset.sid,b.dataset.tid,b.dataset.pid),'focus-mode':b=>{if(db.timer)return toast('Conclua o bloco antes de trocar o modo.');focusMode=b.dataset.mode;syncFocusUI()},
 'timer-start':()=>{const sid=$('#focus-subject')?.value,tid=$('#focus-topic')?.value,duration=+$('#focus-duration').value;if(!sid)return toast('Adicione uma matéria primeiro.');startFocus(sid,tid);db.timer.duration=duration*60;persist();updateTimer()},'timer-toggle':toggleTimer,'timer-finish':finishTimer,'timer-discard':()=>confirmDialog('Descartar esta sessão?','O tempo desta sessão não será adicionado ao histórico.',()=>{snapshot();db.timer=null;closeModal();commit('Sessão descartada.',true)},'Descartar'),
 'mistake-new':()=>openMistake(),'mistake-edit':b=>openMistake(b.dataset.id),'mistake-delete':b=>removeItem('mistakes',b.dataset.id,'dificuldade'),'mistake-resolve':b=>{const m=exam().mistakes.find(m=>m.id===b.dataset.id);m.resolved=!m.resolved;commit(m.resolved?'Dificuldade marcada como resolvida.':'Dificuldade reaberta.')},'mistake-filter':b=>{mistakeFilter=b.dataset.value;render()},
 'card-from-mistake':b=>{const m=exam().mistakes.find(m=>m.id===b.dataset.id);openCard(null,{subjectId:m.subjectId,topicId:m.topicId,front:m.title,back:m.explanation})},'review-topic':b=>sessionForm({sid:b.dataset.sid,tid:b.dataset.tid,type:'Revisão',review:true}),
 'card-new':()=>openCard(),'card-edit':b=>openCard(b.dataset.id),'card-delete':b=>removeItem('cards',b.dataset.id,'cartão'),'card-flip':()=>{cardAnswer=!cardAnswer;render()},'card-mode':b=>{cardMode=b.dataset.value;cardAnswer=false;reviewCardId=null;render()},
 'card-rate':b=>{const c=exam().cards.find(c=>c.id===b.dataset.id);c.reps++;c.interval=b.dataset.value==='again'?1:b.dataset.value==='hard'?3:b.dataset.value==='easy'?Math.min(180,Math.max(7,Math.round((c.interval||3)*3))):Math.min(120,Math.max(4,Math.round((c.interval||2)*2)));c.due=addDays(today(),c.interval);if(cardMode==='all'){const list=exam().cards.filter(x=>!x.suspended);reviewCardId=list[(list.findIndex(x=>x.id===c.id)+1)%list.length]?.id}else reviewCardId=null;cardAnswer=false;commit('Próxima revisão em '+c.interval+' dias.')},
 'resource-new':()=>openResource(),'resource-edit':b=>openResource(b.dataset.id),'resource-delete':b=>removeItem('resources',b.dataset.id,'material'),'card-from-resource':b=>{const r=exam().resources.find(r=>r.id===b.dataset.id);openCard(null,{subjectId:r.subjectId,topicId:r.topicId,front:r.title,back:r.notes})},'analytics-range':b=>{analyticsDays=+b.dataset.days;render()},
 'mock-new':openMock,'mock-delete':b=>confirmDialog('Excluir simulado?','Os registros deste simulado também serão removidos do histórico e das estatísticas.',()=>{snapshot();const e=exam(),m=e.mockExams.find(m=>m.id===b.dataset.id);e.sessions=e.sessions.filter(s=>!m.sessionIds.includes(s.id));e.mockExams=e.mockExams.filter(x=>x.id!==m.id);closeModal();commit('Simulado excluído.',true)},'Excluir simulado'),
 'exam-delete':()=>{if(db.timer)return toast('Conclua ou descarte a sessão de foco antes de excluir.');confirmDialog('Excluir esta preparação?',`Todos os registros de ${exam().name} serão removidos deste aplicativo. Exporte um backup para manter uma cópia.`,()=>{snapshot();db.exams=db.exams.filter(e=>e.id!==db.activeExam);db.activeExam=db.exams[0]?.id||null;closeModal();commit('Preparação excluída.',true)},'Excluir preparação')}
};
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;event.preventDefault();try{const result=actions[b.dataset.action]?.(b);if(result?.catch)result.catch(e=>toast('Não foi possível concluir: '+e.message))}catch(e){toast('Não foi possível concluir: '+e.message);console.error(e)}});
document.addEventListener('change',event=>{const el=event.target;try{
 if(el.id==='exam-select'){if(db.timer)return toast('Conclua ou descarte a sessão de foco para trocar de preparação.'),render();db.activeExam=el.value;reviewCardId=null;cardAnswer=false;commit()}
 if(el.dataset.stage){const t=topic(el.dataset.sid,el.dataset.stage);t.stage=el.value;commit('Etapa atualizada.')}
 if(el.id==='topic-status'){topicStatus=el.value;$('#syllabus-list').innerHTML=syllabusList()}
 if(el.id==='plan-date'){planDate=el.value||today();render()}
 if(el.id==='focus-subject')$('#focus-topic').innerHTML=topicOptions(el.value);
 if(el.id==='focus-duration'&&!db.timer&&focusMode==='countdown')$('#timer-count').textContent=el.value+':00';
 if(el.id==='history-type'){historyFilter=el.value;render()}
 if(el.id==='import-file')readImport(el.files[0]);
}catch(e){toast(e.message)}});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='topic-search'){topicFilter=el.value;$('#syllabus-list').innerHTML=syllabusList()}if(el.id==='history-search'){sessionFilter=el.value;const pos=el.selectionStart;render();$('#history-search').focus();$('#history-search').setSelectionRange(pos,pos)}});
document.addEventListener('submit',event=>{const form=event.target;if(!['profile-form','exam-settings','availability-form'].includes(form.id))return;event.preventDefault();try{const d=Object.fromEntries(new FormData(form));if(form.id==='profile-form'){if(!d.name.trim())throw Error('Informe seu nome.');db.name=d.name.trim();db.theme=d.theme}if(form.id==='exam-settings'){if(!d.name.trim())throw Error('Informe o nome da preparação.');const e=exam();for(const [key,min,max] of [['dailyMinutes',5,1440],['dailyQuestions',1,5000],['weeklyMinutes',5,10080],['targetAccuracy',1,100],['blockMinutes',10,120]]){if(!num(d[key],min,max))throw Error('Confira as metas.');e[key]=+d[key]}Object.assign(e,{name:d.name.trim(),board:d.board.trim(),position:d.position.trim(),date:d.date})}if(form.id==='availability-form')exam().availability=readAvailability(d);commit('Preferências salvas.')}catch(e){toast(e.message)}});
$('#menu-toggle').addEventListener('click',()=>{const open=$('.sidebar').classList.toggle('open');$('#menu-toggle').setAttribute('aria-expanded',String(open))});
document.addEventListener('pointerdown',event=>{if($('.sidebar').classList.contains('open')&&!event.target.closest('.sidebar')&&!event.target.closest('#menu-toggle')){$('.sidebar').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false')}});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const rect=event.target.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal()}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch()}if(event.key==='Escape'){$('.sidebar').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false')}if(event.code==='Space'&&route==='cartoes'&&!$('#modal').open&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(event.target.tagName)&&reviewCardId){event.preventDefault();cardAnswer=!cardAnswer;render()}});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
window.addEventListener('storage',event=>{if(event.key===STORE&&event.newValue){try{const next=JSON.parse(event.newValue);validateBackup(next);db=next;render();toast('Dados atualizados em outra aba.')}catch{toast('A atualização de outra aba não pôde ser carregada.')}}});
setInterval(updateTimer,1000);
go(location.hash.slice(1)||'hoje');
